<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rumbo · Plataforma del Experto Técnico</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');

/* ===== Mismos tokens que rumbo_prototype.html/candidate_portal.html --
   tercera superficie del mismo producto, mismo Design System. ===== */
:root {
  --rb-blue: #382EDC; --rb-blue-700: #2A22A8; --rb-blue-300: #8078F0;
  --rb-cyan: #47EBEB; --rb-cyan-600: #19B8B8; --rb-purple: #8452FD; --rb-orange: #FF5A36;
  --rb-ink: #0A0A0B; --rb-paper: #F4F2ED; --rb-white: #FFFFFF;
  --bg: #0A0A0B; --bg-elev: #121214; --bg-subtle: #17171A; --surface: #1B1B1F; --surface-2: #242428;
  --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.16);
  --text: #FAFAFA; --text-muted: rgba(255,255,255,.64); --text-dim: rgba(255,255,255,.44);
  --accent: var(--rb-blue); --accent-fg: #FFFFFF; --accent-soft: rgba(56,46,220,.14); --highlight: var(--rb-cyan);
  --success: #3CCB7F; --warning: #FFB020; --danger: #FF5A36;
  --cyan-text: var(--rb-cyan); --success-text: var(--success); --warning-text: var(--warning); --danger-text: var(--danger);
  --radius-1: 4px; --radius-2: 8px; --radius-3: 12px; --radius-4: 16px; --radius-full: 9999px;
  --shadow-1: 0 1px 2px rgba(0,0,0,.4); --shadow-2: 0 4px 12px rgba(0,0,0,.5); --shadow-3: 0 12px 32px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.4);
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;
  --fs-xs: 11px; --fs-sm: 12px; --fs-base: 14px; --fs-md: 16px; --fs-lg: 18px; --fs-xl: 22px; --fs-2xl: 28px;
  --ease-out: cubic-bezier(.2,.7,.2,1); --dur-2: 200ms;
  color-scheme: dark;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: var(--rb-paper); --bg-elev: #FFFFFF; --bg-subtle: #EAE7DF; --surface: #FFFFFF; --surface-2: #F0EDE5;
  --border: rgba(10,10,11,.08); --border-strong: rgba(10,10,11,.16);
  --text: var(--rb-ink); --text-muted: rgba(10,10,11,.64); --text-dim: rgba(10,10,11,.44);
  --accent-soft: rgba(56,46,220,.10);
  --cyan-text: #0D7878; --warning-text: #956000; --success-text: #217B4B; --danger-text: #D42600;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Space Grotesk', system-ui, sans-serif;
  background: radial-gradient(900px 480px at 14% -10%, rgba(56,46,220,.16), transparent 60%), var(--bg);
  background-attachment: fixed;
  color: var(--text); min-height: 100vh;
}
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.01em; }
p { margin: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; border-radius: var(--radius-2); padding: 10px 16px; font-family: inherit; font-size: var(--fs-sm); font-weight: 600; cursor: pointer; background: var(--accent); color: var(--accent-fg); transition: filter var(--dur-2) var(--ease-out), transform var(--dur-2) var(--ease-out); white-space: nowrap; }
.btn:hover { filter: brightness(1.1); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
.btn.secondary { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.btn.ghost { background: transparent; color: var(--text); border-color: transparent; }
.btn.ghost:hover { background: var(--surface); }
.btn.sm { padding: 6px 12px; font-size: var(--fs-xs); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-3); padding: var(--sp-5); }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-xs); font-weight: 600; padding: 4px 10px; border-radius: var(--radius-full); line-height: 1; }
.input, .select, textarea { width: 100%; font-family: inherit; font-size: var(--fs-base); padding: 10px 12px; border-radius: var(--radius-2); border: 1px solid var(--border-strong); background: var(--bg-elev); color: var(--text); }
.input:focus, .select:focus, textarea:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { resize: vertical; min-height: 72px; font-family: inherit; }
label.field { display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-sm); color: var(--text-muted); font-weight: 600; }

/* ---- Shell ---- */
.rb-topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; padding: var(--sp-4) var(--sp-6); background: rgba(18,18,20,.75); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: var(--sp-3); }
:root[data-theme="light"] .rb-topbar { background: rgba(255,255,255,.75); }
.rb-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: var(--fs-lg); }
.rb-brand svg { display: block; height: 22px; width: auto; color: var(--text); }
.rb-user { display: flex; align-items: center; gap: 10px; font-size: var(--fs-sm); }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--accent-soft); color: var(--rb-blue-300); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: var(--fs-sm); flex-shrink: 0; }
:root[data-theme="light"] .avatar { color: var(--rb-blue); }
.rb-theme-btn { background: transparent; border: 1px solid var(--border-strong); border-radius: var(--radius-2); width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted); flex-shrink: 0; }
.rb-main { max-width: 820px; margin: 0 auto; padding: var(--sp-8) var(--sp-6) var(--sp-10); }
.rb-page-title { font-size: var(--fs-2xl); margin-bottom: var(--sp-2); }
.rb-page-sub { color: var(--text-muted); font-size: var(--fs-base); margin-bottom: var(--sp-6); }
@media (max-width: 640px) { .rb-main { padding: var(--sp-5) var(--sp-4); } }

/* ---- Cola de entrevistas ---- */
.rb-entrevista-card { margin-bottom: var(--sp-4); cursor: pointer; transition: border-color var(--dur-2) var(--ease-out); }
.rb-entrevista-card:hover { border-color: var(--border-strong); }
.rb-entrevista-top { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--sp-3); margin-bottom: var(--sp-2); }
.rb-entrevista-nombre { font-size: var(--fs-lg); font-weight: 600; margin-bottom: 2px; }
.rb-entrevista-sub { color: var(--text-muted); font-size: var(--fs-sm); display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.rb-entrevista-fecha { display: flex; align-items: center; gap: 6px; font-size: var(--fs-sm); font-weight: 600; margin-top: var(--sp-2); }
.rb-entrevista-fecha.vencida { color: var(--warning-text); }
.rb-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.rb-tag { font-size: var(--fs-xs); padding: 3px 9px; border-radius: var(--radius-1); background: var(--bg-elev); border: 1px solid var(--border); color: var(--text-muted); }

/* ---- Referencia (hard skills / matching) -- mismo lenguaje visual que ya
   usan rumbo_prototype.html/candidate_portal.html: rb-detail-row + rb-dots
   de solo lectura, para que se sienta el mismo producto. ---- */
.rb-detail-row { display: flex; align-items: center; justify-content: space-between; font-size: var(--fs-sm); padding: var(--sp-1) 0; border-bottom: 1px solid var(--border); gap: var(--sp-2); }
.rb-detail-row:last-child { border-bottom: none; }
.rb-detail-row span:first-child { color: var(--text-muted); }
.rb-dots { display: flex; align-items: center; gap: 4px; }
.rb-dot { width: 16px; height: 4px; border-radius: var(--radius-full); background: var(--border); }
.rb-dot.filled { background: var(--rb-blue); }
.rb-score-row { display: flex; align-items: center; gap: var(--sp-3); }
.rb-score-bar { flex: 1; height: 6px; background: var(--bg-elev); border-radius: var(--radius-full); overflow: hidden; }
.rb-score-fill { height: 100%; border-radius: var(--radius-full); background: var(--rb-cyan); }
.rb-score-num { font-size: var(--fs-sm); font-weight: 600; color: var(--cyan-text); min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
h3.rb-subsection-label { font-size: var(--fs-sm); color: var(--text-muted); font-weight: 600; margin: var(--sp-5) 0 var(--sp-2) 0; text-transform: uppercase; letter-spacing: .04em; }
h3.rb-subsection-label:first-child { margin-top: 0; }

/* ---- Formulario de evaluación -- dots MÁS GRANDES y clickeables (a
   diferencia de los rb-dots de solo lectura de arriba), para que quede
   claro a simple vista qué es referencia y qué es lo que el experto tiene
   que completar. ---- */
.rb-eval-dim { padding: var(--sp-4) 0; border-bottom: 1px solid var(--border); }
.rb-eval-dim:last-of-type { border-bottom: none; }
.rb-eval-dim-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: var(--sp-2); }
.rb-eval-dim-nombre { font-weight: 600; font-size: var(--fs-base); }
.rb-eval-dim-peso { font-size: var(--fs-xs); color: var(--text-dim); }
.rb-rating-picker { display: flex; gap: 6px; margin-bottom: var(--sp-2); }
.rb-rating-dot { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--border-strong); background: var(--bg-elev); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: var(--fs-sm); font-weight: 600; color: var(--text-muted); transition: border-color var(--dur-2) var(--ease-out), background var(--dur-2) var(--ease-out), color var(--dur-2) var(--ease-out); }
.rb-rating-dot:hover { border-color: var(--accent); }
.rb-rating-dot.selected { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.rb-eval-resultado { display: flex; flex-direction: column; gap: var(--sp-2); }
.rb-decision-row { display: flex; gap: var(--sp-2); }
.rb-decision-row .btn { flex: 1 1 140px; }
.rb-decision-row .btn.avanza.selected { background: var(--success); border-color: var(--success); color: var(--rb-ink); }
.rb-decision-row .btn.no-avanza.selected { background: var(--danger); border-color: var(--danger); color: var(--rb-white); }

/* ---- Reporte ya enviado (solo lectura) ---- */
.rb-reporte-dim { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--sp-3); padding: var(--sp-3) 0; border-bottom: 1px solid var(--border); }
.rb-reporte-dim:last-child { border-bottom: none; }
.rb-reporte-dim-nombre { font-weight: 600; font-size: var(--fs-sm); }
.rb-reporte-dim-comentario { color: var(--text-muted); font-size: var(--fs-sm); margin-top: 2px; }
.rb-toast { position: fixed; bottom: var(--sp-6); right: var(--sp-6); background: var(--surface); border: 1px solid var(--cyan-text); border-radius: var(--radius-2); padding: var(--sp-3) var(--sp-4); font-size: var(--fs-sm); box-shadow: var(--shadow-3); z-index: 80; }
.rb-empty { text-align: center; padding: var(--sp-10) var(--sp-6); color: var(--text-muted); }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* =========================================================================
   PLATAFORMA DEL EXPERTO TÉCNICO -- primera versión.

   Prototipo estático (sin backend), mismo espíritu que rumbo_prototype.html
   y candidate_portal.html: todo en memoria, se pierde al refrescar, y es
   una isla aparte -- no comparte datos reales con los otros dos (evaluar
   acá no mueve nada en el pipeline del recruiter ni viceversa).

   Alcance v1 (confirmado con el usuario): cola de Entrevistas Técnicas
   asignadas al experto + material de referencia del candidato (hard
   skills, matching de CV -- ya construido para el recruiter, reusado acá
   con el mismo lenguaje visual) + formulario de evaluación (las mismas 4
   dimensiones que ya modela resolverReporteTecnico en rumbo_prototype.html:
   Conocimiento técnico, Resolución de problemas, Comunicación,
   Liderazgo/Colaboración) + recomendación final. Sin gestión de
   disponibilidad propia -- los 3 prototipos son islas sin backend
   compartido, así que no habría forma de que alimente de verdad la grilla
   de agendamiento que ya usa el candidato. ---- */

const ICONS = {
  chevronRight: '<path d="M9 6l6 6-6 6"/>',
  chevronLeft: '<path d="M15 6l-6 6 6 6"/>',
  check: '<path d="M5 13l4 4L19 7"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  building: '<rect x="4" y="3" width="16" height="18"/><path d="M8 7h2M14 7h2M8 11h2M14 11h2M8 15h2M14 15h2"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
  calendar: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/>',
  alertTriangle: '<path d="M12 3 2 20h20Z"/><path d="M12 10v5M12 18v.5"/>',
  sparkles: '<path d="M12 2l1.6 5.4L19 9l-5.4 1.6L12 16l-1.6-5.4L5 9l5.4-1.6Z"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>',
};
function icon(name, size) {
  size = size || 14;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;vertical-align:middle">${ICONS[name] || ''}</svg>`;
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(nombre) { return nombre.split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase(); }

/* Isotipo real de Rumbo -- mismo SVG que rumbo_prototype.html/
   candidate_portal.html. */

/* Mismo criterio que los otros dos prototipos: default 'light', try/catch
   por si localStorage está bloqueado. */
function leerThemeGuardado() {
  try { return localStorage.getItem('rb-expert-theme') === 'dark' ? 'dark' : 'light'; }
  catch (e) { return 'light'; }
}

/* =========================================================================
   MOCK DATA
   ========================================================================= */
/* El experto ya está "logueado" desde que se abre el portal -- a
   diferencia del candidato, no hay un flujo de auto-registro: los
   expertos (cofounders/CTO/liderazgo técnico interno o especialistas
   freelance, ver POOL_ENTREVISTA_TECNICA en rumbo_prototype.html) se dan
   de alta puertas adentro, no se auto-registran desde afuera. */
const YO = { nombre: 'Iván Chávez', rol: 'Tech Lead invitado', tipo: 'Interno' };

/* Rating determinístico de hard skills -- mismo criterio que
   hardSkillScore() en rumbo_prototype.html (no hay un campo real de "qué
   tan fuerte es cada skill", se deriva de forma estable a partir de un
   seed + el nombre del skill). */
function hardSkillScore(seed, skill) {
  const str = seed + skill;
  let hash = 0;
  for (let i = 0; i < str.length; i++) hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
  return 3 + (hash % 3);
}
function hardSkillsHtml(candidato) {
  return candidato.skills.map(s => `<div class="rb-detail-row"><span>${esc(s)}</span><span class="rb-dots">${[1,2,3,4,5].map(n => `<span class="rb-dot${n <= hardSkillScore(candidato.nombre, s) ? ' filled' : ''}"></span>`).join('')}</span></div>`).join('');
}

/* Dimensiones de evaluación -- mismas 4 + mismos pesos que ya modela
   resolverReporteTecnico(p, candidato) en rumbo_prototype.html, para que
   el reporte que arma acá sea compatible en forma con lo que el recruiter
   ya espera ver (aunque, al ser prototipos aislados, no se sincronizan de
   verdad). */
const DIMENSIONES_EVAL = [
  { key: 'tecnico', nombre: 'Conocimiento técnico', peso: '40%' },
  { key: 'problemas', nombre: 'Resolución de problemas', peso: '25%' },
  { key: 'comunicacion', nombre: 'Comunicación', peso: '20%' },
  { key: 'liderazgo', nombre: 'Liderazgo/Colaboración', peso: '15%' },
];

    vacante: { titulo: 'Fullstack .Net', cliente: 'Laive' },
    matchScore: 84,
    fecha: '2026-08-14', hora: '16:00',
    estado: 'completada',
    reporte: {
      dimensiones: [
        { key: 'tecnico', score: 3, comentario: 'Cumple lo básico en .NET/React, sin profundidad en performance.' },
        { key: 'problemas', score: 3, comentario: 'Resuelve con ayuda, le cuesta estructurar el approach solo.' },
        { key: 'comunicacion', score: 4, comentario: 'Buena comunicación, se explica bien.' },
        { key: 'liderazgo', score: 3, comentario: 'Poca experiencia liderando iniciativas propias todavía.' },
      ],
      recomendacion: 'Cumple lo esperado para el nivel Mid del rol. Avanza con reservas menores en performance.',
      decision: 'avanza',
    },
  },
];
let nextEntrevistaId = 5;

const state = { view: 'cola', detalleId: null, toast: null, ui: { theme: leerThemeGuardado() } };
let formEval = null;

function entrevistaDe(id) { return ENTREVISTAS.find(e => e.id === id); }
function showToast(msg) { state.toast = msg; render(); setTimeout(() => { state.toast = null; render(); }, 2600); }

/* =========================================================================
   ACCIONES
   ========================================================================= */
function abrirEntrevista(id) {
  const e = entrevistaDe(id);
  state.view = 'detalle'; state.detalleId = id;
  formEval = e.estado === 'pendiente'
    ? { scores: { tecnico: 0, problemas: 0, comunicacion: 0, liderazgo: 0 }, comentarios: { tecnico: '', problemas: '', comunicacion: '', liderazgo: '' }, decision: '', recomendacion: '' }
    : null;
  render();
}
function volverACola() { state.view = 'cola'; state.detalleId = null; formEval = null; render(); }
function calificarDimension(key, score) { formEval.scores[key] = score; render(); }
function elegirDecision(decision) { formEval.decision = decision; render(); }
function evaluacionValida() {
  return DIMENSIONES_EVAL.every(d => formEval.scores[d.key] > 0) && !!formEval.decision && formEval.recomendacion.trim().length > 0;
}
function enviarEvaluacion() {
  if (!evaluacionValida()) return;
  const e = entrevistaDe(state.detalleId);
  e.estado = 'completada';
  e.reporte = {
    dimensiones: DIMENSIONES_EVAL.map(d => ({ key: d.key, score: formEval.scores[d.key], comentario: formEval.comentarios[d.key].trim() })),
    recomendacion: formEval.recomendacion.trim(),
    decision: formEval.decision,
  };
  formEval = null;
  showToast(`Evaluación de ${e.candidato.nombre} enviada — el recruiter fue notificado (simulado)`);
  volverACola();
}
function toggleTheme() {
  state.ui.theme = state.ui.theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('rb-expert-theme', state.ui.theme); } catch (e) {}
  render();
}

/* =========================================================================
   RENDER: vistas
   ========================================================================= */
function diasDesde(fecha) {
  const hoy = new Date('2026-08-30T00:00:00'); // ancla estable del prototipo, ver dateIdentified en los otros dos archivos
  const d = new Date(fecha + 'T00:00:00');
  return Math.round((hoy - d) / 86400000);
}
function fechaLabel(fecha, hora) {
  const d = new Date(fecha + 'T00:00:00');
  return `${d.toLocaleDateString('es-PE', { weekday: 'short', day: 'numeric', month: 'short' })} · ${hora}`;
}

function renderCola() {
  if (ENTREVISTAS.length === 0) {
    return `<div class="rb-empty card">No tenés entrevistas técnicas asignadas por ahora.</div>`;
  }
  const orden = [...ENTREVISTAS].sort((a, b) => {
    if (a.estado !== b.estado) return a.estado === 'pendiente' ? -1 : 1;
    return a.fecha.localeCompare(b.fecha);
  });
  return orden.map(e => {
    const vencida = e.estado === 'pendiente' && diasDesde(e.fecha) > 0;
    return `<div class="card rb-entrevista-card" onclick="abrirEntrevista(${e.id})">
      <div class="rb-entrevista-top">
        <div>
          <div class="rb-entrevista-nombre">${esc(e.candidato.nombre)}</div>
          <div class="rb-entrevista-sub">${icon('building', 12)} ${esc(e.vacante.titulo)} · ${esc(e.vacante.cliente)}</div>
        </div>
        ${e.estado === 'pendiente'
          ? `<span class="badge" style="background:var(--accent-soft);color:var(--rb-blue-300)">Pendiente</span>`
          : `<span class="badge" style="background:rgba(60,203,127,.15);color:var(--success-text)">${icon('check', 11)} Evaluada</span>`}
      </div>
      <div class="rb-tags">${e.candidato.skills.map(s => `<span class="rb-tag">${esc(s)}</span>`).join('')}</div>
      <div class="rb-entrevista-fecha${vencida ? ' vencida' : ''}">${icon(vencida ? 'alertTriangle' : 'clock', 13)} ${vencida ? 'Vencida · ' : ''}${esc(fechaLabel(e.fecha, e.hora))}</div>
    </div>`;
  }).join('');
}

function referenciaHtml(e) {
  return `
    <h3 class="rb-subsection-label">Matching de CV vs Job Description</h3>
    <div class="rb-score-row"><div class="rb-score-bar"><div class="rb-score-fill" style="width:${e.matchScore}%"></div></div><span class="rb-score-num">${e.matchScore}%</span></div>
    <h3 class="rb-subsection-label">Hard skills declarados</h3>
    ${hardSkillsHtml(e.candidato)}`;
}

function evaluacionFormHtml(e) {
  return `
    <h3 class="rb-subsection-label">Evaluación</h3>
    ${DIMENSIONES_EVAL.map(d => `
      <div class="rb-eval-dim">
        <div class="rb-eval-dim-head">
          <span class="rb-eval-dim-nombre">${esc(d.nombre)}</span>
          <span class="rb-eval-dim-peso">${esc(d.peso)}</span>
        </div>
        <div class="rb-rating-picker">${[1,2,3,4,5].map(n => `<button type="button" class="rb-rating-dot${formEval.scores[d.key] === n ? ' selected' : ''}" onclick="calificarDimension('${d.key}', ${n})">${n}</button>`).join('')}</div>
        <textarea id="eval-comentario-${d.key}" placeholder="Nota opcional sobre esta dimensión..." oninput="formEval.comentarios['${d.key}']=this.value">${esc(formEval.comentarios[d.key])}</textarea>
      </div>`).join('')}
    <h3 class="rb-subsection-label">Recomendación final</h3>
    <div class="rb-eval-resultado">
      <div class="rb-decision-row">
        <button type="button" class="btn secondary avanza${formEval.decision === 'avanza' ? ' selected' : ''}" onclick="elegirDecision('avanza')">${icon('check', 13)} Avanza</button>
        <button type="button" class="btn secondary no-avanza${formEval.decision === 'no_avanza' ? ' selected' : ''}" onclick="elegirDecision('no_avanza')">${icon('x', 13)} No avanza</button>
      </div>
      <textarea id="eval-recomendacion" placeholder="Justifica tu recomendación (obligatorio)..." oninput="formEval.recomendacion=this.value; render()">${esc(formEval.recomendacion)}</textarea>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-top:var(--sp-5)">
      <button class="btn" ${evaluacionValida() ? '' : 'disabled'} onclick="enviarEvaluacion()">${icon('check', 13)} Enviar evaluación</button>
    </div>`;
}

const DECISION_LABEL = { avanza: 'Avanza', no_avanza: 'No avanza' };
const DECISION_COLOR = { avanza: 'var(--success-text)', no_avanza: 'var(--danger-text)' };
function reporteHtml(e) {
  const r = e.reporte;
  return `
    <h3 class="rb-subsection-label">Reporte enviado</h3>
    ${r.dimensiones.map(d => {
      const meta = DIMENSIONES_EVAL.find(x => x.key === d.key);
      return `<div class="rb-reporte-dim">
        <div><div class="rb-reporte-dim-nombre">${esc(meta.nombre)}</div>${d.comentario ? `<div class="rb-reporte-dim-comentario">${esc(d.comentario)}</div>` : ''}</div>
        <span class="badge" style="background:var(--accent-soft);color:var(--rb-blue-300);flex-shrink:0">${d.score}/5</span>
      </div>`;
    }).join('')}
    <h3 class="rb-subsection-label">Recomendación</h3>
    <p style="color:var(--text-muted);line-height:1.5;margin-bottom:var(--sp-2)">${esc(r.recomendacion)}</p>
    <span class="badge" style="background:${DECISION_COLOR[r.decision]}22;color:${DECISION_COLOR[r.decision]}">${esc(DECISION_LABEL[r.decision])}</span>`;
}

function renderDetalle() {
  const e = entrevistaDe(state.detalleId);
  if (!e) { volverACola(); return ''; }
  return `
    <button class="btn ghost sm" style="margin-bottom:var(--sp-4)" onclick="volverACola()">${icon('chevronLeft', 12)} Volver</button>
    <div class="card">
      <div class="rb-entrevista-top">
        <div>
          <h2 class="rb-entrevista-nombre" style="font-size:var(--fs-xl)">${esc(e.candidato.nombre)}</h2>
          <div class="rb-entrevista-sub">${icon('building', 12)} ${esc(e.vacante.titulo)} · ${esc(e.vacante.cliente)} · ${esc(e.candidato.seniority)}</div>
        </div>
        ${e.estado === 'pendiente'
          ? `<span class="badge" style="background:var(--accent-soft);color:var(--rb-blue-300)">Pendiente</span>`
          : `<span class="badge" style="background:rgba(60,203,127,.15);color:var(--success-text)">${icon('check', 11)} Evaluada</span>`}
      </div>
      <div class="rb-entrevista-fecha">${icon('calendar', 13)} ${esc(fechaLabel(e.fecha, e.hora))}</div>
      <div style="margin-top:var(--sp-5);padding-top:var(--sp-5);border-top:1px solid var(--border)">
        ${referenciaHtml(e)}
        ${e.estado === 'pendiente' ? evaluacionFormHtml(e) : reporteHtml(e)}
      </div>
    </div>`;
}

/* =========================================================================
   SHELL + RENDER PRINCIPAL
   ========================================================================= */
function render() {
  /* Preservar foco+selección a través del re-render -- mismo criterio que
     ya usan los otros dos prototipos: el formulario de evaluación
     re-renderiza en cada tecla del textarea de recomendación (para
     habilitar/deshabilitar "Enviar evaluación"), así que sin esto se
     perdía el foco a cada letra. */
  const active = document.activeElement;
  const activeId = active && active.id ? active.id : null;
  const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;

  document.documentElement.setAttribute('data-theme', state.ui.theme);
  const titulos = { cola: ['Mis entrevistas técnicas', 'Candidatos que te tocó evaluar.'] };
  const [titulo, sub] = titulos[state.view] || ['', ''];
  document.getElementById('root').innerHTML = `
    <header class="rb-topbar">
      <div class="rb-brand">${LOGO_SVG} <span style="color:var(--text-muted);font-weight:400;font-size:var(--fs-sm)">· Plataforma del Experto</span></div>
      <div class="rb-user">
        <button class="rb-theme-btn" onclick="toggleTheme()" aria-label="Cambiar tema" title="Cambiar tema">${icon(state.ui.theme === 'dark' ? 'sun' : 'moon', 15)}</button>
        <div class="avatar" title="${esc(YO.nombre)} · ${esc(YO.rol)}">${esc(initials(YO.nombre))}</div>
      </div>
    </header>
    <main class="rb-main">
      ${state.view !== 'detalle' ? `<h1 class="rb-page-title">${esc(titulo)}</h1><p class="rb-page-sub">${esc(sub)}</p>` : ''}
      ${state.view === 'detalle' ? renderDetalle() : renderCola()}
    </main>
    ${state.toast ? `<div class="rb-toast">${esc(state.toast)}</div>` : ''}
  `;
  if (activeId) {
    const el = document.getElementById(activeId);
    /* Nunca re-enfocar un <select> -- en mobile, .focus() sobre un <select>
       reabre el picker nativo del sistema operativo (mismo fix aplicado en
       los otros 3 prototipos, acá preventivo ya que este archivo no tiene
       ninguno todavía). */
    if (el && typeof el.focus === 'function' && el.tagName !== 'SELECT') {
      el.focus({ preventScroll: true });
      if (selStart !== null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selEnd); } catch (e) {} }
    }
  }
}
render();
</script>
</body>
</html>
