<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rumbo · Portal del Cliente</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');

/* ===== Mismos tokens que los otros 3 prototipos -- cuarta superficie del
   mismo producto, mismo Design System. ===== */
:root {
  --rb-blue: #382EDC; --rb-blue-700: #2A22A8; --rb-blue-300: #8078F0;
  --rb-cyan: #47EBEB; --rb-cyan-600: #19B8B8; --rb-purple: #8452FD; --rb-orange: #FF5A36;
  --rb-ink: #0A0A0B; --rb-paper: #F4F2ED; --rb-white: #FFFFFF;
  --bg: #0A0A0B; --bg-elev: #121214; --bg-subtle: #17171A; --surface: #1B1B1F; --surface-2: #242428;
  --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.16);
  --text: #FAFAFA; --text-muted: rgba(255,255,255,.64); --text-dim: rgba(255,255,255,.44);
  --accent: var(--rb-blue); --accent-fg: #FFFFFF; --accent-soft: rgba(56,46,220,.14); --highlight: var(--rb-cyan);
  --success: #3CCB7F; --warning: #FFB020; --danger: #FF5A36;
  --cyan-text: var(--rb-cyan); --success-text: var(--success); --warning-text: var(--warning); --danger-text: var(--danger);
  --radius-1: 4px; --radius-2: 8px; --radius-3: 12px; --radius-4: 16px; --radius-full: 9999px;
  --shadow-1: 0 1px 2px rgba(0,0,0,.4); --shadow-2: 0 4px 12px rgba(0,0,0,.5); --shadow-3: 0 12px 32px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.4);
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;
  --fs-xs: 11px; --fs-sm: 12px; --fs-base: 14px; --fs-md: 16px; --fs-lg: 18px; --fs-xl: 22px; --fs-2xl: 28px;
  --ease-out: cubic-bezier(.2,.7,.2,1); --dur-2: 200ms;
  color-scheme: dark;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: var(--rb-paper); --bg-elev: #FFFFFF; --bg-subtle: #EAE7DF; --surface: #FFFFFF; --surface-2: #F0EDE5;
  --border: rgba(10,10,11,.08); --border-strong: rgba(10,10,11,.16);
  --text: var(--rb-ink); --text-muted: rgba(10,10,11,.64); --text-dim: rgba(10,10,11,.44);
  --accent-soft: rgba(56,46,220,.10);
  --cyan-text: #0D7878; --warning-text: #956000; --success-text: #217B4B; --danger-text: #D42600;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Space Grotesk', system-ui, sans-serif;
  background: radial-gradient(900px 480px at 14% -10%, rgba(56,46,220,.16), transparent 60%), var(--bg);
  background-attachment: fixed;
  color: var(--text); min-height: 100vh;
}
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.01em; }
p { margin: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; border-radius: var(--radius-2); padding: 10px 16px; font-family: inherit; font-size: var(--fs-sm); font-weight: 600; cursor: pointer; background: var(--accent); color: var(--accent-fg); transition: filter var(--dur-2) var(--ease-out), transform var(--dur-2) var(--ease-out); white-space: nowrap; }
.btn:hover { filter: brightness(1.1); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
.btn.secondary { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.btn.ghost { background: transparent; color: var(--text); border-color: transparent; }
.btn.ghost:hover { background: var(--surface); }
.btn.sm { padding: 6px 12px; font-size: var(--fs-xs); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-3); padding: var(--sp-5); }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-xs); font-weight: 600; padding: 4px 10px; border-radius: var(--radius-full); line-height: 1; }
textarea { width: 100%; font-family: inherit; font-size: var(--fs-base); padding: 10px 12px; border-radius: var(--radius-2); border: 1px solid var(--border-strong); background: var(--bg-elev); color: var(--text); resize: vertical; min-height: 80px; }
textarea:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
label.field { display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-sm); color: var(--text-muted); font-weight: 600; }

/* ---- Shell ---- */
.rb-topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; padding: var(--sp-4) var(--sp-6); background: rgba(18,18,20,.75); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: var(--sp-3); }
:root[data-theme="light"] .rb-topbar { background: rgba(255,255,255,.75); }
.rb-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: var(--fs-lg); }
.rb-brand svg { display: block; height: 22px; width: auto; color: var(--text); }
.rb-user { display: flex; align-items: center; gap: 10px; font-size: var(--fs-sm); }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--accent-soft); color: var(--rb-blue-300); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: var(--fs-sm); flex-shrink: 0; }
:root[data-theme="light"] .avatar { color: var(--rb-blue); }
.rb-theme-btn { background: transparent; border: 1px solid var(--border-strong); border-radius: var(--radius-2); width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted); flex-shrink: 0; }
.rb-main { max-width: 820px; margin: 0 auto; padding: var(--sp-8) var(--sp-6) var(--sp-10); }
.rb-page-title { font-size: var(--fs-2xl); margin-bottom: var(--sp-2); }
.rb-page-sub { color: var(--text-muted); font-size: var(--fs-base); margin-bottom: var(--sp-6); }
@media (max-width: 640px) { .rb-main { padding: var(--sp-5) var(--sp-4); } }

/* ---- Cola de candidatos presentados ---- */
.rb-postulacion-card { margin-bottom: var(--sp-4); cursor: pointer; transition: border-color var(--dur-2) var(--ease-out); }
.rb-postulacion-card:hover { border-color: var(--border-strong); }
.rb-postulacion-top { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--sp-3); margin-bottom: var(--sp-2); }
.rb-postulacion-sub { color: var(--text-muted); font-size: var(--fs-sm); display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.rb-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.rb-tag { font-size: var(--fs-xs); padding: 3px 9px; border-radius: var(--radius-1); background: var(--bg-elev); border: 1px solid var(--border); color: var(--text-muted); }

/* ---- Brief del candidato -- mismo lenguaje visual que rb-detail-row +
   rb-dots (solo lectura) que ya usan los otros 3 prototipos. ---- */
.rb-detail-row { display: flex; align-items: center; justify-content: space-between; font-size: var(--fs-sm); padding: var(--sp-1) 0; border-bottom: 1px solid var(--border); gap: var(--sp-2); }
.rb-detail-row:last-child { border-bottom: none; }
.rb-detail-row span:first-child { color: var(--text-muted); }
.rb-dots { display: flex; align-items: center; gap: 4px; }
.rb-dot { width: 16px; height: 4px; border-radius: var(--radius-full); background: var(--border); }
.rb-dot.filled { background: var(--rb-blue); }
.rb-score-row { display: flex; align-items: center; gap: var(--sp-3); }
.rb-score-bar { flex: 1; height: 6px; background: var(--bg-elev); border-radius: var(--radius-full); overflow: hidden; }
.rb-score-fill { height: 100%; border-radius: var(--radius-full); background: var(--rb-cyan); }
.rb-score-num { font-size: var(--fs-sm); font-weight: 600; color: var(--cyan-text); min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
h3.rb-subsection-label { font-size: var(--fs-sm); color: var(--text-muted); font-weight: 600; margin: var(--sp-5) 0 var(--sp-2) 0; text-transform: uppercase; letter-spacing: .04em; }
h3.rb-subsection-label:first-child { margin-top: 0; }
.rb-brief-stats { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin: var(--sp-3) 0; }
.rb-brief-stat { display: inline-flex; align-items: center; gap: 6px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius-full); padding: 5px 12px; font-size: var(--fs-sm); }
.rb-recomendacion-tecnica { background: var(--accent-soft); border: 1px solid rgba(56,46,220,.3); border-radius: var(--radius-2); padding: var(--sp-4); font-size: var(--fs-sm); line-height: 1.5; }

/* ---- Decisión ---- */
.rb-decision-row { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-top: var(--sp-3); }
.rb-decision-row .btn { flex: 1 1 160px; }
.rb-decision-row .btn.aprobar.selected { background: var(--success); border-color: var(--success); color: var(--rb-ink); }
.rb-decision-row .btn.rechazar.selected { background: var(--danger); border-color: var(--danger); color: var(--rb-white); }
.rb-decision-resultado { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: var(--sp-2); }
.rb-toast { position: fixed; bottom: var(--sp-6); right: var(--sp-6); background: var(--surface); border: 1px solid var(--cyan-text); border-radius: var(--radius-2); padding: var(--sp-3) var(--sp-4); font-size: var(--fs-sm); box-shadow: var(--shadow-3); z-index: 80; }
.rb-empty { text-align: center; padding: var(--sp-10) var(--sp-6); color: var(--text-muted); }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* =========================================================================
   PORTAL DEL CLIENTE / HIRING MANAGER -- primera versión.

   Prototipo estático (sin backend), mismo espíritu que los otros 3: todo
   en memoria, se pierde al refrescar, isla aparte -- decidir acá no mueve
   nada en el pipeline del recruiter ni viceversa.

   Cierra el último punto de contacto humano del pipeline que faltaba
   (Recruiter, Candidato y Experto técnico ya tenían su propia vista): el
   cliente ve el "Brief" del candidato ya presentado (mismo contenido que
   ya genera renderBriefModal en rumbo_prototype.html -- resumen, hard
   skills, soft skills, matching, más la recomendación que ya dejó el
   experto técnico) y registra su decisión (Aprobar → Oferta / Rechazar),
   igual que VEREDICTO[GATE_CLIENTE] en el recruiter. Se modela como un
   solo paso de decisión (sin las dos sub-fases internas "Presentado a
   Cliente"/"Fase Cliente" del recruiter) -- desde la vista del cliente,
   ambas son lo mismo: "tengo un candidato para decidir". ---- */

const ICONS = {
  chevronRight: '<path d="M9 6l6 6-6 6"/>',
  chevronLeft: '<path d="M15 6l-6 6 6 6"/>',
  check: '<path d="M5 13l4 4L19 7"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  briefcase: '<rect x="3" y="7" width="18" height="10" rx="2"/><path d="M8 12h6"/>',
  mapPin: '<path d="M12 21s7-7.5 7-12A7 7 0 0 0 5 9c0 4.5 7 12 7 12Z"/><circle cx="12" cy="9" r="2.5"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
  coin: '<circle cx="12" cy="12" r="9"/><path d="M9.5 15c0 1.1 1.1 2 2.5 2s2.5-.9 2.5-2-1.1-1.7-2.5-2-2.5-.9-2.5-2 1.1-2 2.5-2 2.5.9 2.5 2"/>',
  sparkles: '<path d="M12 2l1.6 5.4L19 9l-5.4 1.6L12 16l-1.6-5.4L5 9l5.4-1.6Z"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>',
};
function icon(name, size) {
  size = size || 14;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;vertical-align:middle">${ICONS[name] || ''}</svg>`;
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(nombre) { return nombre.split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase(); }

/* Isotipo real de Rumbo -- mismo SVG que los otros 3 prototipos. */
const LOGO_SVG = `<svg viewBox="0 0 144 42" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M32.634 6.70557C25.47 6.70557 19.026 12.582 18.774 19.7202C17.28 15.0695 12.906 11.6987 7.758 11.6807V34.9159H19.332V28.03L19.386 26.588C19.386 24.7493 20.124 23.109 21.33 21.9013C22.536 20.6936 24.174 19.9545 26.01 19.9545H32.634C39.942 19.9545 45.864 14.024 45.864 6.70557H32.634Z" fill="#382EDC"/>

<path d="M106.344 9.73389V18.242H106.362C107.172 16.9442 108.9 15.6283 111.618 15.6283C115.47 15.6283 118.692 19.0352 118.692 23.7579C118.692 28.4807 115.47 31.8875 111.618 31.8875C108.882 31.8875 107.1 30.5897 106.29 29.2738V31.4549H102.438V9.73389H106.344ZM106.344 23.7759C106.344 26.6961 108.144 28.4266 110.556 28.4266C112.914 28.4266 114.768 26.7502 114.768 23.7759C114.768 20.8017 112.914 19.1073 110.556 19.1073C108.144 19.1073 106.344 20.8558 106.344 23.7759Z" fill="currentColor"/>
<path d="M128.358 15.6284C132.876 15.6284 136.422 18.9271 136.422 23.758C136.422 28.5889 132.876 31.9057 128.358 31.9057C123.84 31.9057 120.294 28.607 120.294 23.7761C120.294 18.9452 123.822 15.6284 128.358 15.6284ZM128.358 28.4267C128.358 28.4267 132.462 26.1194 132.462 23.3254C132.462 20.5314 130.842 19.1074 128.358 19.1074C125.874 19.1074 124.182 20.5314 124.182 23.3254C124.182 26.1194 128.358 28.4267 128.358 28.4267Z" fill="currentColor"/>
</svg>`;

/* Mismo criterio que los otros 3: default 'light', try/catch por si
   localStorage está bloqueado. */
function leerThemeGuardado() {
  try { return localStorage.getItem('rb-client-theme') === 'dark' ? 'dark' : 'light'; }
  catch (e) { return 'light'; }
}

/* =========================================================================
   MOCK DATA
   ========================================================================= */
/* El hiring manager ya está "logueado" desde que se abre el portal --
   igual que el experto técnico, no hay auto-registro: a un cliente lo da
   de alta el account manager, no se auto-inscribe. Ve solo candidatos
   presentados para SU empresa (Interbank), no los de otros clientes de
   Rumbo -- mismo criterio de acceso que ya tiene sentido en el recruiter
   (cada vacante pertenece a un solo cliente). */
const YO = { nombre: 'Patricia Vega', rol: 'Hiring Manager', cliente: 'Interbank' };

const SOFT_SKILL_LABELS = { comunicacion: 'Comunicación', liderazgo: 'Liderazgo', trabajoEnEquipo: 'Trabajo en equipo', adaptabilidad: 'Adaptabilidad', resolucionProblemas: 'Resolución de problemas' };

/* Candidatos presentados a Interbank -- mezcla deliberada de estados,
   mismo criterio que expert_portal.html: casos por decidir + casos ya
   decididos (uno aceptado, uno rechazado) para mostrar los 3 desenlaces
   posibles apenas se abre el portal. */
let POSTULACIONES = [
  {
    id: 1,
    candidato: {
      nombre: 'Mariana Castillo', rol: 'Cloud Architect', seniority: 'Senior', experiencia: '9 años',
      ubicacion: 'Lima, Perú', modalidad: 'Híbrido', disponibilidad: '15 días', expectativa: 12000,
      resumen: 'Diseñó la migración a microservicios de un banco regional, con foco en seguridad y compliance del sector financiero.',
      skills: ['AWS', 'Arquitectura de microservicios', 'Terraform', 'Kubernetes'],
      softSkills: { comunicacion: 5, liderazgo: 5, trabajoEnEquipo: 5, adaptabilidad: 5, resolucionProblemas: 5 },
    },
    vacante: 'Arquitecto Cloud', matchScore: 95,
    recomendacionTecnica: 'Dominio sólido de arquitectura de microservicios y AWS, validado en la evaluación con el especialista. Se recomienda avanzar en el proceso.',
    fechaPresentado: '2026-08-26', decision: null, feedback: null,
  },
  {
    id: 2,
    candidato: {
      nombre: 'Iván Melgar', rol: 'Solutions Architect', seniority: 'Senior', experiencia: '10 años',
      ubicacion: 'Lima, Perú', modalidad: 'Remoto', disponibilidad: '30 días', expectativa: 13000,
      resumen: 'Certificado AWS Solutions Architect Professional, con experiencia liderando adopción cloud en fintechs.',
      skills: ['AWS', 'Terraform', 'Certificación AWS'],
      softSkills: { comunicacion: 4, liderazgo: 5, trabajoEnEquipo: 4, adaptabilidad: 3, resolucionProblemas: 4 },
    },
    vacante: 'Arquitecto Cloud', matchScore: 87,
    recomendacionTecnica: 'Buen dominio conceptual de AWS y adopción cloud, con algo menos de profundidad hands-on que otros candidatos del proceso. Avanza con reservas menores.',
    fechaPresentado: '2026-08-20', decision: null, feedback: null,
  },
  {
    id: 3,
    candidato: {
      nombre: 'Julio Ancco', rol: 'DevOps Engineer', seniority: 'Senior', experiencia: '9 años',
      ubicacion: 'Lima, Perú', modalidad: 'Remoto', disponibilidad: '15 días', expectativa: 14000,
      resumen: 'Especialista en infraestructura como código; redujo tiempos de deploy de 40 min a 4 min en su último rol.',
      skills: ['Kubernetes', 'Terraform', 'AWS', 'CI/CD'],
      softSkills: { comunicacion: 4, liderazgo: 3, trabajoEnEquipo: 4, adaptabilidad: 5, resolucionProblemas: 5 },
    },
    vacante: 'Site Reliability Engineer', matchScore: 91,
    recomendacionTecnica: 'Excelente manejo de CI/CD e infraestructura como código. Perfil sólido para el rol, se recomienda avanzar sin reservas.',
    fechaPresentado: '2026-08-08', decision: 'aprobar',
    feedback: 'Muy buena entrevista, se alinea con lo que necesitamos para el equipo de plataforma. Avanzamos con oferta.',
  },
  {
    id: 4,
    candidato: {
      nombre: 'Gonzalo Yactayo', rol: 'Tech Lead', seniority: 'Senior', experiencia: '11 años',
      ubicacion: 'Lima, Perú', modalidad: 'Híbrido', disponibilidad: '15 días', expectativa: 15500,
      resumen: 'Lideró un equipo de 6 desarrolladores en la modernización de un core de seguros.',
      skills: ['.NET', 'Arquitectura', 'AWS'],
      softSkills: { comunicacion: 4, liderazgo: 5, trabajoEnEquipo: 3, adaptabilidad: 4, resolucionProblemas: 4 },
    },
    vacante: 'Sr. Program Manager', matchScore: 74,
    recomendacionTecnica: 'Buen líder técnico, pero el perfil está más orientado a arquitectura que a program management. Avanza con reservas relevantes.',
    fechaPresentado: '2026-07-30', decision: 'rechazar',
    feedback: 'Buen candidato pero no es el fit que buscamos para este rol puntual — necesitamos a alguien más enfocado en gestión de programas que en arquitectura.',
  },
];

const state = { view: 'cola', detalleId: null, toast: null, ui: { theme: leerThemeGuardado() } };
let decisionForm = null;

function postulacionDe(id) { return POSTULACIONES.find(p => p.id === id); }
function showToast(msg) { state.toast = msg; render(); setTimeout(() => { state.toast = null; render(); }, 2600); }

/* =========================================================================
   ACCIONES
   ========================================================================= */
function abrirPostulacion(id) {
  const p = postulacionDe(id);
  state.view = 'detalle'; state.detalleId = id;
  decisionForm = p.decision === null ? { decision: '', feedback: '' } : null;
  render();
}
function volverACola() { state.view = 'cola'; state.detalleId = null; decisionForm = null; render(); }
function elegirDecisionForm(decision) { decisionForm.decision = decision; render(); }
function decisionValida() { return !!decisionForm.decision && decisionForm.feedback.trim().length > 0; }
function confirmarDecision() {
  if (!decisionValida()) return;
  const p = postulacionDe(state.detalleId);
  p.decision = decisionForm.decision;
  p.feedback = decisionForm.feedback.trim();
  decisionForm = null;
  showToast(p.decision === 'aprobar'
    ? `${p.candidato.nombre} avanza a oferta — el recruiter fue notificado (simulado)`
    : `Decisión registrada para ${p.candidato.nombre} (simulado)`);
  volverACola();
}
function toggleTheme() {
  state.ui.theme = state.ui.theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('rb-client-theme', state.ui.theme); } catch (e) {}
  render();
}

/* =========================================================================
   RENDER
   ========================================================================= */
function fechaLabel(fecha) {
  return new Date(fecha + 'T00:00:00').toLocaleDateString('es-PE', { day: 'numeric', month: 'short' });
}
function dotsHtml(valor) {
  return `<span class="rb-dots">${[1,2,3,4,5].map(n => `<span class="rb-dot${n <= valor ? ' filled' : ''}"></span>`).join('')}</span>`;
}

function renderCola() {
  if (POSTULACIONES.length === 0) {
    return `<div class="rb-empty card">Todavía no hay candidatos presentados para revisar.</div>`;
  }
  const orden = [...POSTULACIONES].sort((a, b) => {
    if ((a.decision === null) !== (b.decision === null)) return a.decision === null ? -1 : 1;
    return a.fechaPresentado < b.fechaPresentado ? 1 : -1;
  });
  return orden.map(p => `
    <div class="card rb-postulacion-card" onclick="abrirPostulacion(${p.id})">
      <div class="rb-postulacion-top">
        <div>
          <div style="font-size:var(--fs-lg);font-weight:600;margin-bottom:2px">${esc(p.candidato.nombre)}</div>
          <div class="rb-postulacion-sub">${icon('briefcase', 12)} ${esc(p.vacante)} · Presentado el ${esc(fechaLabel(p.fechaPresentado))}</div>
        </div>
        ${p.decision === null
          ? `<span class="badge" style="background:var(--accent-soft);color:var(--rb-blue-300)">Por decidir</span>`
          : p.decision === 'aprobar'
          ? `<span class="badge" style="background:rgba(60,203,127,.15);color:var(--success-text)">${icon('check', 11)} Avanza a oferta</span>`
          : `<span class="badge" style="background:rgba(255,90,54,.15);color:var(--danger-text)">${icon('x', 11)} Rechazado</span>`}
      </div>
      <div class="rb-tags">${p.candidato.skills.map(s => `<span class="rb-tag">${esc(s)}</span>`).join('')}</div>
    </div>`).join('');
}

function briefHtml(p) {
  const c = p.candidato;
  const statChip = (ic, texto) => `<span class="rb-brief-stat">${icon(ic, 12)} ${esc(texto)}</span>`;
  const stats = [
    statChip('briefcase', `${c.experiencia} de experiencia`),
    statChip('mapPin', `${c.ubicacion} · ${c.modalidad}`),
    statChip('clock', c.disponibilidad),
    statChip('coin', `S/ ${c.expectativa.toLocaleString('es-PE')}/mes`),
  ].join('');
  const softSkillsHtml = Object.keys(SOFT_SKILL_LABELS).map(k => `<div class="rb-detail-row"><span>${esc(SOFT_SKILL_LABELS[k])}</span>${dotsHtml(c.softSkills[k])}</div>`).join('');
  const hardSkillsHtml = c.skills.map(s => `<div class="rb-detail-row"><span>${esc(s)}</span>${dotsHtml(4)}</div>`).join('');
  return `
    <div class="rb-brief-stats">${stats}</div>
    <p style="color:var(--text-muted);line-height:1.6;margin:var(--sp-3) 0">${esc(c.resumen)}</p>
    <h3 class="rb-subsection-label">Matching de CV vs Job Description</h3>
    <div class="rb-score-row"><div class="rb-score-bar"><div class="rb-score-fill" style="width:${p.matchScore}%"></div></div><span class="rb-score-num">${p.matchScore}%</span></div>
    <h3 class="rb-subsection-label">Hard skills</h3>
    ${hardSkillsHtml}
    <h3 class="rb-subsection-label">Soft skills</h3>
    ${softSkillsHtml}
    <h3 class="rb-subsection-label">Recomendación del equipo técnico</h3>
    <p class="rb-recomendacion-tecnica">${icon('sparkles', 13)} ${esc(p.recomendacionTecnica)}</p>`;
}

function decisionFormHtml(p) {
  return `
    <h3 class="rb-subsection-label">Tu decisión</h3>
    <div class="rb-decision-row">
      <button type="button" class="btn secondary aprobar${decisionForm.decision === 'aprobar' ? ' selected' : ''}" onclick="elegirDecisionForm('aprobar')">${icon('check', 13)} Avanzar a oferta</button>
      <button type="button" class="btn secondary rechazar${decisionForm.decision === 'rechazar' ? ' selected' : ''}" onclick="elegirDecisionForm('rechazar')">${icon('x', 13)} Rechazar</button>
    </div>
    <label class="field" style="margin-top:var(--sp-3)">Feedback para el equipo de Rumbo (obligatorio)
      <textarea id="decision-feedback" placeholder="Contanos cómo te fue con el candidato..." oninput="decisionForm.feedback=this.value; render()">${esc(decisionForm.feedback)}</textarea>
    </label>
    <div style="display:flex;justify-content:flex-end;margin-top:var(--sp-4)">
      <button class="btn" ${decisionValida() ? '' : 'disabled'} onclick="confirmarDecision()">${icon('check', 13)} Confirmar decisión</button>
    </div>`;
}
function decisionTomadaHtml(p) {
  const aprobado = p.decision === 'aprobar';
  return `
    <h3 class="rb-subsection-label">Tu decisión</h3>
    <div class="rb-decision-resultado" style="color:${aprobado ? 'var(--success-text)' : 'var(--danger-text)'}">${icon(aprobado ? 'check' : 'x', 15)} ${aprobado ? 'Avanza a oferta' : 'Rechazado'}</div>
    <p style="color:var(--text-muted);line-height:1.5">${esc(p.feedback)}</p>`;
}

function renderDetalle() {
  const p = postulacionDe(state.detalleId);
  if (!p) { volverACola(); return ''; }
  return `
    <button class="btn ghost sm" style="margin-bottom:var(--sp-4)" onclick="volverACola()">${icon('chevronLeft', 12)} Volver</button>
    <div class="card">
      <div class="rb-postulacion-top">
        <div>
          <h2 style="font-size:var(--fs-xl)">${esc(p.candidato.nombre)}</h2>
          <div class="rb-postulacion-sub" style="margin-top:4px">${esc(p.candidato.rol)} · ${esc(p.candidato.seniority)} · postula a ${esc(p.vacante)}</div>
        </div>
        ${p.decision === null
          ? `<span class="badge" style="background:var(--accent-soft);color:var(--rb-blue-300)">Por decidir</span>`
          : p.decision === 'aprobar'
          ? `<span class="badge" style="background:rgba(60,203,127,.15);color:var(--success-text)">${icon('check', 11)} Avanza a oferta</span>`
          : `<span class="badge" style="background:rgba(255,90,54,.15);color:var(--danger-text)">${icon('x', 11)} Rechazado</span>`}
      </div>
      ${briefHtml(p)}
      <div style="margin-top:var(--sp-5);padding-top:var(--sp-5);border-top:1px solid var(--border)">
        ${p.decision === null ? decisionFormHtml(p) : decisionTomadaHtml(p)}
      </div>
    </div>`;
}

/* =========================================================================
   SHELL + RENDER PRINCIPAL
   ========================================================================= */
function render() {
  /* Preservar foco+selección a través del re-render -- mismo criterio que
     los otros 3 prototipos: el textarea de feedback re-renderiza en cada
     tecla para habilitar/deshabilitar "Confirmar decisión". */
  const active = document.activeElement;
  const activeId = active && active.id ? active.id : null;
  const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;

  document.documentElement.setAttribute('data-theme', state.ui.theme);
  const titulos = { cola: ['Candidatos presentados', `Revisá y decidí sobre los candidatos presentados para ${YO.cliente}.`] };
  const [titulo, sub] = titulos[state.view] || ['', ''];
  document.getElementById('root').innerHTML = `
    <header class="rb-topbar">
      <div class="rb-brand">${LOGO_SVG} <span style="color:var(--text-muted);font-weight:400;font-size:var(--fs-sm)">· Portal del Cliente</span></div>
      <div class="rb-user">
        <span class="badge" style="background:var(--accent-soft);color:var(--rb-blue-300)">${icon('briefcase', 11)} ${esc(YO.cliente)}</span>
        <button class="rb-theme-btn" onclick="toggleTheme()" aria-label="Cambiar tema" title="Cambiar tema">${icon(state.ui.theme === 'dark' ? 'sun' : 'moon', 15)}</button>
        <div class="avatar" title="${esc(YO.nombre)} · ${esc(YO.rol)}">${esc(initials(YO.nombre))}</div>
      </div>
    </header>
    <main class="rb-main">
      ${state.view !== 'detalle' ? `<h1 class="rb-page-title">${esc(titulo)}</h1><p class="rb-page-sub">${esc(sub)}</p>` : ''}
      ${state.view === 'detalle' ? renderDetalle() : renderCola()}
    </main>
    ${state.toast ? `<div class="rb-toast">${esc(state.toast)}</div>` : ''}
  `;
  if (activeId) {
    const el = document.getElementById(activeId);
    if (el && typeof el.focus === 'function') {
      el.focus({ preventScroll: true });
      if (selStart !== null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selEnd); } catch (e) {} }
    }
  }
}
render();
</script>
</body>
</html>
