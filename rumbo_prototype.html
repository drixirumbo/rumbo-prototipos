const ESTADO_VACANTE_COLOR = { 'Pending kickoff': 'var(--text-muted)', 'Abierta': 'var(--cyan-text)', 'On hold': 'var(--warning-text)', 'Cerrada - Éxito': 'var(--purple-text)', 'Cerrada - Sin contratación': 'var(--text-muted)', 'Cancelada': 'var(--danger-text)' };
const ESTADO_VACANTE_ICON = { 'Pending kickoff': icon('hourglass', 12), 'Abierta': icon('dot', 10), 'On hold': icon('pause', 12), 'Cerrada - Éxito': icon('check', 12), 'Cerrada - Sin contratación': icon('x', 12), 'Cancelada': icon('ban', 12) };
/* Estados finales: ya no requieren accion activa del recruiter. Se muestran
   siempre (nunca se ocultan), pero se priorizan al final y con menor peso
   visual -- ver .rb-terminal-item y los sort de vacantesAgrupadas/candidatosAgrupados. */
const ESTADOS_VACANTE_TERMINALES = ['Cerrada - Éxito', 'Cerrada - Sin contratación', 'Cancelada'];
function esVacanteTerminal(estado) { return ESTADOS_VACANTE_TERMINALES.includes(estado); }
const PRIORITY_COLOR = { 'Low': 'var(--text-muted)', 'Medium': 'var(--warning-text)', 'High': 'var(--danger-text)' };
const PRIORITY_EMOJI = { 'Low': icon('signal1', 12), 'Medium': icon('signal2', 12), 'High': icon('signal3', 12) };
const PRIORITY_ORDER = { 'High': 0, 'Medium': 1, 'Low': 2 };
const ESTADOS_VACANTE_OPCIONES = ['Pending kickoff', 'Abierta', 'On hold', 'Cerrada - Éxito', 'Cerrada - Sin contratación', 'Cancelada'];
const RECRUITERS_DISPONIBLES = ['Ana Ruiz', 'Marco Solari'];
const TD_ESTADOS_OPCIONES = ['En proceso', 'Colocado', 'Disponible', 'No interesado', 'Blacklisted'];
const TD_ORIGENES_OPCIONES = ['Inbound', 'Referido', 'Outbound', 'Base de datos'];
const TD_SENIORITY_OPCIONES = ['Junior', 'Mid', 'Senior'];
const AMS_DISPONIBLES = ['Lucía Bravo', 'Renzo Ibáñez'];

function diasHasta(fechaStr) {
  if (!fechaStr) return null;
  const hoy = new Date();
  hoy.setHours(0, 0, 0, 0);
  const fecha = new Date(fechaStr + 'T00:00:00');
  return Math.round((fecha - hoy) / (1000 * 60 * 60 * 24));
}
function deadlineInfo(fechaStr) {
  if (!fechaStr) return { dias: null, color: 'var(--text-muted)', slaStatus: null, label: null };
  const dias = diasHasta(fechaStr);
  if (dias < 0) return { dias, color: 'var(--danger-text)', slaStatus: 'vencido', label: `Venció hace ${Math.abs(dias)}d` };
  if (dias === 0) return { dias, color: 'var(--danger-text)', slaStatus: 'urgente', label: 'Vence hoy' };
  if (dias <= 3) return { dias, color: 'var(--danger-text)', slaStatus: 'urgente', label: `Vence en ${dias}d` };
  if (dias <= 14) return { dias, color: 'var(--warning-text)', slaStatus: 'pronto', label: `Vence en ${dias}d` };
  return { dias, color: 'var(--text-muted)', slaStatus: null, label: null };
}

const FULL_ORDER = [GATE_INTAKE, 'agenda_enviada', 'screening', 'agenda_tecnica_enviada', 'entrevista_tecnica', GATE_GO_INTERNO, 'presentado_cliente', 'fase_cliente', GATE_CLIENTE, 'oferta', 'contratado'];
function etapaEfectiva(p) { return SALIDAS.includes(p.etapa) ? (p.etapaMaxima || 'intake') : p.etapa; }
function idxEnOrden(p) { return FULL_ORDER.indexOf(etapaEfectiva(p)); }

function resolverDecisiones(p) {
  const idx = idxEnOrden(p);
  const rumboRechazo = p.etapa === 'rechazado_rumbo';
  const mk = (resuelta, resultado, feedback) => resuelta ? { resultado, feedback } : null;
  return {
    /* Antes eran 2 decisiones separadas (Recruiting en Pre-screening,
       Soft Skills tras 1st+2nd Screening) -- se fusionaron en una sola al
       consolidar esos 3 pasos en el único estado "Screening". */
    screening: mk(idx >= FULL_ORDER.indexOf('agenda_tecnica_enviada'), 'Cumple', 'Expectativa salarial, disponibilidad y motivación alineadas con el JD; buena comunicación y fit cultural.'),
    tecnica: mk(idx >= FULL_ORDER.indexOf(GATE_GO_INTERNO), rumboRechazo ? 'No cumple' : 'Cumple', rumboRechazo ? 'Gaps relevantes frente a los requisitos técnicos del JD.' : 'Sólido dominio técnico, validado en la evaluación con el especialista.'),
  };
}

/* Quién entrevista en cada ronda: el Screening lo hacen los recruiters
   (por eso primero se intenta usar el recruiter ya asignado a la
   postulación -- ver recruiterDePostulacion/POOL_RECRUITERS más abajo);
   la Entrevista Técnica la hacen cofounders/CTO/liderazgo técnico interno
   o especialistas de la práctica -- nunca al revés. */
const POOL_RECRUITERS = RECRUITERS_DISPONIBLES.map(r => ({ nombre: r, rol: 'Recruiter', tipo: 'Interno' }));
const POOL_LIDERAZGO = [
  { nombre: 'Theo Sauvager', rol: 'Cofounder', tipo: 'Interno' },
  { nombre: 'Ronald Vidal', rol: 'CTO', tipo: 'Interno' },
  { nombre: 'Karina Delgado', rol: 'Delivery Lead', tipo: 'Interno' },
];
const POOL_TECNICOS = [
  { nombre: 'Marco Aguirre', rol: 'Especialista Backend', tipo: 'Freelance' },
  { nombre: 'Daniela Rojas', rol: 'Especialista Data', tipo: 'Freelance' },
  { nombre: 'Iván Chávez', rol: 'Tech Lead invitado', tipo: 'Interno' },
];
const POOL_ENTREVISTA_TECNICA = [...POOL_LIDERAZGO, ...POOL_TECNICOS];
function delPool(pool, seed) { return pool[seed % pool.length]; }

function resolverEntrevistas(p) {
  const idx = idxEnOrden(p);
  const recruiter = recruiterDePostulacion(p);
  const entrevistadorScreening = recruiter ? { nombre: recruiter, rol: 'Recruiter', tipo: 'Interno' } : delPool(POOL_RECRUITERS, p.candidatoId);
  const items = [
    /* Antes eran 2 rondas separadas (1st + 2nd Screening) -- se
       fusionaron en una sola al consolidar esos pasos en "Screening". */
    { tipo: 'Screening', hecha: idx >= FULL_ORDER.indexOf('agenda_tecnica_enviada'), notas: 'Guía de pre-screening completada con el recruiter asignado. Buena primera impresión, sin gaps evidentes.', entrevistador: entrevistadorScreening },
    { tipo: 'Entrevista Técnica', hecha: idx >= FULL_ORDER.indexOf(GATE_GO_INTERNO), notas: 'Evaluación técnica con cofounder/CTO o especialista de la práctica. Protocolo estructurado completo.', entrevistador: delPool(POOL_ENTREVISTA_TECNICA, p.candidatoId) },
  ];
  if (idx >= FULL_ORDER.indexOf('fase_cliente')) {
    items.push({ tipo: 'Fase Cliente', hecha: true, notas: 'Entrevista configurada por el cliente completada.', entrevistador: { nombre: `Equipo ${p.cliente}`, rol: 'Panel del cliente', tipo: 'Cliente' } });
  }
  return items;
}

/* Red flags del CV a validar en Screening -- siempre derivadas de datos
   reales del candidato/vacante/postulación (nunca un texto inventado sin
   respaldo, mismo criterio que matchmakingBaseline), nunca un puntaje
   aleatorio. Se resuelve solo con `p` (candidato/vacante/matchmaking se
   buscan adentro) para poder llamarse tanto desde el Historial como desde
   resolverTranscriptScreening sin repetir lookups. Como mucho 3 flags,
   ordenadas por severidad -- más de eso deja de ser "fácil de leer". */
function resolverRedFlags(p) {
  const candidato = CANDIDATOS.find(c => c.id === p.candidatoId);
  const vacante = VACANTES.find(v => v.id === p.vacanteId);
  const mmDims = getMatchmaking(p).dims;
  const flags = [];
  if (p.porcentajeCobertura > 100) {
    flags.push({
      id: 'presupuesto', severidad: p.porcentajeCobertura > 110 ? 'alta' : 'media',
      label: `Expectativa salarial ${p.porcentajeCobertura}% del presupuesto`,
      detalle: 'El candidato pidió más de lo presupuestado para esta posición.',
      pregunta: '¿Tu expectativa salarial tiene algo de flexibilidad? El presupuesto de esta posición es más ajustado.',
      respuesta: 'Sobre la expectativa salarial: comentó que tiene algo de flexibilidad si el proyecto y las condiciones generales lo convencen.',
    });
  }
  const historialNegativo = (candidato.historialAdicional || []).find(h => /no seleccionado|rechazado/i.test(h.resultado));
  if (historialNegativo) {
    flags.push({
      id: 'historial', severidad: 'media',
      label: 'Proceso previo no exitoso en Rumbo',
      detalle: `${historialNegativo.posicion} en ${historialNegativo.cliente} (${historialNegativo.resultado}, ${historialNegativo.fecha}).`,
      pregunta: `Notamos que participaste antes en un proceso para ${historialNegativo.posicion} en ${historialNegativo.cliente} que no avanzó. ¿Qué feedback recibiste en ese momento?`,
      respuesta: `Sobre el proceso previo en ${historialNegativo.cliente}: dijo que le faltó profundidad en un punto específico, que comenta haber reforzado desde entonces.`,
    });
  }
  const autonomiaAlta = candidato.autonomia === 'Lidera equipo y decide arquitectura' || candidato.autonomia === 'Define alcance y prioriza';
  if (autonomiaAlta && candidato.softSkills.liderazgo <= 2) {
    flags.push({
      id: 'liderazgo', severidad: 'media',
      label: 'Autonomía declarada no calza con el score de liderazgo',
      detalle: `Autonomía: "${candidato.autonomia}", liderazgo evaluado en ${candidato.softSkills.liderazgo}/5.`,
      pregunta: 'Cuéntame de una situación reciente donde hayas liderado un equipo o tomado decisiones de arquitectura de forma autónoma.',
      respuesta: 'Sobre liderazgo/autonomía: dio un ejemplo puntual, aunque con menos protagonismo del que sugiere la autonomía que declara.',
    });
  }
  if (vacante && vacante.priority === 'High' && diasDisponibilidad(candidato.disponibilidad) >= 30) {
    flags.push({
      id: 'disponibilidad', severidad: 'alta',
      label: 'Disponibilidad extensa para una posición urgente',
      detalle: `Notice de ${candidato.disponibilidad} en una posición de prioridad alta.`,
      pregunta: 'Dado lo urgente de esta posición, ¿hay margen para acortar tu fecha de disponibilidad?',
      respuesta: 'Sobre disponibilidad: indicó que podría evaluar adelantar la fecha si la oferta final lo justifica.',
    });
  }
  /* Modalidad: no hay un campo de vacante para comparar contra (las
     vacantes de este prototipo no declaran modalidad propia), así que la
     señal es una inconsistencia dentro del propio CV -- el candidato
     declara una modalidad (la que quiere trabajar) que no calza con sus
     días presenciales/semana reportados. */
  const modalidadInconsistente =
    (candidato.modalidad === 'Remoto' && candidato.diasPresencialesPorSemana > 0) ||
    (candidato.modalidad === 'Presencial' && candidato.diasPresencialesPorSemana < 5) ||
    (candidato.modalidad === 'Híbrido' && (candidato.diasPresencialesPorSemana === 0 || candidato.diasPresencialesPorSemana >= 5));
  if (modalidadInconsistente) {
    flags.push({
      id: 'modalidad', severidad: 'media',
      label: `Modalidad declarada (${candidato.modalidad}) no calza con sus días presenciales`,
      detalle: `Dice trabajar en modalidad ${candidato.modalidad}, pero reporta ${candidato.diasPresencialesPorSemana} día(s) presenciales/semana.`,
      pregunta: `Cuéntame cómo es tu día a día actual: dices que tu modalidad es ${candidato.modalidad}, pero también reportas ${candidato.diasPresencialesPorSemana} día(s) presenciales a la semana. ¿Cuál es tu preferencia real de modalidad para este nuevo rol?`,
      respuesta: `Sobre modalidad: aclaró que su preferencia real es ${candidato.modalidad === 'Remoto' ? 'trabajar 100% remoto' : candidato.modalidad === 'Presencial' ? 'ir a oficina todos los días' : 'un esquema híbrido'}, y que la cifra de días presenciales reportada correspondía a una etapa puntual de su rol actual.`,
    });
  }
  const skillsFaltantes = vacante ? vacante.jd.skillsMustHave.filter(s => !candidato.skills.includes(s)) : [];
  if (mmDims.skills <= 2 && skillsFaltantes.length) {
    flags.push({
      id: 'skills', severidad: 'alta',
      label: 'No cubre todas las skills must-have del JD',
      detalle: `Sin experiencia declarada en: ${skillsFaltantes.join(', ')}.`,
      pregunta: `El JD pide ${skillsFaltantes.join(', ')}; ¿qué experiencia tienes puntualmente ahí?`,
      respuesta: `Sobre ${skillsFaltantes.join(', ')}: reconoció tener experiencia limitada ahí, pero se mostró dispuesto a reforzarlo rápido.`,
    });
  }
  if (vacante && vacante.seniority !== candidato.seniority) {
    flags.push({
      id: 'seniority', severidad: 'media',
      label: `Seniority declarado (${candidato.seniority}) distinto al solicitado (${vacante.seniority})`,
      detalle: `La vacante pide nivel ${vacante.seniority}.`,
      pregunta: `El rol está pensado para nivel ${vacante.seniority}; ¿cómo te sientes frente a ese nivel de exigencia?`,
      respuesta: 'Sobre el nivel del rol: se mostró cómodo con la exigencia, aunque reconoce que sería un salto respecto a su rol actual.',
    });
  }
  const orden = { alta: 0, media: 1 };
  return flags.sort((a, b) => orden[a.severidad] - orden[b.severidad]).slice(0, 3);
}

/* Transcript de la llamada de Screening, procesado por IA -- existe desde
   que Screening ya se hizo (mismo umbral que "hecha" en resolverEntrevistas
   para ese tipo), independiente del checklist/documentos de GO Interno

/* Reporte técnico -- evaluación estructurada de la Entrevista Técnica

function resolverChecklist(p) {

/* =========================================================================
   MATCHMAKING: CV del candidato vs. Job Description de la vacante.
   Vive a nivel de postulación (no de candidato -- el mismo candidato puede
   calzar distinto contra dos JDs distintas), se calcula automáticamente
   desde el momento en que se crea la postulación (Intake, ver el forEach
   de inicialización justo debajo de VACANTES). Se muestra en el detalle
   de la postulación (Pipeline), nunca a nivel de candidato: un mismo
   perfil no tiene "un" match, tiene un match distinto por cada JD.
   Por ahora es de solo lectura -- puramente el cálculo automático, sin
   edición manual del recruiter (eso queda para una iteración futura). */
const MATCHMAKING_DIMENSIONES = [
  { key: 'skills', nombre: 'Skills must-have', peso: 30 },
  { key: 'experiencia', nombre: 'Experiencia y seniority', peso: 25 },
  { key: 'dominio', nombre: 'Dominio de la práctica', peso: 15 },
  { key: 'compensacion', nombre: 'Expectativa salarial', peso: 20 },
  { key: 'disponibilidad', nombre: 'Disponibilidad', peso: 10 },
];
/* Baseline 100% derivado de datos reales de CV y JD -- nunca un número
   inventado, mismo criterio que el resto de las funciones `resolverX` de
   acá abajo. Cada arista queda en escala 1-5 (mismos dots que soft
   skills). */
function matchmakingBaseline(p, candidato, vacante) {
  const jd = (vacante && vacante.jd) || {};
  const mustHave = jd.skillsMustHave || [];
  const skillsCandidato = new Set((candidato.skills || []).map(s => s.toLowerCase()));
  const matched = mustHave.filter(s => skillsCandidato.has(s.toLowerCase())).length;
  const skills = mustHave.length ? Math.max(1, Math.round((matched / mustHave.length) * 5)) : 3;

  const minAnios = (() => {
    const m = jd.anosExperiencia ? jd.anosExperiencia.match(/\d+/) : null;
    return m ? Number(m[0]) : 0;
  })();
  const diffAnios = (candidato.aniosExperienciaRelevante || 0) - minAnios;
  const experiencia = diffAnios >= 2 ? 5 : diffAnios >= 0 ? 4 : diffAnios >= -1 ? 3 : diffAnios >= -3 ? 2 : 1;

  const dominio = (vacante && candidato.subEspecialidad && candidato.subEspecialidad === vacante.subEspecialidad) ? 5
    : (vacante && candidato.especialidad === vacante.especialidad) ? 4
    : (vacante && candidato.practica === vacante.practica) ? 2 : 1;

  const cobertura = p.porcentajeCobertura;
  const compensacion = cobertura == null ? 3 : cobertura >= 100 ? 5 : cobertura >= 90 ? 4 : cobertura >= 80 ? 3 : cobertura >= 70 ? 2 : 1;

  const disponibilidad = (() => {
    if (!candidato.disponibilidad) return 3;
    if (/inmediata/i.test(candidato.disponibilidad)) return 5;
    const m = candidato.disponibilidad.match(/\d+/);
    if (!m) return 3;
    const dias = Number(m[0]);
    return dias <= 15 ? 4 : dias <= 30 ? 3 : 2;
  })();

  return { skills, experiencia, dominio, compensacion, disponibilidad };
}
/* Siempre devuelve el objeto vigente -- ya viene inicializado desde el
   forEach de arranque, este getter es solo para blindar contra datos que
   se hayan creado después sin pasar por ahí. */
function getMatchmaking(p) {
  if (!p.matchmaking) {
    const candidato = CANDIDATOS.find(c => c.id === p.candidatoId);
    const vacante = VACANTES.find(v => v.id === p.vacanteId);
    p.matchmaking = { dims: matchmakingBaseline(p, candidato, vacante) };
  }
  return p.matchmaking;
}
function matchmakingScoreFinal(dims) {
  const total = MATCHMAKING_DIMENSIONES.reduce((sum, d) => sum + (dims[d.key] || 0) * d.peso, 0);
  return Math.round(total / 5);
}
/* Pregunta estándar por cada arista del Matching de CV vs JD -- una por
   key de MATCHMAKING_DIMENSIONES, para la Guía de Pre-screening (ver
   guiaScreeningHtml en renderPostulacionDrawerBody). */
const SCREENING_PREGUNTAS = {
  skills: '¿Puede detallar su experiencia práctica con cada uno de los skills must-have del rol?',
  experiencia: '¿Cuántos años de experiencia relevante tiene realmente para este nivel de seniority?',
  dominio: '¿Su trayectoria calza con la práctica/especialidad de esta posición?',
  compensacion: '¿Cuál es su expectativa salarial actualizada? ¿Está dentro de la banda de la posición?',
  disponibilidad: '¿Cuál es su disponibilidad real de incorporación (notice period)?',
};
/* Resultado del early matching automático de Intake -- ahora se deriva del
   motor de matchmaking de arriba (mismo score que ve el recruiter en el
   detalle de la postulación), en vez de un campo aislado. Sigue siendo
   puramente informativo para el Gate: Matching Automático -- nunca
   bloquea el botón Aprobar. */
function resolverIntakeMatching(p) {
  const score = matchmakingScoreFinal(getMatchmaking(p).dims);
  const resultado = score >= 85 ? 'Fuerte' : score >= 70 ? 'Aceptable' : 'Débil';
  return { score, resultado };
}

function resolverDocumentos(p, candidato) {
  const idx = idxEnOrden(p);

function especialidadesDe(practica) {
  const p = PRACTICAS_TAXONOMIA.find(x => x.practica === practica);
  return p ? p.especialidades.map(e => e.especialidad) : [];
}
function subEspecialidadesDe(practica, especialidad) {
  const p = PRACTICAS_TAXONOMIA.find(x => x.practica === practica);
  const e = p && p.especialidades.find(x => x.especialidad === especialidad);
  return e ? e.subEspecialidades : [];
}
/* Seniority elaborado: la banda (Junior/Mid/Senior) se mantiene tal cual
   para no romper los filtros/comparaciones existentes -- estos dos campos
   se agregan como hermanos, solo en CANDIDATOS. */
/* Soft skills: estándar fijo de 5 competencias, rating 1-5, igual para
   todos los candidatos -- comparable entre sí, a diferencia de un texto
   libre. */
const SOFT_SKILL_LABELS = { comunicacion: 'Comunicación', liderazgo: 'Liderazgo', trabajoEnEquipo: 'Trabajo en equipo', adaptabilidad: 'Adaptabilidad', resolucionProblemas: 'Resolución de problemas' };
/* Hard skills calificadas 1-5, mismo criterio visual que Soft skills (dots
   en vez de una lista plana de tags) -- no hay un campo real de "qué tan
   fuerte es cada skill" en el modelo, así que se deriva determinísticamente
   del candidato+skill (nunca aleatorio de verdad, para que sea estable
   entre renders). Rango 3-5 porque son skills que el propio candidato ya
   declara tener -- no tendría sentido mostrar una que domina poco. */
/* Delta simulado vs. la semana pasada para las KPI del Dashboard -- no hay
   series historicas reales todavia, asi que se deriva un valor estable
   (mismo criterio hash que hardSkillScore) a partir del label + valor
   actual, nunca aleatorio en cada render. */
function deltaSimulado(label, valorActual) {
  const str = label + valorActual;
  let hash = 0;
  for (let i = 0; i < str.length; i++) hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
  return (hash % 9) - 4; // rango -4..+4
}
function kpiDeltaHtml(label, valorActual) {
  const d = deltaSimulado(label, valorActual);
  const cls = d > 0 ? 'up' : d < 0 ? 'down' : 'flat';
  const arrow = d > 0 ? '▲' : d < 0 ? '▼' : '▬';
  return `<div class="rb-kpi-delta ${cls}">${arrow} ${d > 0 ? '+' : ''}${d} vs. semana pasada</div>`;
}
function hardSkillScore(candidato, skill) {
  const str = candidato.id + skill;
  let hash = 0;
  for (let i = 0; i < str.length; i++) hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
  return 3 + (hash % 3);
}
function hardSkillsRatingHtml(candidato) {
  return candidato.skills.map(s => `<div class="rb-detail-row"><span>${esc(s)}</span><span class="rb-dots">${[1, 2, 3, 4, 5].map(n => `<span class="rb-dot${n <= hardSkillScore(candidato, s) ? ' filled' : ''}"></span>`).join('')}</span></div>`).join('');
}
function extraerSkills(texto) {
  if (!texto) return [];
  return [...new Set(SKILLS_CONOCIDOS.filter(s => texto.toLowerCase().includes(s.toLowerCase())))];
}
function adivinarSeniority(texto) {
  const t = (texto || '').toLowerCase();
  if (t.includes('senior') || t.includes('lead') || t.includes('líder') || t.includes('lider')) return 'Senior';
  if (t.includes('junior') || t.includes('trainee')) return 'Junior';
  return 'Mid';
}
function adivinarClienteId(texto) {
  const t = (texto || '').toLowerCase();
  const match = CLIENTES.find(c => t.includes(c.nombre.toLowerCase()));
  return match ? match.id : null;
}
function adivinarPresupuesto(texto) {
  if (!texto) return null;
  const nums = texto.match(/[\d,\.]{3,}/g);
  if (!nums) return null;
  const limpios = nums.map(n => parseInt(n.replace(/[,\.]/g, ''), 10)).filter(n => n > 500 && n < 100000);
  if (limpios.length === 0) return null;
  return { min: Math.min(...limpios), max: Math.max(...limpios) };
}
const CONVERSACION_SCRIPT = [
  { campo: 'inicial', pregunta: '¿Qué perfil necesitas cubrir? Cuéntame el rol, para qué cliente, y para cuándo lo necesitas.' },
  { campo: 'skillsMustHave', pregunta: '¿Qué tecnologías o skills son imprescindibles para este rol? (sepáralas por comas)' },
  { campo: 'skillsNiceToHave', pregunta: '¿Algún skill deseable pero no obligatorio? Si no hay, escribe "ninguno".' },

function esc(s) { return (s === null || s === undefined) ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* <select> nativo genérico. Reemplazó a una versión anterior con
   autocomplete (input + datalist): tras revisar las ~29 listas de la app
   (los ~26 campos que en algún momento usaron este helper, más los 3
   quick filters originales de Talent Database), ninguna supera las 7
   opciones -- para listas tan cortas el autocomplete no aporta valor real
   de búsqueda y sí agrega un riesgo que el <select> no tiene: se podía
   tipear texto que no matchea nada y se revertía solo en vez de ser
   simplemente imposible elegir un valor inválido.
   `options` es un array de {value, label}. Mismo signature que tenía el
   helper de autocomplete (incluido `placeholder`, ya sin uso acá) para no
   tener que tocar ninguno de los call sites -- solo cambia la
   implementación interna. */
function renderSelect(id, options, currentValue, placeholder, onCommitBody, ariaLabel, groupLabel, wide) {
  const optionsHtml = options.map(o => `<option value="${esc(o.value)}" ${String(o.value) === String(currentValue) ? 'selected' : ''}>${esc(o.label)}</option>`).join('');
  /* `wide`: variante a ancho completo (100%, clase `.select.input`) para
     campos de formulario, donde las opciones son nombres/etiquetas largas
     (clientes, prácticas, especialidades). Sin `wide` usa el mismo look
     compacto (`.rb-filter-select`) que ya usaban los filtros rápidos de
     Talent Database -- antes con esquinas full pill, ahora con el mismo
     radio moderado que `.input`/`.select` (ver referencia visual del
     usuario: rectangular con esquinas redondeadas, no una cápsula). */
  const field = `<select id="${id}" class="${wide ? 'select input' : 'rb-filter-select'}" ${ariaLabel ? `aria-label="${esc(ariaLabel)}"` : ''} onchange="(function(value){ ${onCommitBody} })(this.value)">${optionsHtml}</select>`;
  return groupLabel
    ? `<div class="rb-quick-filter-group"><span class="lbl">${esc(groupLabel)}</span>${field}</div>`
    : field;
}

/* Switch biestable -- reemplaza pares de botones tipo "Colapsar todo" /
   "Expandir todo" por un solo control. `checked` es el estado actual
   (ON = todo colapsado); `onToggleExpr` es el JS a ejecutar al togglear
   (normalmente la misma función "colapsar/expandir todo" que ya existía,
   invocada con el valor opuesto a `checked`). `id` debe ser único por
   instancia para el aria-labelledby. */
function renderCollapseSwitch(id, checked, onToggleExpr, label) {
  return `<span class="rb-switch-field">
    <span id="${id}-label" class="rb-switch-text">${esc(label || 'Colapsar todo')}</span>
    <button type="button" role="switch" aria-checked="${checked}" aria-labelledby="${id}-label" class="rb-switch" onclick="${onToggleExpr}"><span class="rb-switch-thumb"></span></button>
  </span>`;
}

/* Lee el tema guardado de una sesión anterior (localStorage puede lanzar
   en contextos con storage bloqueado -- ej. iframes/incógnito con
   restricciones -- de ahí el try/catch). Default 'light': quien nunca
   tocó el toggle arranca en claro; el oscuro solo se mantiene si ya lo
   había elegido explícitamente antes. */
function leerThemeGuardado() {
  try { return localStorage.getItem('rb-theme') === 'dark' ? 'dark' : 'light'; }
  catch (e) { return 'light'; }
}

/* ---- tags de skills: color estable por valor, tomado de la paleta del DS,
   para que dos tags con texto distinto se distingan a simple vista sin
   depender solo de leer la palabra. Mismo skill = siempre mismo color. ---- */
/* Todos los colores acá deben tener suficiente luminancia para leerse como
   texto sobre su propio fondo semitransparente (background:${c}22) encima
   de superficies oscuras -- por eso no incluye tonos oscuros como
   --rb-blue (#382EDC), que se veían casi ilegibles como texto de tag. */
const RB_TAG_PALETTE = ['#8078F0', '#47EBEB', '#8452FD', '#3CCB7F', '#FFB020', '#FF5A36', '#19B8B8', '#5AC8FA'];
/* Mismos 8 tonos, oscurecidos a mano para dar ~4.5:1 de contraste sobre
   --rb-paper (misma cuenta que el resto de las variantes "-text" -- acá no
   se pudo resolver con un token CSS porque tagColor() ya elige el hex
   final vía hash, no hay dónde "indirectar" con var()). Mismo orden/índice
   que RB_TAG_PALETTE para que un skill mantenga la misma familia de color
   al cambiar de tema, solo más oscura. */
const RB_TAG_PALETTE_LIGHT = ['#6258EC', '#0D7878', '#7B45FD', '#217B4B', '#956000', '#D42600', '#117B7B', '#0576A9'];
function tagColor(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  const paleta = state.ui.theme === 'light' ? RB_TAG_PALETTE_LIGHT : RB_TAG_PALETTE;
  return paleta[h % paleta.length];
}
function skillTag(s) {
  const c = tagColor(s);
  return `<span class="rb-tag" style="background:${c}22;color:${c};box-shadow:inset 0 0 0 1px ${c}55">${esc(s)}</span>`;
}

/* ---- disponibilidad del candidato: normaliza el texto libre ("Inmediata",
   "15 días"...) a numero de dias para poder ordenar y colorear por cercania. ---- */
function diasDisponibilidad(str) {
  if (!str) return Infinity;
  const s = String(str).toLowerCase();
  if (s.includes('inmediat')) return 0;
  const m = s.match(/\d+/);
  return m ? parseInt(m[0], 10) : Infinity;
}
function disponibilidadColor(dias) {
  if (dias === 0) return 'var(--success-text)';
  if (dias <= 15) return 'var(--cyan-text)';
  if (dias <= 30) return 'var(--warning-text)';
  return 'var(--text-dim)';
}

/* Helper generico para editar arrays anidados por path de texto (usado por
   tags y bandas, tanto en el wizard como en el formulario de edicion). */
function resolvePath(path) {
  const parts = path.split('.');
  let obj = state;
  for (let i = 0; i < parts.length - 1; i++) obj = obj[parts[i]];
  return { obj, key: parts[parts.length - 1] };
}
function tagAdd(path, inputId) {
  const el = document.getElementById(inputId);
  const val = el ? el.value.trim() : '';
  if (!val) return;
  const { obj, key } = resolvePath(path);
  obj[key].push(val);
  render();
}
function tagRemove(path, value) {
  const { obj, key } = resolvePath(path);
  obj[key] = obj[key].filter(x => x !== value);
  render();
}
function renderTagInput(path, items, placeholder) {
  const inputId = 'tag-input-' + path.replace(/\./g, '-');
  const tags = items.length ? `<div class="rb-tags" style="margin-bottom:6px">${items.map(s => { const c = tagColor(s); return `<span class="rb-tag" style="background:${c}22;color:${c};box-shadow:inset 0 0 0 1px ${c}55">${esc(s)} <span class="rb-tag-x" role="button" tabindex="0" aria-label="Quitar ${esc(s)}" onclick="tagRemove('${path}', ${esc(JSON.stringify(s))})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault(); tagRemove('${path}', ${esc(JSON.stringify(s))});}">${icon('x',10)}</span></span>`; }).join('')}</div>` : '';
  return `${tags}<div style="display:flex;gap:6px">
    <input id="${inputId}" class="input" placeholder="${esc(placeholder)}" onkeydown="if(event.key==='Enter'){event.preventDefault(); tagAdd('${path}','${inputId}');}" />
    <button type="button" class="btn secondary sm" onclick="tagAdd('${path}','${inputId}')">Agregar</button>
  </div>`;
}
function addBanda(path) { const { obj, key } = resolvePath(path); obj[key].push({ nivel: '', min: 0, max: 0 }); render(); }
function removeBanda(path, i) { const { obj, key } = resolvePath(path); obj[key].splice(i, 1); render(); }
function updateBandaField(path, i, field, value) { const { obj, key } = resolvePath(path); obj[key][i][field] = field === 'nivel' ? value : Number(value); }

/* =========================================================================
   VISTA: DASHBOARD
   Foto operativa del negocio para el equipo: salud del pipeline, riesgo de
   SLA, carga por recruiter, mezcla de origen del talent pool, mejores
   señales activas, pipeline estancado y demanda de skills. Todo reusa los
   mismos criterios/colores que ya usan Clientes y Pipeline (PHASES,
   esTopTalent, deadlineInfo, priorityBadge...), asi que nada de esto
   introduce una fuente de verdad nueva -- solo la consolida.
   ========================================================================= */
function progresoGlobal(postulaciones) {
  /* Colores distintos para cada segmento, incluso entre los dos gates y la
     fase "Con Cliente" (los tres compartian --rb-cyan y se volvian
     indistinguibles apenas coincidian en la misma barra). Nada de esto se
     usa para badges individuales (ahi el cian de "gate" sigue teniendo
     sentido) -- es solo la paleta del grafico segmentado. */
  const buckets = [];
  /* El gate de Identificado ya no es su propio bucket -- se suma al de
     "Sourcing" (mismo criterio que renderBoardColumns en el kanban),
     porque conceptualmente es parte de esa fase, no un paso previo a
     ella. */
  PHASES.forEach((phase, i) => {
    const esSourcing = phase.id === 'sourcing';
    const count = postulaciones.filter(p => phase.sub.includes(p.etapa)).length + (esSourcing ? postulaciones.filter(p => p.etapa === GATE_INTAKE).length : 0);
    buckets.push({ label: phase.label, color: phase.color, count });
    /* Los gates ya no piden prestado un color de estado (--danger-text/
       --warning-text) -- un gate es un checkpoint DENTRO de la fase que lo
       precede, no una categoria propia ni una alerta, asi que hereda el
       color de esa fase y se distingue con una textura (is-gate en
       stackedBarHtml) en vez de un hue distinto. */
    if (i === 1) buckets.push({ label: 'Gate GO Interno', color: phase.color, isGate: true, count: postulaciones.filter(p => p.etapa === GATE_GO_INTERNO).length });
    if (i === 2) buckets.push({ label: 'Gate Decisión Cliente', color: phase.color, isGate: true, count: postulaciones.filter(p => p.etapa === GATE_CLIENTE).length });
  });
  return buckets;
}

/* Barra apilada premium (funnel global, origen del talent pool): gap real
   entre segmentos, extremos redondeados, tooltip on-hover (CSS-only via
   data-tooltip, sin listeners JS por segmento) y label directo de % en los
   segmentos que tienen ancho suficiente para mostrarlo sin que se corte.
   Ver skill de dataviz: color por funcion (categorico = identidad),
   leyenda siempre presente para 2+ series, texto nunca en el color de la
   serie (el label va en blanco sobre el segmento, no en el color mismo). */
function stackedBarHtml(buckets) {
  const activos = buckets.filter(b => b.count > 0);
  if (!activos.length) return `<div class="rb-stackbar"><div class="rb-stackbar-seg" style="flex:1;background:var(--border)"></div></div><p class="rb-resumen" style="color:var(--text-muted);margin:8px 0 0">Sin datos por ahora.</p>`;
  const total = activos.reduce((s, b) => s + b.count, 0);
  const segs = activos.map(b => {
    const pct = Math.round((b.count / total) * 100);
    return `<div class="rb-stackbar-seg${b.isGate ? ' is-gate' : ''}" style="flex:${b.count};background:${b.color}" data-tooltip="${esc(b.label)}: ${b.count} (${pct}%)">${pct >= 8 ? `<span class="rb-stackbar-label">${pct}%</span>` : ''}</div>`;
  }).join('');
  const legend = activos.map(b => `<span><span class="dot" style="background:${b.color}"></span>${b.count} ${esc(b.label)}</span>`).join('');
  return `<div class="rb-stackbar">${segs}</div><div class="rb-funnel-legend">${legend}</div>`;
}

/* Gráfico de líneas a mano (sin librerías -- mismo criterio "SVG a mano"
   que ya usa icon()) para la evolución acumulada de solicitadas/cerradas
   de un cliente en el Dashboard. Se agrega un punto sintético en la fecha
   de hoy al final (repitiendo los últimos totales) para que la curva
   llegue hasta el presente en vez de cortarse en el último evento real --
   si no, un cliente con un solo cierre antiguo se vería como un punto
   suelto en vez de una línea. Los círculos (eventos reales) sí usan solo
   `data`, nunca el punto sintético, para no marcar un evento que no
   ocurrió. */
function renderEvolucionChart(data, clienteNombre) {
  if (data.length === 0) {
    return `<p class="rb-resumen" style="color:var(--text-muted)">Todavía no hay posiciones solicitadas para este cliente.</p>`;
  }
  const hoy = new Date().toISOString().slice(0, 10);
  const puntos = data[data.length - 1].fecha < hoy
    ? [...data, { fecha: hoy, solicitadas: data[data.length - 1].solicitadas, cerradas: data[data.length - 1].cerradas }]
    : data;

  const W = 520, H = 140, PAD = 10;
  const t0 = new Date(puntos[0].fecha).getTime();
  const t1 = new Date(puntos[puntos.length - 1].fecha).getTime();
  const spanT = Math.max(1, t1 - t0);
  const maxY = Math.max(1, ...puntos.map(p => Math.max(p.solicitadas, p.cerradas)));
  const x = f => PAD + ((new Date(f).getTime() - t0) / spanT) * (W - PAD * 2);
  const y = v => H - PAD - (v / maxY) * (H - PAD * 2);
  const linea = campo => puntos.map(p => `${x(p.fecha).toFixed(1)},${y(p[campo]).toFixed(1)}`).join(' ');
  const dots = (campo, color) => data.map(p => `<circle cx="${x(p.fecha).toFixed(1)}" cy="${y(p[campo]).toFixed(1)}" r="2.5" fill="${color}"></circle>`).join('');
  /* Tooltip real on-hover por punto: un marker invisible posicionado en %
     (mismo sistema x/y que ya calcula el SVG) superpuesto sobre el punto,
     con el mismo mecanismo CSS-only data-tooltip que usa stackedBarHtml --
     evita tener que instrumentar mousemove/crosshair sobre el SVG. */
  const puntosTooltip = (campo, color, nombreCampo) => data.map(p => `<div class="rb-chart-point" style="left:${(x(p.fecha) / W * 100).toFixed(2)}%;top:${(y(p[campo]) / H * 100).toFixed(2)}%;background:${color}" data-tooltip="${esc(p.fecha)} · ${nombreCampo}: ${p[campo]}"></div>`).join('');
  const ultimo = puntos[puntos.length - 1];

  return `
    <div class="rb-evolucion-wrap">
      <svg viewBox="0 0 ${W} ${H}" class="rb-evolucion-svg" role="img" aria-label="Evolución acumulada de posiciones solicitadas y cerradas para ${esc(clienteNombre)}">
        <line x1="${PAD}" y1="${(H / 3).toFixed(1)}" x2="${W - PAD}" y2="${(H / 3).toFixed(1)}" stroke="var(--border)" stroke-width="1" />
        <line x1="${PAD}" y1="${(H * 2 / 3).toFixed(1)}" x2="${W - PAD}" y2="${(H * 2 / 3).toFixed(1)}" stroke="var(--border)" stroke-width="1" />
        <polyline points="${linea('solicitadas')}" fill="none" stroke="var(--cyan-text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <polyline points="${linea('cerradas')}" fill="none" stroke="var(--purple-text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        ${dots('solicitadas', 'var(--cyan-text)')}
        ${dots('cerradas', 'var(--purple-text)')}
        <text x="${(W - PAD - 4).toFixed(1)}" y="${(y(ultimo.solicitadas) - 6).toFixed(1)}" text-anchor="end" class="rb-evolucion-endlabel" fill="var(--cyan-text)">${ultimo.solicitadas}</text>
        <text x="${(W - PAD - 4).toFixed(1)}" y="${(y(ultimo.cerradas) + 13).toFixed(1)}" text-anchor="end" class="rb-evolucion-endlabel" fill="var(--purple-text)">${ultimo.cerradas}</text>
      </svg>
      ${puntosTooltip('solicitadas', 'var(--cyan-text)', 'Solicitadas')}
      ${puntosTooltip('cerradas', 'var(--purple-text)', 'Cerradas')}
    </div>
    <div class="rb-funnel-legend">
      <span><span class="dot" style="background:var(--cyan-text)"></span>Solicitadas (${data[data.length - 1].solicitadas})</span>
      <span><span class="dot" style="background:var(--purple-text)"></span>Cerradas (${data[data.length - 1].cerradas})</span>
    </div>
    <div class="rb-evolucion-axis"><span>${esc(data[0].fecha)}</span><span>${esc(hoy)}</span></div>`;
}

function renderDashboard() {
  const vacantesAbiertas = VACANTES.filter(v => !esVacanteTerminal(v.estado));
  /* "En pipeline activo" excluye tanto las salidas (rechazos/no interesado)
     como contratado -- contratado ya es un resultado, no algo en curso. */
  const enProceso = POSTULACIONES.filter(p => !SALIDAS.includes(p.etapa) && p.etapa !== 'contratado');
  const colocadosHistorico = POSTULACIONES.filter(p => p.etapa === 'contratado');
  const topTalentActivo = enProceso.filter(esTopTalent);

  /* ---- Clientes con más actividad: cuantas vacantes abiertas y cuanto
     pipeline activo tiene cada cliente -- el dashboard no tenia nada de
     clientes todavia. Ordenado por volumen total, top 5. ---- */
  const clientesRanking = CLIENTES.map(c => {
    const vacIds = vacantesDeCliente(c.id).map(v => v.id);
    return { c, abiertas: abiertasDeCliente(c.id).length, pipeline: enProceso.filter(p => vacIds.includes(p.vacanteId)).length };
  }).filter(x => x.abiertas > 0 || x.pipeline > 0)
    .sort((a, b) => (b.pipeline + b.abiertas) - (a.pipeline + a.abiertas))
    .slice(0, 5);

  /* ---- Evolución de solicitadas vs. cerradas del cliente elegido en el
     selector. Se inicializa (solo la primera vez) al cliente activo con
     más vacantes solicitadas en total -- clientesRanking no sirve acá
     porque excluye clientes sin pipeline activo, y un cliente puede tener
     historial de solicitudes/cierres sin tener nada abierto hoy. ---- */
  if (state.ui.dashboardClienteId === null) {
    const topPorVolumen = [...CLIENTES].filter(c => c.activo)
      .sort((a, b) => vacantesDeCliente(b.id).length - vacantesDeCliente(a.id).length)[0];
    state.ui.dashboardClienteId = topPorVolumen ? topPorVolumen.id : null;
  }
  const clienteEvolucion = CLIENTES.find(c => c.id === state.ui.dashboardClienteId);
  const evolucionData = clienteEvolucion ? evolucionClienteData(clienteEvolucion.id) : [];
  const evolucionSelector = renderSelect('dash-evolucion-cliente', CLIENTES.filter(c => c.activo).map(c => ({ value: c.id, label: c.nombre })), state.ui.dashboardClienteId, 'Cliente', 'state.ui.dashboardClienteId=parseInt(value,10); render();', 'Cliente');

  const kpiGrid = `
    <div class="rb-kpi-grid">
      <div class="rb-kpi-card"><div class="n">${vacantesAbiertas.length}</div><div class="l">Posiciones abiertas</div>${kpiDeltaHtml('Posiciones abiertas', vacantesAbiertas.length)}</div>
      <div class="rb-kpi-card"><div class="n">${enProceso.length}</div><div class="l">En pipeline activo</div>${kpiDeltaHtml('En pipeline activo', enProceso.length)}</div>
      <div class="rb-kpi-card"><div class="n">${colocadosHistorico.length}</div><div class="l">Colocaciones (histórico)</div>${kpiDeltaHtml('Colocaciones histórico', colocadosHistorico.length)}</div>
      <div class="rb-kpi-card"><div class="n" style="${topTalentActivo.length ? 'color:var(--cyan-text)' : ''}">${topTalentActivo.length}</div><div class="l">Top talent activo</div>${kpiDeltaHtml('Top talent activo', topTalentActivo.length)}</div>
    </div>`;

  /* ---- Riesgo de SLA, a nivel de todo el negocio (no solo un cliente) ---- */
  const vacantesEnRiesgo = vacantesAbiertas
    .map(v => ({ v, dl: deadlineInfo(v.clientDeadline) }))
    .filter(x => x.dl.slaStatus === 'urgente' || x.dl.slaStatus === 'vencido')
    .sort((a, b) => (a.dl.slaStatus === 'vencido' ? 0 : 1) - (b.dl.slaStatus === 'vencido' ? 0 : 1));
  const riesgoWidget = vacantesEnRiesgo.length ? `
    <div class="alert warn">
      <span class="ic">${icon('alertTriangle', 18)}</span>
      <div class="body"><strong>${vacantesEnRiesgo.length} ${vacantesEnRiesgo.length === 1 ? 'posición' : 'posiciones'} con el deadline ajustado</strong>
      <span>${vacantesEnRiesgo.slice(0, 4).map(x => vacanteInlineLink(x.v)).join(' · ')}${vacantesEnRiesgo.length > 4 ? '…' : ''}</span></div>
    </div>` : `
    <div class="alert success">
      <span class="ic">${icon('check', 18)}</span>
      <div class="body"><strong>Sin posiciones en riesgo de SLA</strong><span>Todos los deadlines de las posiciones abiertas están bajo control.</span></div>
    </div>`;

  /* ---- Funnel global (mismo agrupamiento por fase que usa Pipeline) ---- */
  const funnelHtml = stackedBarHtml(progresoGlobal(enProceso));

  /* ---- Prioridad de vacantes abiertas ---- */
  const porPrioridad = { High: 0, Medium: 0, Low: 0 };
  vacantesAbiertas.forEach(v => { porPrioridad[v.priority] = (porPrioridad[v.priority] || 0) + 1; });
  const prioridadRows = ['High', 'Medium', 'Low'].map(p => `<div class="rb-detail-row"><span>${priorityBadge(p)}</span><span>${porPrioridad[p]} abierta${porPrioridad[p] === 1 ? '' : 's'}</span></div>`).join('');

  /* ---- Carga por recruiter: cuantas postulaciones activas tiene cada uno.
     Metrica que propongo para el equipo -- ayuda a rebalancear antes de
     que alguien quede sobrecargado mientras otro recruiter tiene aire. ---- */
  const cargaPorRecruiter = RECRUITERS_DISPONIBLES.map(r => ({ r, n: enProceso.filter(p => recruiterDePostulacion(p) === r).length }));
  const maxCarga = Math.max(1, ...cargaPorRecruiter.map(x => x.n));
  /* Ramp secuencial de un solo hue (azul) segun carga relativa -- es
     magnitud, no categoria, asi que la codificacion correcta es
     luminosidad sobre un mismo hue, no un color por recruiter. */
  const cargaRows = cargaPorRecruiter.map(({ r, n }) => `
    <div class="rb-dash-row">
      <div class="lbl">${icon('user', 13)}<span class="txt">${esc(r)}</span></div>
      <div class="bar rb-score-bar"><div class="rb-score-fill" style="width:${(n / maxCarga) * 100}%;background:color-mix(in oklab, var(--rb-blue) ${Math.round((0.35 + (n / maxCarga) * 0.65) * 100)}%, var(--bg-elev))"></div></div>
      <div class="val">${n}</div>
    </div>`).join('');

  /* ---- Origen del talent pool: de donde viene el talento que tenemos.
     Metrica que propongo -- si Outbound domina, el equipo depende de
     sourcing activo; si Inbound/Referido crecen, el employer brand y el
     boca a boca estan funcionando. ---- */
  const origenBuckets = ['Inbound', 'Referido', 'Outbound', 'Base de datos'].map(o => ({ label: o, color: ORIGEN_COLOR[o], count: CANDIDATOS.filter(c => c.origen === o).length }));
  const origenHtml = stackedBarHtml(origenBuckets);

  /* ---- Top talent en proceso: senales "Strong Yes" activas ahora mismo,
     para que un lead no tenga que ir a buscarlas dentro del board. ---- */
  const topTalentRows = topTalentActivo.length === 0
    ? `<p class="rb-resumen" style="color:var(--text-muted)">No hay señales "Strong Yes" activas en este momento.</p>`
    : topTalentActivo.slice(0, 6).map(p => {
      const cand = CANDIDATOS.find(x => x.id === p.candidatoId);
      return `<div class="rb-postulacion-row" onclick="goToDetalleProceso(${p.id})">
        <div><p class="rb-card-name" style="margin:0">${icon('trophy', 12)} ${esc(cand.nombre)}</p><p class="rb-card-sub" style="margin:0">${esc(p.vacante)} · ${esc(p.cliente)}</p></div>
        <span>${icon('arrowUpRight', 12)}</span>
      </div>`;
    }).join('');

  /* ---- Pipeline estancado: postulaciones activas que llevan demasiados
     dias en la misma etapa sin avanzar -- metrica que propongo para
     detectar cuellos de botella antes de que se conviertan en un SLA
     vencido. ---- */
  const UMBRAL_ESTANCADO = 5;
  const estancadas = enProceso.filter(p => p.dias >= UMBRAL_ESTANCADO).sort((a, b) => b.dias - a.dias);
  const estancadasRows = estancadas.length === 0
    ? `<p class="rb-resumen" style="color:var(--text-muted)">Ninguna postulación activa lleva ${UMBRAL_ESTANCADO}+ días sin avanzar de etapa.</p>`
    : estancadas.slice(0, 6).map(p => {
      const cand = CANDIDATOS.find(x => x.id === p.candidatoId);
      return `<div class="rb-postulacion-row" onclick="goToDetalleProceso(${p.id})">
        <div><p class="rb-card-name" style="margin:0">${esc(cand.nombre)}</p><p class="rb-card-sub" style="margin:0">${esc(ETAPA_LABELS[p.etapa])} · ${esc(p.vacante)}</p></div>
        <span style="color:var(--warning-text);font-weight:600">${p.dias}d</span>
      </div>`;
    }).join('');

  /* ---- Skills mas demandadas entre las vacantes abiertas: senal de que
     necesita el pipeline de sourcing hoy, no que hay disponible. ---- */
  const skillCounts = {};
  vacantesAbiertas.forEach(v => v.jd.skillsMustHave.forEach(s => { skillCounts[s] = (skillCounts[s] || 0) + 1; }));
  const topSkills = Object.entries(skillCounts).sort((a, b) => b[1] - a[1]).slice(0, 10);
  const skillsHtml = topSkills.length === 0
    ? `<p class="rb-resumen" style="color:var(--text-muted)">Las posiciones abiertas todavía no tienen skills must-have cargadas.</p>`
    : `<div class="rb-tags">${topSkills.map(([s, n]) => { const c = tagColor(s); return `<span class="rb-tag" style="background:${c}22;color:${c};box-shadow:inset 0 0 0 1px ${c}55">${esc(s)} · ${n}</span>`; }).join('')}</div>`;

  const clientesHtml = clientesRanking.length === 0
    ? `<p class="rb-resumen" style="color:var(--text-muted)">Todavía no hay actividad de pipeline en ningún cliente.</p>`
    : clientesRanking.map(({ c, abiertas, pipeline }) => `
      <div class="rb-postulacion-row" onclick="goToCliente(${c.id})">
        <div style="display:flex;align-items:center;gap:10px">${clienteLogo(c.nombre, 'sm')}<div><p class="rb-card-name" style="margin:0">${esc(c.nombre)}</p><p class="rb-card-sub" style="margin:0">${abiertas} abierta${abiertas === 1 ? '' : 's'} · ${pipeline} en pipeline</p></div></div>
        <span>${icon('arrowUpRight', 12)}</span>
      </div>`).join('');

  return `
    <h1 class="rb-title rb-display">Dashboard</h1>
    ${kpiGrid}
    ${riesgoWidget}
    <div class="rb-dash-cols">
      <div class="rb-dash-col-main">
        <div class="card rb-detail-section"><h3>Funnel global de pipeline</h3>${funnelHtml}</div>
        <div class="card rb-detail-section">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);margin-bottom:var(--sp-4)">
            <h3 style="margin:0">Evolución: solicitadas vs. cerradas</h3>
            ${evolucionSelector}
          </div>
          ${renderEvolucionChart(evolucionData, clienteEvolucion ? clienteEvolucion.nombre : '')}
        </div>
        <div class="card rb-detail-section"><h3>Origen del talent pool</h3>${origenHtml}</div>
      </div>
      <div class="rb-dash-col-rail">
        <div class="card rb-detail-section"><h3>Clientes con más actividad</h3>${clientesHtml}</div>
        <div class="card rb-detail-section"><h3>Carga por recruiter</h3>${cargaRows}</div>
        <div class="card rb-detail-section"><h3>Prioridad de posiciones abiertas</h3>${prioridadRows}</div>
      </div>
    </div>
    <div class="rb-dash-grid" style="margin-top:var(--sp-4)">
      <div class="card rb-detail-section rb-bento-lg"><h3>Top talent en proceso</h3>${topTalentRows}</div>
      <div class="card rb-detail-section rb-bento-lg"><h3>Pipeline estancado (${UMBRAL_ESTANCADO}+ días sin avanzar)</h3>${estancadasRows}</div>
      <div class="card rb-detail-section rb-bento-full"><h3>Skills más demandadas (posiciones abiertas)</h3>${skillsHtml}</div>
    </div>`;
}

/* =========================================================================
   VISTA: CLIENTES
   ========================================================================= */
function vacantesDeCliente(clienteId) {
  return VACANTES.filter(v => v.clienteId === clienteId).sort((a, b) => PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority]);
}
function abiertasDeCliente(clienteId) {
  return vacantesDeCliente(clienteId).filter(v => v.estado === 'Abierta' || v.estado === 'Pending kickoff' || v.estado === 'On hold');
}
/* Posiciones abiertas de este cliente con el deadline vencido o a 3 días
   o menos -- mismo criterio de deadlineInfo que ya usa el widget de riesgo
   del Dashboard, acá a nivel de un cliente puntual para poder marcarlo en
   su card de la lista (ver renderClientesList). */
function vacantesEnRiesgoDeCliente(clienteId) {
  return abiertasDeCliente(clienteId).filter(v => {
    const dl = deadlineInfo(v.clientDeadline);
    return dl.slaStatus === 'urgente' || dl.slaStatus === 'vencido';
  });
}
function colocadosDeCliente(clienteId) {
  const vacIds = vacantesDeCliente(clienteId).map(v => v.id);
  return POSTULACIONES.filter(p => vacIds.includes(p.vacanteId) && p.etapa === 'contratado').map(p => ({ postulacion: p, candidato: CANDIDATOS.find(c => c.id === p.candidatoId) }));
}
function cerradasDeCliente(clienteId) {
  return vacantesDeCliente(clienteId).filter(v => esVacanteTerminal(v.estado));
}
/* Serie acumulada de "vacantes solicitadas" vs "vacantes cerradas" (solo
   Cerrada - Éxito, es decir posición cubierta con contratación -- no
   cuenta Cancelada ni Cerrada - Sin contratación) para el gráfico de
   evolución del Dashboard. Un punto por cada evento real (no una grilla
   mensual fija), con los totales acumulados hasta esa fecha. */
function evolucionClienteData(clienteId) {
  const vacs = vacantesDeCliente(clienteId);
  const eventos = [];
  vacs.forEach(v => {
    eventos.push({ fecha: v.intakeDate, tipo: 'solicitada' });
    if (v.estado === 'Cerrada - Éxito' && v.fechaCierre) eventos.push({ fecha: v.fechaCierre, tipo: 'cerrada' });
  });
  eventos.sort((a, b) => a.fecha.localeCompare(b.fecha));
  let solicitadas = 0, cerradas = 0;
  return eventos.map(e => {
    if (e.tipo === 'solicitada') solicitadas++; else cerradas++;
    return { fecha: e.fecha, solicitadas, cerradas };
  });
}
/* Breakdown de SLA de las vacantes abiertas de un cliente (on time / por
   vencer / vencidas), reusando deadlineInfo -- mismo criterio que ya se
   usa para el badge de SLA en las cards de vacante. */
function slaBreakdownCliente(clienteId) {
  const abiertas = abiertasDeCliente(clienteId);
  const breakdown = { onTime: 0, porVencer: 0, vencidas: 0 };
  abiertas.forEach(v => {
    const s = deadlineInfo(v.clientDeadline).slaStatus;
    if (s === 'vencido') breakdown.vencidas++;
    else if (s === 'pronto' || s === 'urgente') breakdown.porVencer++;
    else breakdown.onTime++;
  });
  return breakdown;
}
/* Cuántas vacantes (abiertas o históricas) tiene el cliente en cada
   modalidad. Solo tiene sentido mostrarlo si el cliente maneja ambas --
   la modalidad es una propiedad de la posición, no del cliente. */
function engagementBreakdownCliente(clienteId) {
  const todas = vacantesDeCliente(clienteId);
  const staffing = todas.filter(v => v.engagementModel === 'Staffing').length;
  const recruiting = todas.filter(v => v.engagementModel === 'Recruiting').length;
  return { staffing, recruiting };
}
/* Recruiters con vacantes abiertas en este cliente (derivado, no un campo
   del cliente -- el recruiter se asigna a nivel de posición). */
function recruitersDeCliente(clienteId) {
  return [...new Set(abiertasDeCliente(clienteId).map(v => v.recruiter).filter(Boolean))];
}
const TIER_COLOR = { 1: 'var(--purple-text)', 2: 'var(--blue-300-text)', 3: 'var(--text-muted)' };
function tierBadge(tier) {
  const c = TIER_COLOR[tier] || 'var(--text-muted)';
  return `<span class="rb-badge" style="background:${c}22;color:${c}">${icon('trophy',11)} Tier ${tier}</span>`;
}
function clienteActivoBadge(activo) {
  const c = activo ? 'var(--success)' : 'var(--text-muted)';
  return `<span class="rb-badge" style="background:${c}22;color:${c}">${icon('dot',10)} ${activo ? 'Activo' : 'Inactivo'}</span>`;
}
/* Avance de una vacante puntual: cuantas postulaciones activas tiene en
   cada fase del funnel (mismo agrupamiento que usa el tablero de Pipeline),
   para poder mostrar un mini-funnel consolidado en el drawer del cliente
   sin tener que ir a Pipeline a armarlo mentalmente. */
function progresoVacante(vacanteId) {
  const activas = POSTULACIONES.filter(p => p.vacanteId === vacanteId && !SALIDAS.includes(p.etapa));
  return { activas, buckets: progresoGlobal(activas), topTalent: activas.filter(esTopTalent).length };
}
function selectCliente(id) { state.cl.selectedId = id; render(); window.scrollTo(0, 0); }

/* Mezcla Recruiting/Staffing de un cliente, como texto con conteo -- se
   determina ÚNICAMENTE en base a las posiciones (vacantes) que tiene, sin
   ninguna clasificación manual de por medio (ver engagementBreakdownCliente,
   que ya lee el engagementModel real de cada vacante). Antes esto se
   probó como 2 badges de color aparte (uno por línea); se descartó
   porque en un cliente con ambas líneas terminaban compitiendo por
   atención con los badges de Tier/Activo sin aportar más que un sí/no.
   Como fila de metadata (mismo estilo que AM/Recruiters/posiciones
   abiertas) se lee de corrido con el resto de la card y de paso muestra
   CUÁNTAS vacantes tiene en cada modalidad, no solo si las tiene. Un
   cliente sin ninguna vacante todavía no muestra esta fila. */
function lineaResumenTexto(c) {
  /* Se cuenta solo sobre vacantes ABIERTAS (no engagementBreakdownCliente,
     que incluye históricas) -- así el desglose siempre suma exactamente
     lo mismo que "X posiciones abiertas" en la fila de abajo, en vez de
     un total que parece no cuadrar con el resto de la card. */
  const abiertas = abiertasDeCliente(c.id);
  const recruiting = abiertas.filter(v => v.engagementModel === 'Recruiting').length;
  const staffing = abiertas.filter(v => v.engagementModel === 'Staffing').length;
  const partes = [];
  if (recruiting > 0) partes.push(`${recruiting} Recruiting`);
  if (staffing > 0) partes.push(`${staffing} Staffing`);
  return partes.join(' · ');
}
function renderClienteCard(c) {
  const abiertas = abiertasDeCliente(c.id).length;
  const colocados = colocadosDeCliente(c.id).length;
  const recruiters = recruitersDeCliente(c.id);
  const enRiesgo = vacantesEnRiesgoDeCliente(c.id);
  const lineaResumen = lineaResumenTexto(c);
  return `
    <div class="card rb-vac-card${c.activo ? '' : ' rb-terminal-item'}" onclick="selectCliente(${c.id})">
      <div class="rb-vac-card-top">
        <div style="display:flex;align-items:center;gap:var(--sp-3)">
          ${clienteLogo(c.nombre, 'md')}
          <div><p class="rb-card-name" style="margin:0">${esc(c.nombre)}</p><p class="rb-card-role">${esc(c.industria)}</p></div>
        </div>
        <div class="rb-vac-badges">${clienteActivoBadge(c.activo)}</div>
      </div>
      ${enRiesgo.length ? `<p class="rb-card-meta-row rb-cliente-riesgo">${icon('alertTriangle',12)} ${enRiesgo.length} ${enRiesgo.length === 1 ? 'posición' : 'posiciones'} con SLA en riesgo</p>` : ''}
      <div class="rb-card-meta">
        <div class="rb-card-meta-row">${icon('user',12)} AM: ${esc(c.accountManagers.join(', '))}</div>
        <div class="rb-card-meta-row">${icon('compass',12)} Recruiters: ${recruiters.length ? esc(recruiters.join(', ')) : 'sin posiciones abiertas'}</div>
        ${lineaResumen ? `<div class="rb-card-meta-row">${icon('barChart',12)} ${esc(lineaResumen)}</div>` : ''}
        <div class="rb-card-meta-row">${icon('briefcase',12)} ${abiertas} posiciones abiertas</div>
        <div class="rb-card-meta-row">${icon('users',12)} ${colocados} talento colocado</div>
      </div>
    </div>`;
}
function toggleTierCollapse(tier) { state.cl.tiersCollapsed[tier] = !state.cl.tiersCollapsed[tier]; render(); }
function renderClientesList() {
  const industriasUnicas = [...new Set(CLIENTES.map(c => c.industria))].sort();
  const amsUnicos = [...new Set(CLIENTES.flatMap(c => c.accountManagers))].sort();
  const q = normalizarBusqueda(state.cl.query);
  const filtered = CLIENTES.filter(c => {
    if (state.cl.industriaF && c.industria !== state.cl.industriaF) return false;
    if (state.cl.activoF && String(c.activo) !== state.cl.activoF) return false;
    if (state.cl.amF && !c.accountManagers.includes(state.cl.amF)) return false;
    if (q && !normalizarBusqueda(c.nombre).includes(q)) return false;
    return true;
  });
  /* Agrupado por tier -- con 19 clientes un solo grid plano se sentía como
     "muchas cards de golpe" (mismo problema que ya resolvimos en Pipeline
     con los swimlanes de cliente colapsables). El tier ya reemplaza al
     filtro de Tier que existía antes (quedaría redundante con el
     agrupamiento: para ver solo un tier ahora se colapsan los otros dos). */
  const gruposHtml = [1, 2, 3].map(tier => {
    /* Orden dentro de cada tier: activo antes que inactivo siempre (mismo
       criterio que ya aplica el resto de la app a estados terminales --
       ver .rb-terminal-item/.rb-terminal-divider: "visibles como
       referencia pero con menor peso visual y al final del orden, nunca
       se ocultan, solo se les baja la prioridad"), y dentro de los
       activos, primero los que tienen alguna posición con SLA en riesgo
       -- misma lógica de "lo urgente primero" que ya usa el widget de
       riesgo del Dashboard. Alfabético como último criterio, para que
       dentro de cada grupo sea fácil encontrar un cliente puntual. */
    const items = filtered.filter(c => c.tier === tier).sort((a, b) => {
      if (a.activo !== b.activo) return a.activo ? -1 : 1;
      const riesgoA = vacantesEnRiesgoDeCliente(a.id).length > 0;
      const riesgoB = vacantesEnRiesgoDeCliente(b.id).length > 0;
      if (riesgoA !== riesgoB) return riesgoA ? -1 : 1;
      return a.nombre.localeCompare(b.nombre);
    });
    if (!items.length) return '';
    /* Con una búsqueda activa, el grupo se auto-expande aunque esté
       colapsado -- si no, buscar a alguien de un tier colapsado lo
       dejaría fuera de la vista aunque sí haya matcheado (mismo criterio
       que ya usa el buscador de Pipeline con sus swimlanes). */
    const colapsado = q ? false : !!state.cl.tiersCollapsed[tier];
    return `<div class="rb-cliente-tier-group">
      <div class="rb-group-header" onclick="toggleTierCollapse(${tier})">
        <span class="rb-group-chevron">${colapsado ? icon('chevronRight',11) : icon('chevronDown',11)}</span>
        ${tierBadge(tier)}
        <span class="rb-phase-count">${items.length} ${items.length === 1 ? 'cliente' : 'clientes'}</span>
      </div>
      ${colapsado ? '' : `<div class="rb-grid">${items.map(renderClienteCard).join('')}</div>`}
    </div>`;
  }).join('');
  return `
    <h1 class="rb-title rb-display">Clientes</h1>
    <div class="rb-filters">
      <div class="rb-inline-search">
        ${icon('search', 14)}
        <input id="cl-search" value="${esc(state.cl.query)}" placeholder="Buscar cliente…" oninput="state.cl.query=this.value; render()" />
        ${state.cl.query ? `<button type="button" class="rb-inline-search-clear" aria-label="Limpiar búsqueda" onclick="state.cl.query=''; render()">${icon('x', 12)}</button>` : ''}
      </div>
      ${renderSelect('cl-industria-f', [{ value: '', label: 'Todas' }, ...industriasUnicas.map(i => ({ value: i, label: i }))], state.cl.industriaF, 'Todas', 'state.cl.industriaF=value; render();', null, 'Industria')}
      ${renderSelect('cl-activo-f', [{ value: '', label: 'Todos' }, { value: 'true', label: 'Activo' }, { value: 'false', label: 'Inactivo' }], state.cl.activoF, 'Todos', 'state.cl.activoF=value; render();', null, 'Estado')}
      ${renderSelect('cl-am-f', [{ value: '', label: 'Todos' }, ...amsUnicos.map(am => ({ value: am, label: am }))], state.cl.amF, 'Todos', 'state.cl.amF=value; render();', null, 'Account Manager')}
    </div>

   VISTA: VACANTES (+ wizard de creación + edición)

function postulacionesDeVacante(vacanteId) { return POSTULACIONES.filter(p => p.vacanteId === vacanteId); }
function selectVacante(id) { state.va.selectedId = id; state.va.editando = false; render(); window.scrollTo(0, 0); }

function vacantesAgrupadas() {
  const filtered = VACANTES.filter(v => {
    if (state.va.clienteF && v.cliente !== state.va.clienteF) return false;
    if (state.va.estadoF && v.estado !== state.va.estadoF) return false;
    if (state.va.engagementF && v.engagementModel !== state.va.engagementF) return false;
    if (state.va.priorityF && v.priority !== state.va.priorityF) return false;
    return true;
  });
  const groups = {};
  filtered.forEach(v => { (groups[v.cliente] = groups[v.cliente] || []).push(v); });
  const sortFns = {
    priority: (a, b) => {
      const pd = PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority];
      if (pd !== 0) return pd;
      const da = diasHasta(a.clientDeadline), db = diasHasta(b.clientDeadline);
      if (da === null && db === null) return 0;
      if (da === null) return 1;
      if (db === null) return -1;
      return da - db;
    },
    deadline: (a, b) => {
      const da = diasHasta(a.clientDeadline), db = diasHasta(b.clientDeadline);
      if (da === null && db === null) return 0;
      if (da === null) return 1;
      if (db === null) return -1;
      return da - db;
    },
    reciente: (a, b) => new Date(b.intakeDate) - new Date(a.intakeDate),
    alfabetico: (a, b) => a.titulo.localeCompare(b.titulo),
  };
  const sortFn = sortFns[state.va.sortBy] || sortFns.priority;
  /* Primero lo accionable (estados no terminales) ordenado por el criterio
     elegido; las vacantes cerradas/canceladas quedan siempre al final. */
  Object.values(groups).forEach(arr => arr.sort((a, b) => {
    const ta = esVacanteTerminal(a.estado) ? 1 : 0, tb = esVacanteTerminal(b.estado) ? 1 : 0;
    if (ta !== tb) return ta - tb;
    return sortFn(a, b);
  }));
  const groupNames = Object.keys(groups).sort();
  return { filtered, groups, groupNames };
}
function toggleGroupCollapse(viewKey, groupName) {
  const st = viewKey === 'va' ? state.va : state.td;

function startEditVacante(id) {
  const v = VACANTES.find(x => x.id === id);
  state.editForm = {
    titulo: v.titulo, clienteId: v.clienteId, seniority: v.seniority, estado: v.estado,
    engagementModel: v.engagementModel, priority: v.priority, recruiter: v.recruiter || '',
    accountManager: v.accountManager || '', clientDeadline: v.clientDeadline || '', intakeDate: v.intakeDate || '',
    anosExperiencia: v.jd.anosExperiencia || '', descripcion: v.jd.descripcion || '', skillsMustHave: [...v.jd.skillsMustHave],
    skillsNiceToHave: [...v.jd.skillsNiceToHave],
    bandas: v.jd.bandas.length ? v.jd.bandas.map(b => ({ ...b })) : [{ nivel: 'Único', min: 0, max: 0 }],
    jdAprobada: v.jd.estadoAprobacion === 'aprobado',
    practica: v.practica, especialidad: v.especialidad, subEspecialidad: v.subEspecialidad,
  };
  state.va.editando = true;
  render();
  window.scrollTo(0, 0);
}
function cancelEditVacante() { state.va.editando = false; state.editForm = null; render(); window.scrollTo(0, 0); }
function guardarEdicionVacante() {
  const v = VACANTES.find(x => x.id === state.va.selectedId);

  const clienteObj = CLIENTES.find(c => c.id === ef.clienteId);
  Object.assign(v, {

    clientDeadline: ef.clientDeadline || null, intakeDate: ef.intakeDate || v.intakeDate, engagementModel: ef.engagementModel,
    recruiter: ef.recruiter || null, accountManager: ef.accountManager || null,
    jd: { estadoAprobacion: ef.jdAprobada ? 'aprobado' : 'borrador', descripcion: ef.descripcion, skillsMustHave: ef.skillsMustHave, skillsNiceToHave: ef.skillsNiceToHave, anosExperiencia: ef.anosExperiencia, bandas: ef.bandas.filter(b => b.min > 0 || b.max > 0) },
    practica: ef.practica, especialidad: ef.especialidad, subEspecialidad: ef.subEspecialidad,

}

/* =========================================================================
   WIZARD: Nueva Vacante (3 caminos convergen en la misma revision)
   ========================================================================= */
function openWizard() { state.wizard = newWizardState(); state.va.wizardOpen = true; state.va.selectedId = null; render(); window.scrollTo(0, 0); }
function volverElegirCamino() { state.wizard.step = 'elegir'; render(); }
function elegirCamino(camino) {
  if (camino === 'conversacional') {
    state.wizard.chatHistorial = [{ autor: 'ia', texto: CONVERSACION_SCRIPT[0].pregunta }];
    state.wizard.chatIndex = 0;
    state.wizard.chatRespuestas = {};
  }
  state.wizard.step = camino;
  render();
}
function sintetizarWizard(origen) {
  state.wizard.step = 'procesando';
  render();
  setTimeout(() => {
    const w = state.wizard;
    if (!w) return;
    let borrador;
    if (origen === 'kickoff' || origen === 'manual') {
      const texto = origen === 'kickoff' ? (w.dpTexto + ' ' + w.transcripcion) : w.textoLibre;
      borrador = {
        titulo: w.tituloForm,
        clienteId: w.clienteIdForm ? parseInt(w.clienteIdForm, 10) : adivinarClienteId(texto),
        seniority: adivinarSeniority(w.tituloForm + ' ' + texto),
        descripcion: texto.trim(),
        skillsMustHave: extraerSkills(texto), skillsNiceToHave: [], anosExperiencia: '',
        bandas: [{ nivel: 'Único', min: 0, max: 0 }],
        practica: '', especialidad: '', subEspecialidad: '',
      };
    } else {
      const datos = w.chatRespuestas;
      const presupuesto = adivinarPresupuesto(datos.presupuesto);
      borrador = {
        titulo: datos.inicial || '',
        clienteId: adivinarClienteId(datos.inicial),
        seniority: adivinarSeniority(datos.inicial),
        descripcion: '',
        skillsMustHave: (datos.skillsMustHave || '').split(',').map(s => s.trim()).filter(Boolean),
        skillsNiceToHave: (datos.skillsNiceToHave || '').toLowerCase().includes('ningun') ? [] : (datos.skillsNiceToHave || '').split(',').map(s => s.trim()).filter(Boolean),
        anosExperiencia: '',
        bandas: [{ nivel: 'Único', min: presupuesto ? presupuesto.min : 0, max: presupuesto ? presupuesto.max : 0 }],
        practica: '', especialidad: '', subEspecialidad: '',
      };
    }
    w.draft = Object.assign(borrador, { engagementModel: 'Staffing', priority: 'Medium', recruiter: '', accountManager: '', clientDeadline: '' });
    w.step = 'revisar';
    render();
  }, 1300);
}
function enviarChat() {
  const w = state.wizard;
  if (!w.chatInput.trim()) return;
  const campo = CONVERSACION_SCRIPT[w.chatIndex].campo;
  w.chatRespuestas[campo] = w.chatInput.trim();
  w.chatHistorial.push({ autor: 'user', texto: w.chatInput.trim() });
  w.chatInput = '';
  if (w.chatIndex + 1 < CONVERSACION_SCRIPT.length) {
    w.chatHistorial.push({ autor: 'ia', texto: CONVERSACION_SCRIPT[w.chatIndex + 1].pregunta });
    w.chatIndex++;
    render();
  } else {
    w.chatHistorial.push({ autor: 'ia', texto: 'Perfecto, arme un borrador con esto. Revísalo y ajusta lo que haga falta.' });
    render();
    sintetizarWizard('conversacional');
  }
}
function finalizarWizard(aprobar) {
  const w = state.wizard.draft;
  const clienteObj = CLIENTES.find(c => c.id === w.clienteId);
  const nuevoId = Math.max(...VACANTES.map(v => v.id)) + 1;
  const nueva = {
    id: nuevoId, clienteId: w.clienteId, titulo: w.titulo || 'Sin título',
    cliente: clienteObj ? clienteObj.nombre : 'Sin cliente', seniority: w.seniority,
    estado: aprobar ? 'Abierta' : 'Pending kickoff', priority: w.priority,
    clientDeadline: w.clientDeadline || null, intakeDate: new Date().toISOString().slice(0, 10),
    engagementModel: w.engagementModel, recruiter: w.recruiter || null, accountManager: w.accountManager || null,
    jd: { estadoAprobacion: aprobar ? 'aprobado' : 'borrador', descripcion: w.descripcion || '', skillsMustHave: w.skillsMustHave, skillsNiceToHave: w.skillsNiceToHave, anosExperiencia: w.anosExperiencia, bandas: w.bandas.filter(b => b.min > 0 || b.max > 0) },
    practica: w.practica || '', especialidad: w.especialidad || '', subEspecialidad: w.subEspecialidad || '',
  };
  VACANTES.push(nueva);
  state.va.wizardOpen = false; state.wizard = null;
  showToast(aprobar ? `"${nueva.titulo}" fue aprobada y creada como posición Abierta` : `"${nueva.titulo}" se guardó como borrador (Pending kickoff)`);
  render();
  window.scrollTo(0, 0);
}

  const w = state.wizard;
  if (!w) return '';
  // El link para abandonar el wizard entero (antes era el boton "x" del
  // drawer, disponible desde cualquier paso) vive una sola vez acá afuera;
  // cada paso de renderWizardStep sigue teniendo su propio "Elegir otro

/* =========================================================================
   VISTA: TALENT DATABASE
   ========================================================================= */
function datosCandidatos() {
  return CANDIDATOS.map(c => {
    const p = POSTULACIONES.find(x => x.candidatoId === c.id);
    return Object.assign({}, c, { postulacion: p, estado: p ? deriveEstado(p.etapa) : 'Disponible' });
  });
}
function candidatosAgrupados() {
  const data = datosCandidatos();
  const q = state.td.query.trim().toLowerCase();
  const filtered = data.filter(c => {
    if (state.td.estado && c.estado !== state.td.estado) return false;
    if (state.td.origen && c.origen !== state.td.origen) return false;
    if (state.td.seniority && c.seniority !== state.td.seniority) return false;
    if (state.td.practicas.length && !state.td.practicas.includes(c.practica)) return false;
    if (state.td.especialidades.length && !state.td.especialidades.includes(c.especialidad)) return false;
    if (state.td.roles.length && !state.td.roles.includes(c.rol)) return false;
    if (state.td.skills.length && !state.td.skills.some(s => c.skills.includes(s))) return false;
    if (!q) return true;
    const haystack = `${c.nombre} ${c.rol} ${c.skills.join(' ')} ${c.ubicacion} ${c.industria}`.toLowerCase();
    return q.split(' ').every(term => haystack.includes(term));
  });
  const grouped = {};
  filtered.forEach(c => {
    const key = state.td.vista === 'estado' ? c.estado
      : state.td.vista === 'cliente' ? (c.postulacion ? c.postulacion.cliente : 'Sin cliente')
      : state.td.vista === 'practica' ? c.practica
      : (c.postulacion ? (recruiterDePostulacion(c.postulacion) || 'Sin recruiter') : 'Sin recruiter');
    (grouped[key] = grouped[key] || []).push(c);
  });
  /* Ordenamiento por columna: cada header de la tabla es clicable (toggleSortTd)
     y alterna asc/desc sobre el mismo getter, columna por columna. Pero
     primero siempre va lo accionable: los candidatos en un estado final
     (Colocado / No interesado) se hunden al final del grupo, sea cual sea
     el criterio de columna elegido. */
  const getter = TD_SORT_GETTERS[state.td.sortCol];
  const dir = state.td.sortDir === 'desc' ? -1 : 1;
  Object.values(grouped).forEach(arr => arr.sort((a, b) => {
    const ta = esCandidatoTerminal(a.estado) ? 1 : 0, tb = esCandidatoTerminal(b.estado) ? 1 : 0;
    if (ta !== tb) return ta - tb;
    if (!getter) return 0;
    const va = getter(a), vb = getter(b);
    if (va < vb) return -1 * dir;
    if (va > vb) return 1 * dir;
    return 0;
  }));
  let groupNames = Object.keys(grouped);
  if (state.td.vista === 'estado') {
    groupNames = groupNames.sort((a, b) => ORDEN_ESTADO_CANDIDATO.indexOf(a) - ORDEN_ESTADO_CANDIDATO.indexOf(b));
  }
  return { filtered, grouped, groupNames };
}
const TD_SORT_GETTERS = {
  nombre: c => c.nombre.toLowerCase(),
  ubicacion: c => c.ubicacion.toLowerCase(),
  disponibilidad: c => diasDisponibilidad(c.disponibilidad),
  expectativa: c => c.expectativa,
  skills: c => c.skills.length,
  score: c => c.score,
};
const TD_SORT_DEFAULT_DIR = { nombre: 'asc', ubicacion: 'asc', disponibilidad: 'asc', expectativa: 'asc', skills: 'desc', score: 'desc' };
function toggleSortTd(col) {
  if (state.td.sortCol === col) { state.td.sortDir = state.td.sortDir === 'asc' ? 'desc' : 'asc'; }
  else { state.td.sortCol = col; state.td.sortDir = TD_SORT_DEFAULT_DIR[col] || 'asc'; }
  render();
}
function tdSortHeader(col, label) {
  const active = state.td.sortCol === col;
  const arrow = active ? (state.td.sortDir === 'asc' ? '▲' : '▼') : '';
  return `<div class="rb-td-th-sort${active ? ' active' : ''}" onclick="toggleSortTd('${col}')" title="Ordenar por ${esc(label)}">${esc(label)}${arrow ? `<span class="rb-sort-arrow">${arrow}</span>` : ''}</div>`;
}
function collapseAllCandidatos(value) {
  const { groupNames } = candidatosAgrupados();
  groupNames.forEach(g => { state.td.collapsed[g] = value; });
  render();
}
function selectCandidato(id) { state.td.selectedId = id; render(); window.scrollTo(0, 0); }
/* Filtro del panel lateral: selección múltiple, cada valor entra/sale del
   array independientemente -- match "OR" dentro de la misma categoría. */
function toggleTdMultiFiltro(campo, valor) {
  const arr = state.td[campo];
  const i = arr.indexOf(valor);
  if (i === -1) arr.push(valor); else arr.splice(i, 1);
  if (campo === 'practicas') {
    /* Si se destilda una práctica, las especialidades ya elegidas que ya
       no pertenecen a ninguna práctica seleccionada quedan huérfanas --
       se limpian para que el panel no muestre un check "invisible". */
    const especialidadesValidas = state.td.practicas.length ? new Set(state.td.practicas.flatMap(especialidadesDe)) : null;
    if (especialidadesValidas) state.td.especialidades = state.td.especialidades.filter(e => especialidadesValidas.has(e));
  }
  render();
}
function tdFiltrosActivosCount() {
  const t = state.td;
  return (t.estado ? 1 : 0) + (t.origen ? 1 : 0) + (t.seniority ? 1 : 0) + t.practicas.length + t.especialidades.length + t.roles.length + t.skills.length;
}
function limpiarFiltrosTd() {
  Object.assign(state.td, { estado: '', origen: '', seniority: '', practicas: [], especialidades: [], roles: [], skills: [] });
  render();
}

function renderTalentDatabaseList() {
  const data = datosCandidatos();
  const roles = [...new Set(data.map(c => c.rol))].sort();
  const allSkills = [...new Set(data.flatMap(c => c.skills))].sort();
  const practicas = PRACTICAS_TAXONOMIA.map(p => p.practica);
  const especialidadesPanel = state.td.practicas.length
    ? [...new Set(state.td.practicas.flatMap(especialidadesDe))].sort()
    : [...new Set(data.map(c => c.especialidad))].sort();
  const { filtered, grouped, groupNames } = candidatosAgrupados();
  const filtrosActivos = tdFiltrosActivosCount();

  /* ---- Quick filters: dropdown nativo para estado/origen/seniority --
     reemplaza los chips por un combo corto de opciones. Viven dentro del
     panel de filtros (sidebarHtml), no en una fila propia separada. */
  const quickFiltro = (id, label, campo, opciones) => renderSelect(
    id, [{ value: '', label: 'Todos' }, ...opciones.map(o => ({ value: o, label: o }))],
    state.td[campo], 'Todos', `state.td['${campo}']=value; render();`, null, label
  );

  /* ---- Panel lateral: checklists de selección múltiple. ---- */
  const checklist = (campo, opciones, countFn) => `

  /* Estado/Origen/Seniority vivían en una fila propia (.rb-quick-filters)

     a un solo candidato, y en mobile (donde el panel pasa a ancho
     completo, ver @media) ese bloque adicional era puro espacio perdido.
     Se mueven acá adentro: un solo panel de filtros (toggleable con el
     botón "Filtros"), no dos superficies de filtro distintas compitiendo

  const sidebarHtml = `
    <div class="rb-td-filter-group">${quickFiltro('td-filter-estado', 'Estado', 'estado', TD_ESTADOS_OPCIONES)}</div>

  const groupsHtml = groupNames.map(groupName => {

    /* Los grupos que SON un estado final (cuando se agrupa "Por estado")
       arrancan colapsados -- la info sigue ahi, a un click, pero no compite

    const colapsadoDefault = state.td.vista === 'estado' && esCandidatoTerminal(groupName);
    const colapsado = state.td.collapsed[groupName] !== undefined ? state.td.collapsed[groupName] : colapsadoDefault;
    const rows = items.map(c => `

               se togglé explícito, un grupo terminal en vista "Por estado"
               arranca colapsado. */
            const tdColapsado = g => state.td.collapsed[g] !== undefined ? state.td.collapsed[g] : (state.td.vista === 'estado' && esCandidatoTerminal(g));
            const tdAllCollapsed = groupNames.every(tdColapsado);
            return renderCollapseSwitch('td-collapse', tdAllCollapsed, `collapseAllCandidatos(${!tdAllCollapsed})`);
          })() : ''}
          ${state.td.sortCol ? `<span class="rb-hint" style="margin-left:0">${icon('sparkles',12)} Ordenado por ${esc({nombre:'candidato',ubicacion:'ubicación',disponibilidad:'disponibilidad',expectativa:'expectativa',skills:'skills',score:'score'}[state.td.sortCol])} (${state.td.sortDir === 'asc' ? 'A→Z / menor→mayor' : 'Z→A / mayor→menor'}) · <span class="rb-link sm" style="display:inline" onclick="state.td.sortCol=''; render()">quitar</span></span>` : ''}
        </div>
        ${filtered.length === 0 ? `<div class="rb-empty">${icon('briefcase',28)}<p>No hay candidatos que calcen con esa búsqueda todavía.<br>Prueba ajustando los filtros o el texto de búsqueda.</p></div>` : groupsHtml}
      </div>
    </div>`;
}
