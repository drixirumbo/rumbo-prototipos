}

/* Menús flotantes (asignar recruiter en Pipeline / cambiar estado de
   vacante): mismo "portal" que renderDocModal() de acá abajo -- viven como
   hermanos de .rb-main a nivel raíz, nunca anidados dentro de la card que
   los abre, por la misma razón: .rb-main tiene container-type:inline-size
   (para los @container de .rb-detail-grid), lo que crea un containing
   block nuevo para position:fixed y desalinearía/recortaría un popover
   anidado ahí. Solo puede haber uno de cada tipo abierto a la vez
   (assigneeMenuFor/estadoMenuFor son un solo id, no un set). Un overlay
   invisible detrás cierra el menú al clickear afuera; la posición real
   (top/left) recién se calcula en JS después de insertar el HTML --
   ver positionFloatingMenu(), llamado desde render(). */
/* Detalle de postulación en Pipeline: único caso de la app que usa un
   side drawer en vez de pantalla completa (ver comentario largo arriba de
   .rb-side-drawer). Portal a nivel raíz, igual que renderDocModal()/
   renderFloatingMenus() -- el contenido en sí (header, stepper, gate box,
   Historial del proceso) es exactamente el mismo
   renderPostulacionDrawerBody() que ya existía, sin cambios: solo cambió
   DÓNDE vive en el DOM, no lo que muestra. El link "Volver a Pipeline" que
   ya trae esa función (llama a closeDrawer()) sigue siendo el único
   mecanismo para cerrarlo, más el click en el overlay -- no se agregó un
   botón de cerrar (X) aparte porque el resto de la app tampoco usa ese
   patrón (el modal de documentos cierra con un botón de texto "Cerrar",
   no un ícono). */
/* El drawer se recrea entero (DOM nuevo) en cada render(), así que sin
   esto su animación de entrada (rb-drawer-in / rb-fade-in) se re-dispara
   en CADA render mientras está abierto -- no solo al abrirlo. Eso se ve
   como parpadeo/slide constante al tipear en el textarea de sustento
   (que re-renderiza en cada tecla) o al apretar cualquier botón del gate.
   `drawerAbiertoPara` guarda para qué postulación ya estaba abierto en el
   render anterior (se actualiza al final de render()); si sigue siendo la
   misma, se suprime la animación -- solo se anima la apertura real. */
let drawerAbiertoPara = null;
function renderPostulacionDrawer() {
  if (state.view !== 'pipeline' || state.pl.selectedId === null) return '';
  const yaAbierto = drawerAbiertoPara === state.pl.selectedId;
  return `
    <div class="rb-drawer-overlay${yaAbierto ? ' rb-no-anim' : ''}" style="z-index:60" onclick="closeDrawer()"></div>
    <aside class="rb-side-drawer${yaAbierto ? ' rb-no-anim' : ''}">${renderPostulacionDrawerBody()}</aside>`;
}
function renderFloatingMenus() {
  let html = '';
  if (state.pl.assigneeMenuFor !== null) {
    const p = POSTULACIONES.find(x => x.id === state.pl.assigneeMenuFor);
    if (p) html += `
      <div class="rb-float-overlay" onclick="state.pl.assigneeMenuFor=null; render();"></div>
      <div id="assignee-menu-${p.id}" class="rb-float-menu">${renderAssigneeMenuOptions(p)}</div>`;
  }
  if (state.va.estadoMenuFor !== null) {
    const v = VACANTES.find(x => x.id === state.va.estadoMenuFor);
    if (v) html += `
      <div class="rb-float-overlay" onclick="state.va.estadoMenuFor=null; render();"></div>
      <div id="estado-menu-${v.id}" class="rb-float-menu">${renderEstadoVacanteMenuOptions(v)}</div>`;
  }
  return html;
}
/* Posiciona un menú flotante justo debajo de su trigger (o arriba, si no
   entra por abajo), pegado a su borde izquierdo salvo que se salga de la
   pantalla. Se llama recién después de insertar el HTML en el DOM real --
   getBoundingClientRect() fuerza el reflow necesario para medir, y como
   corre en el mismo tick que el innerHTML nunca llega a pintarse el menú
   en su posición "sin estilo" (evita el parpadeo). */
function positionFloatingMenu(triggerId, menuId) {
  const trigger = document.getElementById(triggerId);
  const menu = document.getElementById(menuId);
  if (!trigger || !menu) return;
  const r = trigger.getBoundingClientRect();
  const mr = menu.getBoundingClientRect();
  const margin = 8;
  let left = Math.min(Math.max(r.left, margin), window.innerWidth - mr.width - margin);
  let top = r.bottom + 6;
  if (top + mr.height > window.innerHeight - margin) top = r.top - mr.height - 6;
  if (top < margin) top = margin;
  menu.style.left = left + 'px';
  menu.style.top = top + 'px';
}

/* El modal de documentos se renderiza como hermano de .rb-main a nivel raiz
   (ver render()), nunca anidado dentro del contenido de la vista -- ese
   anidamiento causaba un bug real de compositing (el modal quedaba mal
   pintado/sin hit-test aunque su geometria calculada era correcta) cuando
   convivia con un ancestro con container-type: inline-size (el detalle de
   postulacion vive ahora en .rb-main, que lo usa para el @container de
   .rb-detail-grid). Sacarlo del arbol de la vista (patron "portal") lo
   resuelve, igual que antes con el drawer. */
/* El Brief es la "hoja de venta" que se genera automáticamente al
   aprobar la Entrevista Técnica (ver handleAdvance) para presentar el
   candidato al cliente -- a diferencia de Reporte/CV (documentos
   internos), este lo lee el cliente, así que necesita más impacto visual
   que el patrón genérico mhead+body de renderDocModal: header propio con
   iniciales+nombre+rol, chips de datos clave, skills, fit y soft skills,
   más un botón de exportar a PDF (simulado, ver exportarBriefPdf). Por
   eso arma su propio modal completo en vez de solo un `body`. */
function renderBriefModal(p, candidato, documentos) {
  const statChip = (ic, texto) => `<span class="rb-brief-stat">${icon(ic, 12)} ${esc(texto)}</span>`;
  const statsHtml = [
    statChip('briefcase', `${candidato.experiencia} de experiencia`),
    statChip('mapPin', `${candidato.ubicacion} · ${candidato.modalidad}`),
    statChip('clock', candidato.disponibilidad),
    statChip('coin', `S/ ${candidato.expectativa.toLocaleString('es-PE')}/mes`),
  ].join('');
  const fitHtml = documentos.brief.dimensiones.map(d => `
    <div class="rb-decision-row"><div><div class="rb-decision-name">${esc(d.nombre)}</div><div class="rb-decision-feedback">${esc(d.comentario)}</div></div>
    <span class="rb-decision-result" style="background:rgba(56,46,220,.15);color:var(--blue-300-text)">${esc(d.resultado)}</span></div>`).join('');
  const softSkillsHtml = Object.keys(SOFT_SKILL_LABELS).map(k => `
    <div class="rb-detail-row"><span>${esc(SOFT_SKILL_LABELS[k])}</span><span class="rb-dots">${[1, 2, 3, 4, 5].map(n => `<span class="rb-dot${n <= candidato.softSkills[k] ? ' filled' : ''}"></span>`).join('')}</span></div>`).join('');
  return `
    <div class="rb-drawer-overlay" style="z-index:65" onclick="state.docAbierto=null; render()"></div>
    <div class="modal-preview rb-brief-modal">
      <div class="rb-brief-header">
        <div class="avatar xl">${esc(initials(candidato.nombre))}</div>
        <div>
          <div class="rb-brief-name">${esc(candidato.nombre)}</div>
          <div class="rb-brief-role">${esc(candidato.rol)} · ${esc(candidato.seniority)}</div>
        </div>
      </div>
      <p class="rb-resumen" style="font-style:italic;margin:var(--sp-4) 0 0">${esc(documentos.brief.resumen)}</p>
      <div class="rb-brief-stats">${statsHtml}</div>
      <h3 class="rb-subsection-label" style="margin-top:var(--sp-2)">Hard skills</h3>
      ${hardSkillsRatingHtml(candidato)}
      <h3 class="rb-subsection-label">Fit con la posición</h3>
      ${fitHtml}
      <h3 class="rb-subsection-label">Soft skills</h3>
      ${softSkillsHtml}
      <div class="mactions">
        <button class="btn secondary sm" onclick="state.docAbierto=null; render()">Cerrar</button>
        <button class="btn sm" onclick="exportarBriefPdf(${p.id})">${icon('fileText', 12)} Exportar a PDF</button>
      </div>
    </div>`;
}
function exportarBriefPdf(id) {
  const p = POSTULACIONES.find(x => x.id === id);
  const c = CANDIDATOS.find(x => x.id === p.candidatoId);
  showToast(`Brief de ${c.nombre} exportado a PDF`);
}

function renderDocModal() {
  if (!state.docAbierto || state.view !== 'pipeline' || state.pl.selectedId === null) return '';
  const p = POSTULACIONES.find(x => x.id === state.pl.selectedId);
  if (!p) return '';
  const candidato = CANDIDATOS.find(c => c.id === p.candidatoId);
  /* El transcript y el reporte técnico existen antes de que exista
     `documentos` (que recién arranca en GO Interno, ver
     resolverDocumentos) -- el primero desde que Screening ya se hizo, el
     segundo desde que se llega a Entrevista Técnica, para sustentar la
     aprobación en vez de aparecer recién después de darla. Por eso ambos
     se resuelven aparte, no como una llave más de ese objeto. */
  if (state.docAbierto === 'transcript') {
    const transcript = resolverTranscriptScreening(p, candidato);
    if (!transcript) return '';
    const body = `<p class="rb-resumen">${esc(transcript.resumen)}</p>`
      + transcript.highlights.map(h => `<p class="rb-resumen" style="margin-top:var(--sp-2)">• ${esc(h)}</p>`).join('');
    return `
      <div class="rb-drawer-overlay" style="z-index:65" onclick="state.docAbierto=null; render()"></div>
      <div class="modal-preview">
        <div class="mhead"><span class="ic">${icon('chat', 18)}</span><div><h5>Transcript de Screening</h5><p>Procesado por IA a partir de la llamada</p></div></div>
        ${body}
        <div class="mactions"><button class="btn secondary sm" onclick="state.docAbierto=null; render()">Cerrar</button></div>
      </div>`;
  }
  if (state.docAbierto === 'reporte') {
    const reporte = resolverReporteTecnico(p, candidato);
    if (!reporte) return '';
    const body = reporte.dimensiones.map(d => `
      <div class="rb-decision-row"><div><div class="rb-decision-name">${esc(d.nombre)} · peso ${esc(d.peso)}</div><div class="rb-decision-feedback">${esc(d.comentario)}</div></div>
      <span class="rb-decision-result" style="background:rgba(71,235,235,.15);color:var(--cyan-text)">${d.score.toFixed(1)}</span></div>`).join('')
      + `<p class="rb-resumen" style="margin-top:var(--sp-4)"><strong>Recomendación final:</strong> ${esc(reporte.recomendacion)}</p>`;
    return `
      <div class="rb-drawer-overlay" style="z-index:65" onclick="state.docAbierto=null; render()"></div>
      <div class="modal-preview">
        <div class="mhead"><span class="ic">${icon('barChart', 18)}</span><div><h5>Reporte técnico</h5><p>Evaluación técnica con el especialista</p></div></div>
        ${body}
        <div class="mactions"><button class="btn secondary sm" onclick="state.docAbierto=null; render()">Cerrar</button></div>
      </div>`;
  }
  const documentos = resolverDocumentos(p, candidato);
  if (!documentos) return '';
  if (state.docAbierto === 'brief') return renderBriefModal(p, candidato, documentos);
  const body = `<p class="rb-resumen">${esc(documentos.cvRumbo.resumen)}</p>`;
  return `
    <div class="rb-drawer-overlay" style="z-index:65" onclick="state.docAbierto=null; render()"></div>
    <div class="modal-preview">
      <div class="mhead">
        <span class="ic">${icon('fileText', 18)}</span>
        <div><h5>CV Rumbo</h5><p>CV adaptado al estándar de Rumbo</p></div>
      </div>
      ${body}
      <div class="mactions"><button class="btn secondary sm" onclick="state.docAbierto=null; render()">Cerrar</button></div>
    </div>`;
}

/* Modal de confirmación para "Aprobar" en un gate -- mismo patrón de

   aprobar no necesita sustento: solo confirmar que se entiende qué pasa
   al hacerlo (ver aprobarModalTexto). En GO Interno, aprobar es
   literalmente enviar el perfil al cliente -- y un mismo cliente puede
   tener más de un Hiring Manager según la vacante (ver
   HIRING_MANAGERS_POR_CLIENTE), así que acá se muestra a quién puntual
   le va a llegar, no solo "al cliente X" en general. */
function renderAprobarModal() {
  if (!state.aprobarAbierto || state.view !== 'pipeline') return '';
  const p = POSTULACIONES.find(x => x.id === state.aprobarAbierto);
  if (!p) return '';
  const c = CANDIDATOS.find(x => x.id === p.candidatoId);
  const vacante = VACANTES.find(v => v.id === p.vacanteId);
  const hm = p.etapa === GATE_GO_INTERNO ? hiringManagerDeVacante(vacante) : null;
  const destinatarioHtml = hm ? `
    <div class="rb-decision-row">
      <div><div class="rb-decision-name">Se enviará a</div><div class="rb-decision-feedback">${esc(hm.nombre)} · ${esc(hm.cargo)} (${esc(p.cliente)})</div></div>
    </div>` : '';
  return `
    <div class="rb-drawer-overlay" style="z-index:65" onclick="cerrarAprobarModal()"></div>
    <div class="modal-preview">
      <div class="mhead">
        <span class="ic">${icon('check', 18)}</span>
        <div><h5>Aprobar a ${esc(c.nombre)}</h5><p>${esc(aprobarModalTexto(p))}</p></div>
      </div>
      ${destinatarioHtml}
      <div class="mactions">
        <button class="btn secondary sm" onclick="cerrarAprobarModal()">Cancelar</button>
        <button class="btn sm" onclick="confirmarAprobar()">${icon('check',12)} Confirmar</button>
      </div>
    </div>`;
}

/* =========================================================================
   NAVEGACION CRUZADA (canonica) — limpia selecciones de todas las vistas
   antes de fijar el destino, para que no queden drawers fantasma abiertos
   al volver a una vista que se dejo con algo seleccionado.
   ========================================================================= */
function clearAllSelections() {
  state.td.selectedId = null;
  state.va.selectedId = null; state.va.editando = false; state.va.wizardOpen = false;
  state.cl.selectedId = null;
  state.pl.selectedId = null; state.pl.highlightId = null;
  state.postVerdictDraft = null; state.postVerdictFb = ''; state.docAbierto = null;
  state.retiroAbierto = null; state.retiroMotivo = null; state.retiroMotivoOtro = '';
  state.aprobarAbierto = null;
  state.culminarAbierto = null; state.culminarMotivo = null; state.culminarMotivoOtro = '';
}
function goToTalentDatabase(candidatoId) { clearAllSelections(); state.view = 'talent-database'; state.td.selectedId = candidatoId; render(); window.scrollTo(0, 0); }
/* Cruce rápido vacante → pool de candidatos de su misma especialidad --
   no es un motor de matching, solo pre-carga los filtros de Talent
   Database para no tener que rearmarlos a mano. */
function goToTalentDatabaseFiltrado(practica, especialidad) {
  clearAllSelections();
  state.view = 'talent-database';
  state.td.practicas = [practica];
  state.td.especialidades = [especialidad];
  state.td.panelOpen = true;
  render();
  window.scrollTo(0, 0);
}
function goToVacante(vacanteId) { clearAllSelections(); state.view = 'vacantes'; state.va.selectedId = vacanteId; render(); window.scrollTo(0, 0); }
function goToClienteNav(clienteId) { clearAllSelections(); state.view = 'clientes'; state.cl.selectedId = clienteId; render(); window.scrollTo(0, 0); }
function goToDetalleProceso(postulacionId) { clearAllSelections(); state.view = 'pipeline'; state.pl.selectedId = postulacionId; render(); window.scrollTo(0, 0); }
function goToPipeline(postulacionId) {
  clearAllSelections();
  state.view = 'pipeline';
  state.pl.highlightId = postulacionId;
  const p = POSTULACIONES.find(x => x.id === postulacionId);
  if (p && SALIDAS.includes(p.etapa)) state.pl.archiveOpen = true;
  if (p) {
    state.pl.lanesCollapsed[p.vacanteId] = false;
    const v = VACANTES.find(x => x.id === p.vacanteId);
    if (v) state.pl.clientesCollapsed[v.clienteId] = false;
  }
  render();
  setTimeout(() => { const el = document.getElementById('post-card-' + postulacionId); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' }); }, 100);
  setTimeout(() => { state.pl.highlightId = null; render(); }, 3000);
}
// goToCliente ya se definio antes para el flujo interno de Clientes; lo
// hacemos apuntar a la version canonica para que tambien limpie otras vistas.
function goToCliente(clienteId) { goToClienteNav(clienteId); }

/* =========================================================================
   SIDEBAR, ROUTER Y RENDER PRINCIPAL
   ========================================================================= */
function setView(v) { clearAllSelections(); state.view = v; state.ui.mobileMenuOpen = false; render(); window.scrollTo(0, 0); }
function toggleSidebarCollapsed() { state.ui.sidebarCollapsed = !state.ui.sidebarCollapsed; render(); }
function toggleMobileMenu() { state.ui.mobileMenuOpen = !state.ui.mobileMenuOpen; render(); }
/* El atributo data-theme vive en <html>, que queda AFUERA de #app -- por
   eso se aplica acá directo sobre document.documentElement en vez de
   depender de render() (que solo reescribe el innerHTML de #app). Se
   llama una vez al cargar (con el valor ya leído de localStorage en
   leerThemeGuardado()) y de nuevo cada vez que se togglea. */
function aplicarTheme() {
  document.documentElement.setAttribute('data-theme', state.ui.theme);
}
function toggleTheme() {
  state.ui.theme = state.ui.theme === 'dark' ? 'light' : 'dark';
  aplicarTheme();
  try { localStorage.setItem('rb-theme', state.ui.theme); } catch (e) {}
  render();
}

function renderSidebar() {
  const items = [
    ['dashboard', 'Dashboard', 'barChart'], ['clientes', 'Clientes', 'building'], ['vacantes', 'Posiciones', 'briefcase'],
    ['pipeline', 'Pipeline', 'columns'], ['talent-database', 'Candidatos', 'users'],
  ];
  const collapsed = state.ui.sidebarCollapsed;
  const mobileOpen = state.ui.mobileMenuOpen;
  const fullLogo = `<svg width="132" height="38" viewBox="0 0 144 42" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M32.634 6.70557C25.47 6.70557 19.026 12.582 18.774 19.7202C17.28 15.0695 12.906 11.6987 7.758 11.6807V34.9159H19.332V28.03L19.386 26.588C19.386 24.7493 20.124 23.109 21.33 21.9013C22.536 20.6936 24.174 19.9545 26.01 19.9545H32.634C39.942 19.9545 45.864 14.024 45.864 6.70557H32.634Z" fill="#382EDC"/>
<path d="M50.148 18.3142C50.724 16.6017 52.47 16.0249 54.432 16.0249H55.926V19.5579H53.64C51.66 19.5579 50.238 20.6215 50.238 22.7846V31.473H46.332V16.079H50.184V18.3142H50.148Z" fill="currentColor"/>
<path d="M69.534 31.4729V28.9853C68.922 30.4093 67.05 31.7252 64.224 31.7252C60.822 31.7252 58.248 29.2737 58.248 25.272V16.0789H62.154V24.8935C62.154 27.0385 63.396 28.3003 65.628 28.3003C68.13 28.3003 69.48 26.7501 69.48 24.0102V16.0789H73.386V31.4729H69.534Z" fill="currentColor"/>
<path d="M80.676 16.079V18.3683C81.324 16.8722 83.034 15.8267 85.158 15.8267C87.138 15.8267 88.596 16.8902 89.244 18.4404H89.208C89.892 17.0164 91.602 15.8267 94.05 15.8267C96.876 15.8267 99.126 17.9717 99.126 21.1623V31.473H95.22V21.4867C95.22 20.0627 94.194 19.2516 92.718 19.2516C91.098 19.2516 89.928 20.1889 89.928 22.0996V31.473H86.04V21.4867C86.04 20.0627 85.014 19.2516 83.538 19.2516C81.918 19.2516 80.748 20.1889 80.748 22.0996V31.473H76.842V16.079H80.676Z" fill="currentColor"/>
<path d="M106.344 9.73389V18.242H106.362C107.172 16.9442 108.9 15.6283 111.618 15.6283C115.47 15.6283 118.692 19.0352 118.692 23.7579C118.692 28.4807 115.47 31.8875 111.618 31.8875C108.882 31.8875 107.1 30.5897 106.29 29.2738V31.4549H102.438V9.73389H106.344ZM106.344 23.7759C106.344 26.6961 108.144 28.4266 110.556 28.4266C112.914 28.4266 114.768 26.7502 114.768 23.7759C114.768 20.8017 112.914 19.1073 110.556 19.1073C108.144 19.1073 106.344 20.8558 106.344 23.7759Z" fill="currentColor"/>
<path d="M128.358 15.6284C132.876 15.6284 136.422 18.9271 136.422 23.758C136.422 28.5889 132.876 31.9057 128.358 31.9057C123.84 31.9057 120.294 28.607 120.294 23.7761C120.294 18.9452 123.822 15.6284 128.358 15.6284ZM128.358 28.4267C128.358 28.4267 132.462 26.1194 132.462 23.3254C132.462 20.5314 130.842 19.1074 128.358 19.1074C125.874 19.1074 124.182 20.5314 124.182 23.3254C124.182 26.1194 128.358 28.4267 128.358 28.4267Z" fill="currentColor"/>
</svg>`;
  /* En modo colapsado (rail de solo íconos, desktop) el logotipo completo
     no cabe -- se reemplaza por la misma insignia circular que ya usa el
     resto de la app para identidad (avatar), en vez de recortar el SVG. */
  const logoMark = `<div class="avatar" style="background:linear-gradient(135deg,var(--rb-blue),var(--rb-purple));margin:0">R</div>`;
  return `
    <aside class="rb-sidebar${collapsed ? ' collapsed' : ''}${mobileOpen ? ' mobile-open' : ''}">
      <div class="rb-logo-row">
        <button class="rb-mobile-menu-btn" onclick="toggleMobileMenu()" aria-label="${mobileOpen ? 'Cerrar' : 'Abrir'} menú">${icon(mobileOpen ? 'x' : 'menu', 20)}</button>
        <div class="rb-logo">${collapsed ? logoMark : fullLogo}</div>
        <button class="rb-sidebar-toggle rb-theme-toggle" onclick="toggleTheme()" title="${state.ui.theme === 'dark' ? 'Modo claro' : 'Modo oscuro'}">${icon(state.ui.theme === 'dark' ? 'sun' : 'moon', 14)}</button>
        <button class="rb-sidebar-toggle" onclick="toggleSidebarCollapsed()" title="${collapsed ? 'Expandir' : 'Colapsar'} menú">${icon(collapsed ? 'chevronRight' : 'chevronLeft', 14)}</button>
      </div>
      <div class="rb-nav-dropdown">
        <div class="rb-sidebar-group">Espacio de trabajo</div>
        <div class="rb-nav-list">
          ${items.map(([id, label, ic]) => `<div class="rb-nav-item ${state.view === id ? 'active' : ''}" title="${esc(label)}" onclick="setView('${id}')">${icon(ic, 16)}<span>${label}</span></div>`).join('')}
        </div>
        <div class="rb-sidebar-foot">
          <span>v1.0 · 2026</span>
          <span>rumbo.la</span>
        </div>
      </div>
    </aside>`;
}

/* Cada vista tiene una lista y un detalle a pantalla completa; el detalle
   reemplaza a la lista dentro de .rb-main en vez de flotar encima en un
   drawer -- esto es lo unico que decide cual de los dos se muestra. La
   funcion de detalle de cada vista (renderClienteDetail, etc.) agrega su
   propio link "Volver" (closeDrawer) arriba del todo. */
function renderMainContent() {
  if (state.view === 'dashboard') return renderDashboard();
  if (state.view === 'clientes') return state.cl.selectedId !== null ? renderClienteDetail() : renderClientesList();
  if (state.view === 'vacantes') return (state.va.selectedId !== null || state.va.wizardOpen) ? renderVacanteDrawerBody() : renderVacantesList();
  if (state.view === 'talent-database') return state.td.selectedId !== null ? renderCandidatoDetail() : renderTalentDatabaseList();
  /* Pipeline SIEMPRE muestra el tablero acá -- el detalle de postulación
     ya no reemplaza este contenido, se renderiza aparte como side drawer
     (ver renderPostulacionDrawer(), llamado desde render()). */
  if (state.view === 'pipeline') return renderPipelineBoard();
  return '';
}

const VIEW_LABELS = { 'dashboard': 'Dashboard', 'clientes': 'Clientes', 'vacantes': 'Posiciones', 'pipeline': 'Pipeline', 'talent-database': 'Candidatos' };
function renderTopbar() {
  return `<div class="topbar"><div class="crumbs">RUMBO / <b>${VIEW_LABELS[state.view] || ''}</b></div><div class="status"><span class="dot"></span><span>Sincronizado</span></div></div>`;
}

function render() {
  const active = document.activeElement;
  const activeId = active && active.id ? active.id : null;
  const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;

  const boardEl = document.querySelector('.rb-board');
  const boardScroll = boardEl ? boardEl.scrollLeft : null;
  const pageScroll = window.scrollY;
  /* Congela el scroll de la página de fondo mientras hay un overlay fijo
     abierto (drawer de postulación o cualquiera de los modales chicos) --
     sin esto, el body sigue siendo scrolleable detrás del overlay, y en
     mobile el gesto de scroll "se filtra" (scroll chaining) apenas el
     scroll interno del overlay llega a su tope/fondo, dando el efecto de
     que la página salta o se ve mal (se suma a overscroll-behavior:contain
     en .rb-side-drawer/.modal-preview, que ataca lo mismo desde el CSS). */
  const hayOverlayFijo = (state.view === 'pipeline' && state.pl.selectedId !== null) || !!state.docAbierto || !!state.retiroAbierto || !!state.aprobarAbierto || !!state.culminarAbierto || !!state.blacklistAbierto;
  document.body.style.overflow = hayOverlayFijo ? 'hidden' : '';
  /* El side drawer tiene su propio scroll interno (overflow-y: auto) --
     sin esto, cualquier render() disparado mientras el drawer está
     scrolleado (ej. tipear en el textarea de sustento de Identificado,
     que re-renderiza en cada tecla para habilitar/deshabilitar Confirmar)
     lo resetea a scrollTop 0 en cada letra, dando la sensación de que el
     campo "falla" al escribir. */
  const drawerEl = document.querySelector('.rb-side-drawer');
  const drawerScroll = drawerEl ? drawerEl.scrollTop : null;

  document.getElementById('app').innerHTML = `
    ${renderSidebar()}
    <div class="rb-main-col">
      ${renderTopbar()}
      <main class="rb-main">${renderMainContent()}</main>
    </div>
    ${renderPostulacionDrawer()}
    ${renderDocModal()}
    ${renderRetiroModal()}
    ${renderAprobarModal()}
    ${renderCulminarModal()}
    ${renderBlacklistModal()}
    ${renderFloatingMenus()}
    ${toastHtml()}
  `;

  if (activeId) {
    const el = document.getElementById(activeId);
    /* Nunca re-enfocar un <select> -- a diferencia de un input/textarea (que
       sí necesitan recuperar el foco+cursor tras el re-render para poder
       seguir tipeando), en mobile hacer .focus() sobre un <select> reabre
       el picker nativo del sistema operativo. Como el onchange que eligió
       la opción ya disparó el render() que lo reemplaza, el resultado era
       que el dropdown se volvía a abrir solo apenas elegías algo. */
    if (el && typeof el.focus === 'function' && el.tagName !== 'SELECT') {
      el.focus({ preventScroll: true });
      if (selStart !== null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selEnd); } catch (e) {} }
    }
  }
  if (boardScroll !== null) {
    const newBoard = document.querySelector('.rb-board');
    if (newBoard) newBoard.scrollLeft = boardScroll;
  }
  if (drawerScroll !== null) {
    const newDrawer = document.querySelector('.rb-side-drawer');
    if (newDrawer) newDrawer.scrollTop = drawerScroll;
  }
  if (state.pl.assigneeMenuFor !== null) positionFloatingMenu(`assignee-trigger-${state.pl.assigneeMenuFor}`, `assignee-menu-${state.pl.assigneeMenuFor}`);
  if (state.va.estadoMenuFor !== null) positionFloatingMenu(`estado-trigger-${state.va.estadoMenuFor}`, `estado-menu-${state.va.estadoMenuFor}`);
  window.scrollTo(0, pageScroll);
  drawerAbiertoPara = state.view === 'pipeline' ? state.pl.selectedId : null;
}

aplicarTheme();
render();
</script>
</body>
</html>
