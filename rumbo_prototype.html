/* =========================================================================
   VISTA: PIPELINE (tablero, gates, popover de veredicto, archivo)
   ========================================================================= */
/* Recruiter: vive a nivel de Vacante, nunca a nivel de Cliente ni de
   Postulación -- una posición tiene un solo recruiter dueño, y todas sus
   postulaciones (todos los candidatos de esa vacante) comparten ese mismo
   recruiter. Por eso se resuelve siempre desde acá, nunca desde un campo
   propio de la postulación. */
function recruiterDeVacante(vacanteId) {
  const v = VACANTES.find(x => x.id === vacanteId);
  return (v && v.recruiter) || '';
}
function recruiterDePostulacion(p) { return recruiterDeVacante(p.vacanteId); }
/* Prioridad: también vive a nivel de Vacante, nunca de Postulación --
   mismo criterio que recruiterDeVacante/recruiterDePostulacion, para
   poder filtrar el tablero por prioridad de la posición. */
function prioridadDeVacante(vacanteId) {
  const v = VACANTES.find(x => x.id === vacanteId);
  return v ? v.priority : null;
}
function prioridadDePostulacion(p) { return prioridadDeVacante(p.vacanteId); }
/* SLA/vencimiento: exactamente el mismo criterio -- vive en el
   clientDeadline de la Vacante, nunca en un campo propio de la
   Postulación (antes existía p.sla en los mocks, con valores que podían
   quedar inconsistentes entre 2 candidatos de la MISMA vacante, ver
   commit que lo retiró). Se muestra una sola vez, en el header de la
   lane (a nivel de posición) -- ya no se repite en cada card individual
   del kanban, que es candidato, no posición. */
function slaDeVacante(vacanteId) {
  const v = VACANTES.find(x => x.id === vacanteId);
  return deadlineInfo(v ? v.clientDeadline : null).slaStatus;
}

/* Filtro rápido por recruiter, estilo Jira: fila de avatares (mismo
   componente visual que el avatar de asignación, .rb-assignee-avatar) que
   filtra el tablero a un solo click -- clickear un avatar ya seleccionado
   lo vuelve a des-seleccionar (toggle), en vez de necesitar un dropdown
   aparte. Compone con "Mis postulaciones" y "Cliente" (son AND entre sí),
   igual que en Jira conviven el toggle "solo mis issues" con el filtro de
   assignee. */
function toggleRecruiterFilter(recruiter) {
  state.pl.recruiterFilter = state.pl.recruiterFilter === recruiter ? '' : recruiter;
  render();
}
function renderRecruiterFilterFacepile() {
  const activo = state.pl.recruiterFilter;
  return `
    <div class="rb-recruiter-filter" role="group" aria-label="Filtrar por recruiter">
      ${RECRUITERS_DISPONIBLES.map(r => {
        const c = tagColor(r);
        const sel = activo === r;
        return `<button class="rb-recruiter-filter-avatar ${sel ? 'selected' : ''}" title="${sel ? 'Quitar filtro' : 'Filtrar por'} ${esc(r)}" aria-pressed="${sel}" onclick="toggleRecruiterFilter(${esc(JSON.stringify(r))})">
          <div class="rb-assignee-avatar" style="background:${c}22;color:${c};box-shadow:inset 0 0 0 1px ${c}55">${esc(initials(r))}</div>
        </button>`;
      }).join('')}
    </div>`;
}

/* Asignación estilo Jira: un avatar clickeable por tarjeta que abre una
   lista corta de recruiters para asignar/reasignar. Reasignar reescribe el
   recruiter de la VACANTE (no de la tarjeta puntual) -- así todas las
   demás tarjetas de esa misma vacante en el tablero reflejan el cambio de
   inmediato, consistente con que el recruiter es una propiedad de la
   posición. El estado de qué menú está abierto sí es por tarjeta
   (state.pl.assigneeMenuFor guarda el id de la POSTULACIÓN, no de la
   vacante), simplemente para que abrir el picker de una tarjeta no abra
   también el de otra tarjeta de la misma vacante. */
function toggleAssigneeMenu(postulacionId) {
  state.pl.assigneeMenuFor = state.pl.assigneeMenuFor === postulacionId ? null : postulacionId;
  render();
}
function asignarRecruiter(vacanteId, recruiter) {
  const v = VACANTES.find(x => x.id === vacanteId);
  if (!v) return;
  v.recruiter = recruiter || '';
  state.pl.assigneeMenuFor = null;
  showToast(recruiter ? `Recruiter de "${v.titulo}" asignado a ${recruiter}` : `Se quitó el recruiter de "${v.titulo}"`);
  render();
}
/* El picker es un menú FLOTANTE (position:fixed, portal a nivel raíz --
   ver renderFloatingMenus/positionFloatingMenu, junto a render()). El
   tablero scrollea tanto en X (rb-board) como en Y (rb-phase-cards); un
   popover anidado ahí (con position:absolute, o incluso :fixed sin sacarlo
   del árbol de la vista) quedaría recortado por ese overflow o mal
   posicionado por el container-type:inline-size de .rb-main -- por eso
   vive afuera, igual que ya resuelve renderDocModal() para el modal de
   documentos. */
function renderAssigneeTrigger(p) {
  const recruiter = recruiterDePostulacion(p);
  const c = recruiter ? tagColor(recruiter) : null;
  return `
    <button id="assignee-trigger-${p.id}" class="rb-assignee-trigger" title="${recruiter ? 'Recruiter: ' + esc(recruiter) : 'Sin recruiter asignado'}" onclick="event.stopPropagation(); toggleAssigneeMenu(${p.id})">
      ${recruiter
        ? `<div class="rb-assignee-avatar" style="background:${c}22;color:${c};box-shadow:inset 0 0 0 1px ${c}55">${esc(initials(recruiter))}</div>`
        : `<div class="rb-assignee-avatar rb-assignee-unassigned">${icon('user', 12)}</div>`}
    </button>`;
}
/* Solo las filas de opciones -- el contenedor flotante en sí lo arma
   renderFloatingMenus(). */
function renderAssigneeMenuOptions(p) {
  const recruiter = recruiterDePostulacion(p);
  const opciones = [{ nombre: '', label: 'Sin asignar' }, ...RECRUITERS_DISPONIBLES.map(r => ({ nombre: r, label: r === 'Ana Ruiz' ? r + ' (asignarme)' : r }))];
  return opciones.map(o => {
    const oc = o.nombre ? tagColor(o.nombre) : null;
    return `
    <div class="rb-assignee-option ${recruiter === o.nombre ? 'selected' : ''}" onclick="asignarRecruiter(${p.vacanteId}, ${esc(JSON.stringify(o.nombre))})">
      ${o.nombre
        ? `<div class="rb-assignee-avatar sm" style="background:${oc}22;color:${oc}">${esc(initials(o.nombre))}</div>`
        : `<div class="rb-assignee-avatar sm rb-assignee-unassigned">${icon('user', 10)}</div>`}
      <span>${esc(o.label)}</span>
      ${recruiter === o.nombre ? icon('check', 12) : ''}
    </div>`;
  }).join('');
}
/* Al entrar a una etapa de salida (SALIDAS) se recuerda en qué etapa
   estaba justo antes -- es lo que ya usan etapaEfectiva/idxEnOrden para
   saber, por ejemplo, si un "rechazado_rumbo" pasó en Identificado o en
   GO Interno (ambos caen en la misma etapa terminal). Antes esto solo
   quedaba bien en los mocks pre-cargados (etapaMaxima escrito a mano);
   sin este registro, un rechazo hecho en vivo durante la sesión perdía
   ese dato y el Historial del proceso lo mostraba como si hubiera
   pasado en Identificado. */
function moveTo(id, nuevaEtapa) {
  const p = POSTULACIONES.find(x => x.id === id);
  if (SALIDAS.includes(nuevaEtapa) && !SALIDAS.includes(p.etapa)) p.etapaMaxima = p.etapa;
  p.etapa = nuevaEtapa;
  p.dias = 0;
}

function handleAdvance(id) {
  const p = POSTULACIONES.find(x => x.id === id);
  const c = CANDIDATOS.find(x => x.id === p.candidatoId);
  const etapaOrigen = p.etapa;
  const siguiente = SIGUIENTE[p.etapa];
  moveTo(id, siguiente);
  if (etapaOrigen === 'agenda_enviada') showToast(`${c.nombre} agendó su horario de screening — pasa a Screening`);
  else if (etapaOrigen === 'agenda_tecnica_enviada') showToast(`${c.nombre} agendó su horario de entrevista técnica — pasa a Entrevista Técnica`);
  else if (siguiente === 'agenda_tecnica_enviada') {
    const entrevistador = delPool(POOL_ENTREVISTA_TECNICA, p.candidatoId);
    showToast(`${c.nombre} avanzó a la entrevista técnica — se enviaría un link con la disponibilidad de ${entrevistador ? entrevistador.nombre : 'el entrevistador asignado'} para agendar la entrevista técnica`);
  }
  else if (siguiente === GATE_GO_INTERNO) showToast(`${c.nombre} pasó a revisión interna — se generó el Brief para el cliente y se envió la solicitud de actualización de CV al candidato`);
  else if (siguiente === GATE_CLIENTE) showToast(`${c.nombre} entró a Decisión Cliente — esperando veredicto`);
  else showToast(`${c.nombre} avanzó a ${ETAPA_LABELS[siguiente]}`);
  render();
}
/* ---- Drag & drop del kanban: arrastrar una tarjeta a otra columna hace
   EXACTAMENTE lo mismo que su botón "Avanzar" (llama a handleAdvance), nunca
   salta etapas ni evita un gate. Por eso solo la columna que coincide con
   SIGUIENTE[etapaActual] queda habilitada como destino -- el resto del
   tablero simplemente no reacciona al soltar ahí. Las tarjetas de gate no
   son arrastrables: esa decisión siempre pasa por el veredicto explícito. */
let dragCtx = null;
function onCardDragStart(ev, postId) {
  const p = POSTULACIONES.find(x => x.id === postId);
  const siguiente = SIGUIENTE[p.etapa];
  if (!siguiente) { ev.preventDefault(); return; }
  dragCtx = { id: postId, siguiente, vacanteId: p.vacanteId };
  ev.dataTransfer.effectAllowed = 'move';
  ev.dataTransfer.setData('text/plain', String(postId));
  ev.currentTarget.classList.add('rb-dragging');
  document.querySelectorAll('[data-etapas]').forEach(col => {
    const etapas = col.dataset.etapas.split(',');
    const lane = col.closest('.rb-lane');
    const laneOk = !lane || Number(lane.dataset.vacanteId) === dragCtx.vacanteId;
    if (laneOk && etapas.includes(siguiente)) col.classList.add('rb-drop-valid');
  });
}
function onCardDragEnd() {
  document.querySelectorAll('.rb-dragging').forEach(el => el.classList.remove('rb-dragging'));
  document.querySelectorAll('.rb-drop-valid, .rb-drop-over').forEach(el => el.classList.remove('rb-drop-valid', 'rb-drop-over'));
  dragCtx = null;
}
function columnAceptaDrag(col) {
  if (!dragCtx) return false;
  const etapas = col.dataset.etapas.split(',');
  const lane = col.closest('.rb-lane');
  const laneOk = !lane || Number(lane.dataset.vacanteId) === dragCtx.vacanteId;
  return laneOk && etapas.includes(dragCtx.siguiente);
}
function onColumnDragOver(ev) {
  if (!columnAceptaDrag(ev.currentTarget)) return;
  ev.preventDefault();
  ev.dataTransfer.dropEffect = 'move';
  ev.currentTarget.classList.add('rb-drop-over');
}
function onColumnDragLeave(ev) { ev.currentTarget.classList.remove('rb-drop-over'); }
function onColumnDrop(ev) {
  ev.preventDefault();
  ev.currentTarget.classList.remove('rb-drop-over');
  if (!columnAceptaDrag(ev.currentTarget)) return;
  const id = dragCtx.id;
  dragCtx = null;
  handleAdvance(id);
}

function handleWithdraw(id, motivo) {
  const p = POSTULACIONES.find(x => x.id === id);
  const c = CANDIDATOS.find(x => x.id === p.candidatoId);
  moveTo(id, 'no_interesado');
  if (motivo) p.extraNotes = motivo;
  showToast(`${c.nombre} se retiró del proceso`);
  render();
}

/* Motivos sugeridos para "Se retira" -- cubren los casos reales que ya
   aparecen en los mocks (aceptó otra oferta, contraoferta, dejó de
   responder) más un motivo salarial y un "Otro" con texto libre para lo
   que no encaje. Se guardan en p.extraNotes, el mismo campo que ya se
   muestra como "Notas adicionales" en el detalle. */
const MOTIVO_RETIRO_OTRO = 'otro';
const MOTIVOS_RETIRO = [
  { id: 'acepto_otra_oferta', label: 'Aceptó otra oferta' },
  { id: 'contraoferta', label: 'Recibió contraoferta de su empleador actual' },
  { id: 'dejo_responder', label: 'Dejó de responder / perdió el interés' },
  { id: 'expectativa_no_compatible', label: 'Expectativa salarial o de condiciones no compatible' },
  { id: MOTIVO_RETIRO_OTRO, label: 'Otro motivo' },
];
function abrirRetiroModal(id) {
  state.retiroAbierto = id; state.retiroMotivo = null; state.retiroMotivoOtro = '';
  render();
}
function cerrarRetiroModal() {

/* Aprobar un gate ya no pide sustento escrito -- a diferencia de
   descartar/rechazar (que sí necesitan una razón registrada), aprobar es
   una decisión que solo necesita confirmarse: se reemplaza el textarea
   por un modal de confirmación simple, con el mismo texto que ya usaba el
   toast de handleVerdict para explicar qué va a pasar. */
function abrirAprobarModal(id) {
  state.aprobarAbierto = id;
  render();
}

  state.aprobarAbierto = null;
  render();

  const id = state.aprobarAbierto;
  const p = POSTULACIONES.find(x => x.id === id);
  state.aprobarAbierto = null;
  handleVerdict(id, p.etapa, 'aprobar', '');
}
function aprobarModalTexto(p) {
  if (p.etapa === GATE_INTAKE) {
    const recruiter = recruiterDePostulacion(p);
    return `Se enviará un link con la disponibilidad de ${recruiter || 'el recruiter asignado'} para agendar el screening.`;
  }
  if (p.etapa === GATE_GO_INTERNO) return `El candidato se enviará directo a ${p.cliente} para su revisión.`;
  if (p.etapa === GATE_CLIENTE) return `Esto marca la oferta como enviada.`;
  return '¿Confirmas esta acción?';
}
function handleVerdict(postulacionId, gateId, tipo, sustento) {
  const p = POSTULACIONES.find(x => x.id === postulacionId);
  const c = CANDIDATOS.find(x => x.id === p.candidatoId);
  if (gateId === GATE_GO_INTERNO && tipo === 'aprobar') {
    const checklist = resolverChecklist(p);
    if (!Object.values(checklist).every(Boolean)) return;
  }
  /* En el gate de Identificado el sustento es obligatorio para
     descartar/blacklist (ver verdictFormHtml, que deshabilita Confirmar
     hasta que haya texto) -- es la justificación de una decisión
     negativa. Aprobar ya no pasa por acá con sustento: se confirma desde
     el modal de aprobación (ver renderAprobarModal/confirmarAprobar), sin
     texto, por eso sustento llega vacío para ese caso. */
  if (gateId === GATE_INTAKE) {
    if (tipo !== 'aprobar' && (!sustento || !sustento.trim())) return;
    if (sustento && sustento.trim()) p.sustentoIdentificado = sustento.trim();
    p.veredictoIdentificado = tipo;
  }
  /* En Decisión Cliente el feedback sigue siendo opcional (no bloquea
     Confirmar como en Identificado), pero ahora sí se persiste -- antes
     se descartaba y ese gate quedaba sin ningún registro en el Historial
     del proceso, a diferencia de Identificado. */
  if (gateId === GATE_CLIENTE) {
    p.sustentoCliente = sustento ? sustento.trim() : '';
    p.veredictoCliente = tipo;
  }
  const destino = VEREDICTO[gateId][tipo];
  moveTo(postulacionId, destino);
  if (gateId === GATE_INTAKE && tipo === 'aprobar') {
    const recruiter = recruiterDePostulacion(p);
    showToast(`${c.nombre} fue aprobado en Identificado — se enviaría un link con la disponibilidad de ${recruiter || 'el recruiter asignado'} para agendar el screening`);
  } else if (gateId === GATE_INTAKE && tipo === 'descartar') {
    showToast(`${c.nombre} fue descartado en Identificado`);
  } else if (gateId === GATE_INTAKE && tipo === 'blacklist') {
    showToast(`${c.nombre} fue puesto en blacklist`);
  } else if (gateId === GATE_GO_INTERNO && tipo === 'aprobar') {
    const vacante = VACANTES.find(v => v.id === p.vacanteId);
    const hm = hiringManagerDeVacante(vacante);
    showToast(`${c.nombre} fue aprobado y enviado a ${hm ? `${hm.nombre} (${hm.cargo})` : p.cliente} — se notificaría por email`);
  } else {
    showToast(tipo === 'aprobar' ? `${c.nombre} fue aprobado → ${ETAPA_LABELS[destino]}` : `${c.nombre} fue rechazado (${ETAPA_LABELS[destino]})`);
  }
}
/* Sin scrollTo(0,0): siempre se llama desde una card ya visible en el
   tablero (ver dónde se usa) -- el drawer se abre encima sin mover el
   tablero de fondo, que es justo el punto de que sea un drawer y no
   pantalla completa. */
function openPostulacionDetail(id) { state.pl.selectedId = id; render(); }

/* Normaliza para comparar sin importar mayúsculas ni tildes -- "salcedo"
   debe encontrar a "Salcedo" y "gomez" debe encontrar a "Gómez". */
function normalizarBusqueda(s) {
  return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
}
function postulacionesFiltradas() {
  const q = normalizarBusqueda(state.pl.query);
  return POSTULACIONES.filter(p => {
    if (state.pl.scope === 'mias' && recruiterDePostulacion(p) !== 'Ana Ruiz') return false;
    if (state.pl.cliente && p.cliente !== state.pl.cliente) return false;
    if (state.pl.recruiterFilter && recruiterDePostulacion(p) !== state.pl.recruiterFilter) return false;
    if (state.pl.prioridadFiltro && prioridadDePostulacion(p) !== state.pl.prioridadFiltro) return false;
    /* El buscador matchea por candidato O por posición/cliente -- así
       buscar "Site Reliability" trae a todos los candidatos de esa
       vacante, no solo a quien se llame así. */
    if (q) {
      const c = CANDIDATOS.find(x => x.id === p.candidatoId);
      const haystack = normalizarBusqueda(`${c ? c.nombre : ''} ${p.vacante} ${p.cliente}`);
      if (!haystack.includes(q)) return false;
    }
    return true;
  });
}

  const dragAttrs = esTerminal ? '' : `draggable="true" ondragstart="onCardDragStart(event, ${p.id})" ondragend="onCardDragEnd(event)"`;

function renderGateColumn(gateId, label, items) {

    </div>`;
}

/* Arma las columnas (fases + gates) del tablero para un subconjunto de
   postulaciones ya activas. Se reutiliza tanto para el tablero global como
   para cada lane de vacante. Cada columna acepta drag&drop de una tarjeta
   solo si esa columna es literalmente "la siguiente etapa" de esa tarjeta
   (ver onColumnDragOver/onColumnDrop) -- el drop hace exactamente lo mismo
   que el botón "Avanzar", nunca salta etapas ni bypassea un gate.  */
const porTopTalentPrimero = (a, b) => (esTopTalent(b) ? 1 : 0) - (esTopTalent(a) ? 1 : 0);
function renderBoardColumns(activas) {
  const gateIntake = activas.filter(p => p.etapa === GATE_INTAKE).sort(porTopTalentPrimero);
  const goInterno = activas.filter(p => p.etapa === GATE_GO_INTERNO).sort(porTopTalentPrimero);
  const gateCliente = activas.filter(p => p.etapa === GATE_CLIENTE).sort(porTopTalentPrimero);
  let boardHtml = '';
  /* El gate de Identificado ya no tiene columna propia -- se unifica con
     "Sourcing" (ver PHASES), la fase a la que ya pertenece conceptualmente
     (mismo criterio que ya usa el Historial del drawer, ver
     tipoSourcing/sourcingActual). Sus cards (renderGateCard, esperando
     veredicto) se anteponen a las de Agendamiento dentro de la MISMA
     columna "Sourcing" en vez de vivir en una columna "Gate: Identificado"
     aparte. No hace falta separador visual: renderGateCard ya trae su
     propio tinte (.rb-gate-card) y no tiene botón de avanzar, así que se
     distingue solo con verla. */
  PHASES.forEach((phase, i) => {
    const esSourcing = phase.id === 'sourcing';
    const cardsInPhase = activas.filter(p => phase.sub.includes(p.etapa)).sort(porTopTalentPrimero);
    const totalCount = cardsInPhase.length + (esSourcing ? gateIntake.length : 0);
    const dropAttrs = `data-etapas="${phase.sub.join(',')}" ondragover="onColumnDragOver(event)" ondragleave="onColumnDragLeave(event)" ondrop="onColumnDrop(event)"`;
    const cardsHtml = (esSourcing ? gateIntake.map(p => renderGateCard(p, GATE_INTAKE)).join('') : '')
      + cardsInPhase.map(p => renderPipelineCard(p, phase)).join('');
    boardHtml += `
    <div class="rb-phase">
      <div class="rb-phase-header"><div class="rb-phase-dot" style="background:${phase.color}"></div><span class="rb-phase-title">${phase.label}</span><span class="rb-phase-count">${totalCount}</span></div>
      <div class="rb-phase-cards" ${dropAttrs}>${totalCount === 0 ? `<p style="color:var(--text-muted);font-size:var(--fs-sm)">Sin postulaciones aquí</p>` : cardsHtml}</div>
    </div>`;
    if (i === 1) boardHtml += renderGateColumn(GATE_GO_INTERNO, 'GO Interno', goInterno);
    if (i === 2) boardHtml += renderGateColumn(GATE_CLIENTE, 'Decisión Cliente', gateCliente);
  });
  return boardHtml;
}

/* Disclosure progresivo para las sub-secciones del Historial que quedan

   flags, Hard skills) -- a diferencia de la Guía de Pre-screening o el

function renderPipelineBoard() {
  const clientes = [...new Set(POSTULACIONES.map(p => p.cliente))].sort();
  const filtered = postulacionesFiltradas();
  const activas = filtered.filter(p => !SALIDAS.includes(p.etapa));
  const archivadas = filtered.filter(p => SALIDAS.includes(p.etapa));
  /* Con el buscador activo, cualquier swimlane de cliente/vacante que sí
     tenga resultados se auto-expande (ignora el colapso guardado) -- si
     no, buscar a alguien seguiría requiriendo abrir cliente por cliente
     para encontrarlo, que es justo la fricción que el buscador resuelve. */
  const q = normalizarBusqueda(state.pl.query);

  /* Lanes: una fila de tablero por vacante, para ver de un vistazo a qué
     vacantes está postulando cada candidato y cómo avanza cada búsqueda
     por separado, en vez de una sola columna mezclando todo. Se ordenan
     igual que el resto de la app: prioridad de la vacante primero, luego
     cuantas postulaciones activas tiene (las mas movidas arriba). */
  const porVacante = {};
  activas.forEach(p => { (porVacante[p.vacanteId] = porVacante[p.vacanteId] || []).push(p); });
  const vacanteIdsConPipeline = new Set(Object.keys(porVacante).map(Number));

  /* Vacantes sin ningún candidato todavía: antes eran directamente
     invisibles en el tablero (solo se creaba lane si había postulaciones).
     Ahora también entran, con un empty state en vez de desaparecer del
     radar -- es la única forma de notar que una vacante abierta necesita
     sourcing. */
  const vacantesVacias = VACANTES.filter(v => {
    if (esVacanteTerminal(v.estado)) return false;
    if (vacanteIdsConPipeline.has(v.id)) return false;
    if (state.pl.scope === 'mias' && v.recruiter !== 'Ana Ruiz') return false;
    if (state.pl.cliente && v.cliente !== state.pl.cliente) return false;
    if (state.pl.recruiterFilter && v.recruiter !== state.pl.recruiterFilter) return false;
    if (state.pl.prioridadFiltro && v.priority !== state.pl.prioridadFiltro) return false;
    /* Buscando texto no tiene sentido mostrar vacantes vacías que ni
       siquiera calzan con lo buscado -- solo se cuelan las que sí matchean
       por título/cliente (nunca tienen candidato que matchear, están
       vacías). */
    if (q && !normalizarBusqueda(`${v.titulo} ${v.cliente}`).includes(q)) return false;
    return true;
  });
  vacantesVacias.forEach(v => { porVacante[v.id] = []; });
  const laneIds = Object.keys(porVacante).map(Number);

  /* Jerarquía de lanes: Cliente -> Vacante -> Candidato. Se agrupa primero
     por cliente (ordenado por volumen total de pipeline, luego alfabético),
     y dentro de cada cliente las vacantes mantienen el orden por prioridad
     + tamaño de pipeline que ya tenía el tablero plano. */
  const porCliente = {};
  laneIds.forEach(vacanteId => {
    const v = VACANTES.find(x => x.id === vacanteId);
    const clienteId = v ? v.clienteId : 0;
    (porCliente[clienteId] = porCliente[clienteId] || []).push(vacanteId);
  });
  const clienteIds = Object.keys(porCliente).map(Number);
  clienteIds.forEach(clienteId => {
    porCliente[clienteId].sort((idA, idB) => {
      const va = VACANTES.find(x => x.id === idA), vb = VACANTES.find(x => x.id === idB);
      const pa = va ? PRIORITY_ORDER[va.priority] : 99, pb = vb ? PRIORITY_ORDER[vb.priority] : 99;
      if (pa !== pb) return pa - pb;
      return porVacante[idB].length - porVacante[idA].length;
    });
  });
  clienteIds.sort((a, b) => {
    const ca = CLIENTES.find(c => c.id === a), cb = CLIENTES.find(c => c.id === b);
    return (ca ? ca.nombre : '').localeCompare(cb ? cb.nombre : '');
  });

  const renderLane = (vacanteId) => {
    const items = porVacante[vacanteId];
    const v = VACANTES.find(x => x.id === vacanteId);
    const colapsado = q ? false : !!state.pl.lanesCollapsed[vacanteId];
    const titulo = v ? v.titulo : items[0].vacante;
    const vacio = items.length === 0;
    return `<div class="rb-lane${vacio ? ' rb-lane-empty' : ''}" data-vacante-id="${vacanteId}">
      <div class="rb-lane-header" onclick="toggleLaneCollapse(${vacanteId})">
        <span class="rb-group-chevron">${colapsado ? icon('chevronRight',11) : icon('chevronDown',11)}</span>
        <span class="rb-lane-title">${esc(titulo)}</span>
        <div style="display:flex;align-items:center;gap:var(--sp-3);margin-left:auto">
          ${v ? priorityBadge(v.priority) : ''}
          ${v ? slaBadge(slaDeVacante(v.id)) : ''}
          <span class="rb-phase-count" style="margin-left:0">${vacio ? 'Sin candidatos todavía' : items.length + ' en pipeline'}</span>
          <button class="rb-link sm" onclick="event.stopPropagation(); goToVacante(${vacanteId})">Ver posición ${icon('arrowUpRight',12)}</button>
        </div>
      </div>
      ${colapsado ? '' : (vacio
        ? `<div class="rb-empty rb-empty-lane"><span>${icon('users',22)}</span><p>Todavía no hay candidatos en el pipeline de esta posición.</p><button class="btn secondary sm" onclick="goToVacante(${vacanteId})">Ir a la posición</button></div>`
        : `<div class="rb-board rb-board-lane">${renderBoardColumns(items)}</div>`)}
    </div>`;
  };

  const clientesHtml = clienteIds.map(clienteId => {
    const vacanteIdsDeCliente = porCliente[clienteId];
    const cObj = CLIENTES.find(c => c.id === clienteId);
    const vFallback = VACANTES.find(x => x.id === vacanteIdsDeCliente[0]);
    const nombreCliente = cObj ? cObj.nombre : (vFallback ? vFallback.cliente : 'Sin cliente');
    const totalPipeline = vacanteIdsDeCliente.reduce((sum, id) => sum + porVacante[id].length, 0);
    /* Swimlanes de cliente colapsados por defecto: si la key no existe
       todavía en clientesCollapsed se trata como colapsado (true), no
       expandido -- solo queda expandido si se guardó explícitamente false. */
    const colapsadoCliente = q ? false : state.pl.clientesCollapsed[clienteId] !== false;
    return `<div class="rb-cliente-lane-group">
      <div class="rb-group-header" onclick="toggleClienteLaneCollapse(${clienteId})">
        <span class="rb-group-chevron">${colapsadoCliente ? icon('chevronRight',11) : icon('chevronDown',11)}</span>
        ${clienteLogo(nombreCliente, 'sm')}
        <span class="rb-group-label">${esc(nombreCliente)} · ${vacanteIdsDeCliente.length} ${vacanteIdsDeCliente.length === 1 ? 'posición' : 'posiciones'}</span>
        <span class="rb-phase-count">${totalPipeline} en pipeline</span>
      </div>
      ${colapsadoCliente ? '' : `<div class="rb-lanes">${vacanteIdsDeCliente.map(renderLane).join('')}</div>`}
    </div>`;
  }).join('');

  const archiveList = archivadas.map(p => {
    const c = CANDIDATOS.find(x => x.id === p.candidatoId);
    const hl = state.pl.highlightId === p.id ? 'rb-highlight' : '';
    return `<div id="post-card-${p.id}" class="card compact rb-archive-card ${hl}" onclick="openPostulacionDetail(${p.id})">
      <div class="rb-card-name-row"><p class="rb-card-name">${esc(c.nombre)}</p><button class="rb-link sm" onclick="event.stopPropagation(); goToTalentDatabase(${c.id})">${icon('arrowUpRight',12)}</button></div>
      <p class="rb-card-sub">${icon('briefcase',12)} ${esc(p.vacante)} · ${esc(p.cliente)}</p>
      <div class="rb-archive-reason">${esc(ETAPA_LABELS[p.etapa])}</div>
    </div>`;
  }).join('');

  const vacantesConPipeline = laneIds.filter(id => porVacante[id].length > 0).length;

  return `
    <h1 class="rb-title rb-display">Pipeline</h1>
    <div class="rb-filters">
      <div class="rb-inline-search">
        ${icon('search', 14)}
        <input id="pl-search" value="${esc(state.pl.query)}" placeholder="Buscar candidato o posición…" oninput="state.pl.query=this.value; render()" />
        ${state.pl.query ? `<button type="button" class="rb-inline-search-clear" aria-label="Limpiar búsqueda" onclick="state.pl.query=''; render()">${icon('x', 12)}</button>` : ''}
      </div>
      <div class="segmented">
        <button aria-pressed="${state.pl.scope === 'todo'}" onclick="state.pl.scope='todo'; render()">Todo el equipo</button>
        <button aria-pressed="${state.pl.scope === 'mias'}" onclick="state.pl.scope='mias'; render()">Mis postulaciones</button>
      </div>
      ${renderSelect('pl-cliente-f', [{ value: '', label: 'Todos' }, ...clientes.map(c => ({ value: c, label: c }))], state.pl.cliente, 'Todos', 'state.pl.cliente=value; render();', null, 'Cliente')}
      ${renderSelect('pl-prioridad-f', [{ value: '', label: 'Todas' }, ...['High', 'Medium', 'Low'].map(p => ({ value: p, label: p }))], state.pl.prioridadFiltro, 'Todas', 'state.pl.prioridadFiltro=value; render();', null, 'Prioridad')}
      ${renderRecruiterFilterFacepile()}
    </div>
    <div class="rb-toolbar-row">
      <div class="rb-results-count" style="margin:0">${icon('briefcase',14)} ${vacantesConPipeline} ${vacantesConPipeline === 1 ? 'posición' : 'posiciones'} con pipeline activo${vacantesVacias.length ? ` · ${vacantesVacias.length} sin candidatos todavía` : ''}</div>
      ${laneIds.length > 0 ? (() => {
        /* El "checked" se basa solo en el nivel de cliente (colapsado por
           defecto) -- es el que controla si algo se ve o no. Las lanes
           individuales por debajo arrancan "expandidas" (lanesCollapsed
           default false), pero eso es irrelevante mientras su cliente
           esté colapsado y no se vean igual; usarlas acá haría que el
           switch arranque en "off" aunque visualmente no haya nada
           expandido todavía. */
        const plAllCollapsed = clienteIds.every(id => state.pl.clientesCollapsed[id] !== false);
        return renderCollapseSwitch('pl-collapse', plAllCollapsed, `collapseAllLanes(${!plAllCollapsed}, ${JSON.stringify(laneIds)}, ${JSON.stringify(clienteIds)})`);
      })() : ''}
    </div>
    ${laneIds.length === 0 ? `<div class="rb-empty">${icon('columns',28)}<p>${q ? `Sin resultados para "${esc(state.pl.query)}" — probá con el nombre del candidato o el título de la posición.` : 'No hay posiciones ni postulaciones que calcen con este filtro.'}</p></div>` : `<div class="rb-lanes">${clientesHtml}</div>`}
    <div class="rb-archive">
      <div class="rb-archive-header" onclick="state.pl.archiveOpen=!state.pl.archiveOpen; render()">${state.pl.archiveOpen ? icon('chevronDown',11) : icon('chevronRight',11)} Salidas recientes (${archivadas.length}) — fuera del flujo activo</div>
      ${state.pl.archiveOpen ? `<div class="rb-archive-list">${archiveList}</div>` : ''}
    </div>`;
}

/* =========================================================================
   DETALLE DE POSTULACION (drawer de Pipeline)
   ========================================================================= */
const RESULTADO_COLOR = { 'Cumple': 'var(--success-text)', 'Cumple parcialmente': 'var(--warning-text)', 'No cumple': 'var(--danger-text)', 'Revisión adicional': 'var(--cyan-text)' };

function checkRow(on, label, onclickExpr) {
  return `<div class="rb-checklist-row ${on ? '' : 'off-text'}">
    <div class="rb-checklist-icon ${on ? 'on' : 'off'}">${on ? icon('check',11) : ''}</div>
    <span style="flex:1">${esc(label)}</span>
    ${(on && onclickExpr) ? `<button class="rb-link sm" onclick="${onclickExpr}">Ver ${icon('arrowUpRight',11)}</button>` : ''}
  </div>`;
}
/* Marker circular de la línea de tiempo -- un solo componente para las 2
   escalas (24px en gates, 18px en sub-pasos): sin color = círculo hueco
   gris (todavía no pasó, sin necesidad de escribir "Pendiente"); con
   color = ✓/✕/● de ese color, mismo criterio que ya usan el resto de las
   pastillas de la app (fondo color+22, ícono/texto en ese color). */
function timelineMarkerHtml(color, iconName, size) {
  if (!color) return `<div class="rb-timeline-marker" style="width:${size}px;height:${size}px"></div>`;
  return `<div class="rb-timeline-marker" style="width:${size}px;height:${size}px;background:${color}22;border-color:${color};color:${color}">${icon(iconName, Math.round(size * 0.55))}</div>`;
}
/* Veredicto de un gate -- combina lo persistido explícitamente (solo
   Identificado y Decisión Cliente lo guardan hoy) con lo que se puede
   derivar de en qué etapa quedó la postulación, para que el Historial del
   proceso muestre el marker "Aprobado"/"Rechazado" incluso en
   postulaciones que ya avanzaron sin que ese gate haya guardado un
   sustento propio (ej. GO Interno, que no persiste sustento -- ver
   handleVerdict). */
/* 'actual': el gate es literalmente donde está la postulación ahora mismo
   (p.etapa) y todavía no tiene veredicto -- se distingue del hueco/gris
   genérico (gate futuro, ni siquiera se alcanzó) con el acento de la app.
   Es la señal de "el formulario de abajo es acá, actúa acá". */
function gateMarkerHtml(tipo, esActual) {
  if (tipo) return timelineMarkerHtml(tipo === 'aprobar' ? 'var(--success-text)' : 'var(--danger-text)', tipo === 'aprobar' ? 'check' : 'x', 24);
  if (esActual) return timelineMarkerHtml('var(--accent)', 'dot', 24);
  return timelineMarkerHtml(null, null, 24);
}
/* Fila combinada de una etapa de evaluación (Screening/Técnica): antes
   eran DOS filas separadas -- "Decisión X" (resolverDecisiones) y "X"
   (resolverEntrevistas) -- que en los hechos son siempre el mismo estado
   (ambas usan el mismo umbral de idx), así que se mostraban duplicadas.
   Se muestran simplificadas: marker + resultado + a quién entrevistó,
   sin repetir el párrafo de feedback y el de notas (cuentan básicamente
   lo mismo) -- el detalle largo vive en el sustento del gate si aplica.
   extraHtml permite colgar contenido propio de ese paso (ej. la Guía de
   Pre-screening bajo "Screening", ver más abajo) sin otro nivel de card.
   esActual distingue el paso donde la postulación está justo ahora
   (todavía sin decisión) del paso que ni siquiera se alcanzó -- mismo
   criterio que ya usan gateMarkerHtml y pasoSimpleHtml (dot de acento en
   vez del marker hueco genérico), que antes no aplicaba acá: Screening/
   Entrevista Técnica en curso se veían idénticos a una etapa futura. */
function etapaHistorialRowHtml(nombre, decision, entrevista, esActual, fecha, extraHtml) {
  const marker = decision
    ? timelineMarkerHtml(RESULTADO_COLOR[decision.resultado], decision.resultado === 'Cumple' ? 'check' : decision.resultado === 'No cumple' ? 'x' : 'dot', 18)
    : esActual ? timelineMarkerHtml('var(--accent)', 'dot', 18)
    : timelineMarkerHtml(null, null, 18);
  const resultadoLabel = decision ? ` <span style="color:${RESULTADO_COLOR[decision.resultado]};font-weight:600">· ${esc(decision.resultado)}</span>` : '';
  const entrevistadorLine = (entrevista && entrevista.hecha)
    ? `<div class="rb-entrevistador">${esc(entrevista.entrevistador.nombre)} · ${esc(entrevista.entrevistador.rol)}</div>` : '';
  return `<div class="rb-subtimeline-item">
    ${marker}
    <div><div class="rb-decision-name">${esc(nombre)}${resultadoLabel}</div>${fechaEtapaHtml(fecha)}${entrevistadorLine}${extraHtml || ''}</div>
  </div>`;
}
/* Paso de una entrevista sin decisión asociada (solo Fase Cliente, que no
   tiene un "resolverDecisiones" propio) -- si aparece en el historial es
   porque ya se hizo (ver resolverEntrevistas), así que el marker siempre
   es un check. Simplificado igual que etapaHistorialRowHtml. extraHtml
   cuelga la acción de avanzar cuando la postulación está justo en esa
   etapa (ver avanzarActionHtml). */
function entrevistaRowHtml(e, fecha, extraHtml) {
  return `<div class="rb-subtimeline-item">
    ${timelineMarkerHtml('var(--success-text)', 'check', 18)}
    <div><div class="rb-decision-name">${esc(e.tipo)}</div>${fechaEtapaHtml(fecha)}<div class="rb-entrevistador">${esc(e.entrevistador.nombre)} · ${esc(e.entrevistador.rol)}</div>${extraHtml || ''}</div>
  </div>`;
}
/* Paso "de puente" sin decisión ni entrevista (Agendamiento, Presentado a
   Cliente, Oferta, Contratado) -- etapas que no son gate pero sí son
   parte del proceso, con su propia acción de avanzar cuando la
   postulación está justo ahí. Antes esa acción solo vivía en el stepper
   compacto de arriba; acá queda también a la altura del paso que le
   corresponde dentro del Historial. */
function pasoSimpleHtml(nombre, hecho, esActual, fecha, extraHtml) {
  const marker = hecho ? timelineMarkerHtml('var(--success-text)', 'check', 18)
    : esActual ? timelineMarkerHtml('var(--accent)', 'dot', 18)
    : timelineMarkerHtml(null, null, 18);
  return `<div class="rb-subtimeline-item">
    ${marker}
    <div><div class="rb-decision-name">${esc(nombre)}</div>${fechaEtapaHtml(fecha)}${extraHtml || ''}</div>
  </div>`;
}
/* El horario que el candidato eligió al agendar no es un campo real del
   modelo (el link de agendamiento y la elección del candidato son
   simulados, ver esAgendamiento) -- se deriva de forma estable a partir
   de p.id y p.dateIdentified para no tener que agregar un campo a cada
   postulación que ya pasó por Agendamiento. */
function horarioAgendadoSimulado(p, salt = 0) {
  const horas = ['09:00', '10:00', '11:00', '14:00', '15:00', '15:30', '16:00', '17:00'];
  const hora = horas[(p.id + salt) % horas.length];
  const fecha = new Date(p.dateIdentified + 'T00:00:00');
  fecha.setDate(fecha.getDate() + 2 + ((p.id + salt) % 5) + salt * 5);
  const fechaLabel = fecha.toLocaleDateString('es-PE', { day: 'numeric', month: 'short' });
  return `${fechaLabel} · ${hora}`;
}
/* Fecha simulada de cuándo la postulación llegó a una etapa dada -- mismo
   criterio que horarioAgendadoSimulado (no hay fecha por etapa en el
   modelo real, ver moveTo, que solo resetea `dias`), se deriva de forma
   estable a partir de p.id/p.dateIdentified indexando la etapa en
   FULL_ORDER, para que toda postulación mock tenga una fecha coherente y
   creciente en cada paso ya alcanzado del Historial, sin necesidad de
   agregar un campo nuevo. */
function fechaEtapaSimulada(p, etapa) {
  const ordenIdx = FULL_ORDER.indexOf(etapa);
  const fecha = new Date(p.dateIdentified + 'T00:00:00');
  let dias = 0;
  for (let i = 1; i <= ordenIdx; i++) dias += 2 + ((p.id + i) % 5);
  fecha.setDate(fecha.getDate() + dias);
  return fecha.toLocaleDateString('es-PE', { day: 'numeric', month: 'short' });
}
/* Línea chica de fecha bajo el nombre de cada paso del Historial -- mismo
   lenguaje visual que .rb-card-days (ícono de reloj + texto muted) que ya
   usa el kanban para "hoy"/"Xd", reusado acá para "cuándo pasó" en vez de
   "hace cuánto está en la etapa actual". `label` es opcional -- los
   sub-pasos (Screening, Oferta, etc.) no lo necesitan porque la fecha
   queda pegada a su propio nombre, sin ambigüedad; los 4 nodos principales
   (Identificado/GO Interno/Decisión Cliente/Cierre) sí lo llevan (ver más
   abajo) porque agrupan varios sub-pasos con sus propias fechas, y una
   fecha suelta sin verbo ahí se leía como flotando sin dueño claro. */
function fechaEtapaHtml(fecha, label) {
  return fecha ? `<div class="rb-card-days" style="margin-top:2px">${icon('clock',11)} ${label ? esc(label) + ' ' : ''}${esc(fecha)}</div>` : '';
}
function openDoc(tipo) { state.docAbierto = tipo; render(); }
function confirmarVeredictoDetalle(postulacionId, gateId) {
  handleVerdict(postulacionId, gateId, state.postVerdictDraft, state.postVerdictFb);
  state.postVerdictDraft = null; state.postVerdictFb = '';
  render();
}

function renderPostulacionDrawerBody() {
  const p = POSTULACIONES.find(x => x.id === state.pl.selectedId);
  if (!p) return '';
  const candidato = CANDIDATOS.find(c => c.id === p.candidatoId);
  const decisiones = resolverDecisiones(p);
  const entrevistas = resolverEntrevistas(p);
  const checklist = resolverChecklist(p);
  const documentos = resolverDocumentos(p, candidato);
  const checklistCompleto = Object.values(checklist).every(Boolean);
  const idx = idxEnOrden(p);
  const checklistHabilitado = idx >= FULL_ORDER.indexOf(GATE_GO_INTERNO);
  const enGate = p.etapa === GATE_INTAKE || p.etapa === GATE_GO_INTERNO || p.etapa === GATE_CLIENTE;
  /* "Se retira" ya no vive como acción rápida en la card del kanban -- se
     movió acá, al detalle de la postulación, porque es una acción que
     termina el proceso y no debería tomarse con un click apurado desde el
     tablero. Solo tiene sentido si el proceso sigue activo. */
  const puedeRetirarse = !SALIDAS.includes(p.etapa) && p.etapa !== 'contratado';
  /* Blacklist comparte exactamente la misma elegibilidad que "Se retira"
     -- cualquier fase activa del proceso, nunca sobre algo ya terminal
     (ya en blacklist/rechazado/contratado/etc). */
  const puedeBlacklistear = puedeRetirarse;
  /* Transición de etapa desde el detalle: mismo criterio que ya usa la
     tarjeta del kanban (handleAdvance / SIGUIENTE) -- nunca salta etapas ni
     evita un gate, solo avanza a la inmediata siguiente. No se muestra si
     ya está en un gate (ahí el veredicto es la única forma de avanzar,
     ver verdictFormHtml) ni si el proceso ya es terminal o salió del pipeline. */
  const siguienteEtapa = SIGUIENTE[p.etapa];
  const puedeAvanzar = !enGate && p.etapa !== 'contratado' && !SALIDAS.includes(p.etapa) && !!siguienteEtapa;
  const esGateSiguiente = siguienteEtapa === GATE_GO_INTERNO || siguienteEtapa === GATE_CLIENTE;

  /* El stepper compacto de puntitos+fases que vivía acá arriba se quitó:
     todo lo que mostraba (fases, gates, etapa actual) ya lo cubre el
     Historial del proceso de más abajo con más detalle, y el badge del
     header ya repite "etapa actual" -- tenerlo también acá era la misma
     información 2 veces, con el agravante de que el botón de avanzar
     terminó duplicado literalmente (uno acá, otro en el paso del
     Historial que le corresponde, ver avanzarActionHtml). El Historial
     pasa a ser la única fuente de verdad del progreso. */
  /* En Agendamiento, "avanzar" en realidad representa que el candidato ya
     entró al link y eligió un horario (acción del candidato, simulada
     acá por el recruiter) -- el copy y el ícono lo reflejan, mismo
     criterio que la card compacta del kanban (ver renderPipelineCard). */
  const esAgendamiento = esEtapaAgendamiento(p.etapa);
  const avanzarIcon = esAgendamiento ? 'calendar' : 'chevronRight';
  const avanzarLabel = esAgendamiento ? 'Candidato agendó su horario' : esGateSiguiente ? labelEnviarAGate(siguienteEtapa) : esc(labelAvanzar(siguienteEtapa));
  /* Botón de avanzar colgado del paso correspondiente dentro del Historial
     del proceso -- ver dónde se usa más abajo (Agendamiento, Screening,
     Entrevista Técnica, Presentado a Cliente, Fase Cliente, Oferta). Las
     etapas que no son gate también son parte del proceso y su acción de
     avanzar vive acá igual que el veredicto de un gate (verdictFormHtml). */
  const avanzarActionHtml = puedeAvanzar
    ? `<div style="margin-top:var(--sp-2)"><button class="btn sm" onclick="handleAdvance(${p.id})">${icon(avanzarIcon, 12)} ${avanzarLabel}</button></div>` : '';
  /* Screening y Entrevista Técnica son evaluaciones reales, no un simple
     trámite -- el candidato puede no dar la talla ahí, no solo avanzar.
     Se agrega "Culminar participación" junto al botón de avanzar (ver
     abrirCulminarModal), a diferencia de Agendamiento/Presentado a
     Cliente/Fase Cliente/Oferta, que sí son puro trámite de estado. */
  const accionesScreeningTecnica = puedeAvanzar
    ? `<div class="rb-verdict-row" style="margin-top:var(--sp-2)">
        <button class="btn sm" onclick="handleAdvance(${p.id})">${icon(avanzarIcon, 12)} ${avanzarLabel}</button>
        <button class="btn danger sm" onclick="abrirCulminarModal(${p.id})">${icon('x', 12)} Culminar participación</button>
      </div>` : '';

  /* El formulario de veredicto de un gate ya no vive en una card aparte
     (border cyan) antes del Historial del proceso: se inyecta DENTRO del
     ítem de la línea de tiempo que le corresponde (Identificado/GO
     Interno/Decisión Cliente es literalmente p.etapa mientras se está
     decidiendo), como su contenido "en progreso" -- el marker en acento
     de ese ítem (ver gateMarkerHtml) ya señala que es el paso activo, así
     que no hace falta otra card con borde para distinguirlo. */
  let verdictFormHtml = '';
  if (enGate) {
    const esIdentificado = p.etapa === GATE_INTAKE;
    const disabledAprobar = (p.etapa === GATE_GO_INTERNO && !checklistCompleto);
    let verdictBody;
    if (state.postVerdictDraft) {
      /* Solo descartar/rechazar llegan acá con el textarea -- aprobar ya
         no pasa por este flujo, se confirma desde un modal aparte sin
         pedir texto (ver abrirAprobarModal más abajo). */
      const tipo = state.postVerdictDraft;
      const placeholder = esIdentificado ? 'Motivo del descarte (obligatorio)' : 'Motivo del rechazo';
      const sustentoFaltante = esIdentificado && !state.postVerdictFb.trim();
      verdictBody = `
        <div class="rb-verdict-form">
          <textarea id="post-feedback" rows="2" placeholder="${placeholder}" oninput="state.postVerdictFb=this.value${esIdentificado ? '; render()' : ''}">${esc(state.postVerdictFb)}</textarea>
          ${sustentoFaltante ? `<p class="rb-hint" style="color:var(--warning-text);margin:4px 0 0">El sustento es obligatorio para confirmar esta transición.</p>` : ''}
          <div class="rb-verdict-confirm">
            <button class="btn secondary sm" onclick="state.postVerdictDraft=null; state.postVerdictFb=''; render()">Cancelar</button>
            <button class="btn danger sm" ${sustentoFaltante ? 'disabled' : ''} onclick="confirmarVeredictoDetalle(${p.id}, '${p.etapa}')">Confirmar</button>
          </div>
        </div>`;
    } else if (esIdentificado) {
      verdictBody = `
        <div class="rb-verdict-row">
          <button class="btn sm" onclick="abrirAprobarModal(${p.id})">${icon('check',12)} Aprobar</button>
          <button class="btn danger sm" onclick="state.postVerdictDraft='descartar'; state.postVerdictFb=''; render()">${icon('x',12)} Descartar</button>
        </div>`;
    } else {
      verdictBody = `
        <div class="rb-verdict-row">
          <button class="btn sm" ${disabledAprobar ? 'disabled' : ''} onclick="abrirAprobarModal(${p.id})">${icon('check',12)} ${p.etapa === GATE_GO_INTERNO ? 'Aprobar y enviar al cliente' : 'Aprobar'}</button>
          <button class="btn danger sm" onclick="state.postVerdictDraft='rechazar'; render()">${icon('x',12)} Rechazar</button>
        </div>`;
    }
    /* En GO Interno el checklist de envío se decide acá mismo -- se
       incorpora dentro de la caja del gate, justo antes de los botones de
       Aprobar/Rechazar, en vez de vivir aparte más abajo (ver
       checklistHistorialHtml en el Historial del proceso, que ahora solo
       lo repite una vez que la postulación ya salió de este gate). */
    const checklistInlineHtml = p.etapa === GATE_GO_INTERNO ? `
      <div class="rb-checklist-section" style="margin-bottom:var(--sp-4)">
        <h3 class="rb-subsection-label" style="margin-top:0">Checklist de Envío</h3>
        <span class="rb-checklist-summary" style="background:${checklistCompleto ? 'rgba(60,203,127,.15)' : 'rgba(255,176,32,.15)'};color:${checklistCompleto ? 'var(--success)' : 'var(--warning)'}">${checklistCompleto ? icon('check',12) + ' Completo' : 'Incompleto — no se puede enviar al cliente todavía'}</span>
        ${checkRow(checklist.referencias, 'Referencias verificadas')}
        ${checkRow(checklist.briefAprobado, 'Brief', documentos ? "openDoc('brief')" : null)}
        ${checkRow(checklist.cvFormatoRumbo, 'CV en formato Rumbo', documentos ? "openDoc('cv')" : null)}
        ${checklist.cvFormatoRumbo ? `<p class="rb-hint" style="margin:4px 0 0 26px">Se envió la solicitud de actualización al candidato — la completa desde su acceso a la plataforma.</p>` : ''}
      </div>` : '';
    /* Una sola línea de instrucción, sin negrita -- antes había un
       encabezado en negrita ("Verifica el matching antes de continuar")
       seguido de un párrafo que decía básicamente lo mismo, compitiendo
       visualmente con los encabezados reales de sección (Matching,
       Checklist). Acá la instrucción es una nota discreta, no un título.
       Decisión Cliente no es "enviarle algo al cliente para que decida"
       -- ya se le envió el candidato en GO Interno y ya dio su feedback
       en Fase Cliente; acá Rumbo solo registra esa decisión, que no es
       propia. Antes este gate compartía el mismo texto que GO Interno
       ("...antes de enviarla al cliente"), lo cual describía al revés
       quién decide en cada uno. */
    const instruccionGate = esIdentificado
      ? 'Revisa el Matching de CV vs Job Description de arriba y decide si el candidato continúa en el proceso o queda descartado.'
      : p.etapa === GATE_CLIENTE
      ? 'Registra la decisión que ya tomó el cliente sobre este candidato.'
      : 'Valida la información del candidato antes de enviarla al cliente.';
    verdictFormHtml = `
      <div class="rb-timeline-extra">
        <p class="rb-hint" style="margin:0 0 var(--sp-3)">${icon('sparkles',12)} ${instruccionGate}</p>
        ${(esIdentificado && p.origenIdentificacion === 'revision_automatica') ? `<p class="rb-hint" style="margin-bottom:var(--sp-3)">${icon('search',12)} Identificado por revisión automática interna — el candidato ya estaba en la base de datos, sin cliente asignado, y el sistema detectó que calza con los requisitos de esta posición.</p>` : ''}
        ${checklistInlineHtml}
        ${(p.etapa === GATE_GO_INTERNO && !checklistCompleto) ? `<p class="rb-hint" style="color:var(--warning-text);margin-bottom:var(--sp-3)">El checklist debe estar completo antes de poder aprobar — aprobar aquí envía directo al cliente.</p>` : ''}
        ${verdictBody}
      </div>`;
  }

  /* ---- Matching de CV vs. JD -- cálculo automático (ver
     matchmakingBaseline), generado desde el momento en que se crea la
     postulación (Intake). Antes vivía como card aparte; se muestra dentro
     del paso "Identificado" del Historial, que es donde se genera/consulta
     para decidir el gate -- no es información nueva, solo dejó de estar
     separada de en qué momento del proceso corresponde. La única forma de
     ajustarlo a mano es la Guía de Pre-screening (ver abajo, colgada del
     paso "Screening"), mientras la postulación está en esa etapa -- acá
     siempre es de solo lectura. ---- */
  const mm = getMatchmaking(p);
  const mmScore = matchmakingScoreFinal(mm.dims);
  const mmDimsHtml = MATCHMAKING_DIMENSIONES.map(d => `
    <div class="rb-detail-row">
      <span>${esc(d.nombre)} <span style="color:var(--text-dim)">· ${d.peso}%</span></span>
      <span class="rb-dots">${[1,2,3,4,5].map(n => `<span class="rb-dot${n <= mm.dims[d.key] ? ' filled' : ''}"></span>`).join('')}</span>
    </div>`).join('');
  /* Abierto por defecto solo mientras es el momento real de decidir con
     esto (el propio gate de Identificado) -- después queda colapsado a
     solo el score, con un link para reabrir el detalle por dimensión
     (ver historialSeccionAbierta/toggleHistorialSeccionBtn). */
  const mmAbierta = historialSeccionAbierta(p, 'matching', p.etapa === GATE_INTAKE);
  const matchmakingHtml = `
    <div class="rb-timeline-extra">
      <h3 class="rb-subsection-label" style="margin-top:0">Matching de CV vs Job Description</h3>
      <div class="rb-score-row" style="margin:0 0 var(--sp-1)"><div class="rb-score-bar"><div class="rb-score-fill" style="width:${mmScore}%"></div></div><span class="rb-score-num">${mmScore}%</span></div>
      ${mmAbierta ? mmDimsHtml : ''}
      ${toggleHistorialSeccionBtn(p, 'matching', mmAbierta)}
    </div>`;

  /* ---- Red flags del CV a validar en Screening (ver resolverRedFlags) --
     mismo criterio que el Matching de arriba: se generan solas al llegar
     a Identificado, para que el recruiter las tenga presentes desde el
     primer momento, no recién cuando ya está en la llamada. Alteran la
     Guía de Pre-screening de abajo (una pregunta más por cada flag) y sus
     respuestas quedan grabadas en el transcript (ver
     resolverTranscriptScreening). Una vez que Screening ya pasó (mismo
     umbral que decisiones.screening/entrevistaPorTipo['Screening'].hecha,
     ver más abajo) dejan de mostrarse -- ya cumplieron su propósito (que
     el recruiter las valide en la llamada) y quedan respondidas en el
     transcript, así que repetirlas acá después sería ruido. ---- */
  const screeningTerminado = idx >= FULL_ORDER.indexOf('agenda_tecnica_enviada');
  const redFlags = resolverRedFlags(p);
  /* Mismo criterio de disclosure que el Matching de arriba: abierto por
     defecto en Identificado (el momento de decidir), colapsado a un
     badge resumen después -- mientras siga visible (ver
     screeningTerminado). */
  const redFlagsAbierta = historialSeccionAbierta(p, 'redflags', p.etapa === GATE_INTAKE);
  const redFlagsResumenHtml = redFlags.length
    ? `<p class="rb-hint" style="color:var(--warning-text)">${icon('alertTriangle',12)} ${redFlags.length} red flag${redFlags.length === 1 ? '' : 's'} a validar</p>`
    : `<p class="rb-hint" style="color:var(--success-text)">${icon('check',12)} Sin red flags detectadas en el CV.</p>`;
  const redFlagsDetalleHtml = redFlags.map(f => `
        <div class="rb-redflag-row rb-redflag-${f.severidad}">
          ${icon('alertTriangle', 14)}
          <div><div class="rb-decision-name">${esc(f.label)}</div><div class="rb-decision-feedback">${esc(f.detalle)}</div></div>
        </div>`).join('');
  const redFlagsHtml = screeningTerminado ? '' : `
    <div class="rb-timeline-extra">
      <h3 class="rb-subsection-label" style="margin-top:0">Red flags a validar en Screening</h3>
      ${redFlagsAbierta ? (redFlags.length ? redFlagsDetalleHtml : redFlagsResumenHtml) : redFlagsResumenHtml}
      ${redFlags.length ? toggleHistorialSeccionBtn(p, 'redflags', redFlagsAbierta) : ''}
    </div>`;

  /* ---- Guía de Pre-screening: visible solo mientras la postulación está
     en Screening -- se cuelga como extraHtml de ese paso puntual dentro de
     GO Interno (ver etapaHistorialRowHtml), en vez de vivir como card
     aparte. Una pregunta estándar por cada arista del Matching de CV vs
     JD, más una pregunta extra por cada red flag detectada en
     Identificado -- de solo lectura, muestra el mismo puntaje que ya
     calculó el matching automático. */
  const guiaScreeningHtml = p.etapa === 'screening' ? `
    <div class="rb-timeline-extra">
      <p class="rb-hint" style="margin:0 0 var(--sp-3)">Apóyate en esta guía de preguntas para la entrevista.</p>
      ${MATCHMAKING_DIMENSIONES.map(d => `
        <div style="padding-bottom:var(--sp-3)">
          <span style="font-size:var(--fs-sm);font-weight:600">${esc(d.nombre)}</span>
          <p style="margin:2px 0 0;color:var(--text-muted);font-size:var(--fs-sm)">${esc(SCREENING_PREGUNTAS[d.key])}</p>
        </div>`).join('')}
      ${redFlags.map(f => `
        <div style="padding-bottom:var(--sp-3)">
          <span style="font-size:var(--fs-sm);font-weight:600;color:var(--warning-text)">${icon('alertTriangle',11)} ${esc(f.label)}</span>
          <p style="margin:2px 0 0;color:var(--text-muted);font-size:var(--fs-sm)">${esc(f.pregunta)}</p>
        </div>`).join('')}
    </div>` : '';

  /* ---- Historial del proceso: consolida en UNA sección lo que antes
     vivían 4 cards sueltas (Sustento Identificado, Las 2 decisiones,
     Checklist de Envío, Entrevistas) -- todas describían, cada una desde
     su ángulo, lo mismo: qué pasó en cada uno de los 3 gates. Se agrupa
     por gate en vez de por tipo de dato. ---- */
  const entrevistaPorTipo = Object.fromEntries(entrevistas.map(e => [e.tipo, e]));

  const identificadoAprobado = idx > FULL_ORDER.indexOf(GATE_INTAKE);
  const identificadoRechazadoTipo = p.etapa === 'blacklisted' ? 'blacklist' : (p.etapa === 'rechazado_rumbo' ? 'descartar' : null);
  const tipoIdentificado = p.veredictoIdentificado || (idx === FULL_ORDER.indexOf(GATE_INTAKE) && identificadoRechazadoTipo ? identificadoRechazadoTipo : (identificadoAprobado ? 'aprobar' : null));

  /* Blacklist se agrega a la condición -- un candidato puesto en blacklist
     estando ya en Entrevista Técnica o después nunca llegó a pasar por
     GO Interno, mismo caso que "Culminar participación" en esa etapa (que
     también resuelve en rechazado_rumbo, ver VEREDICTO[GATE_GO_INTERNO]). */
  const tipoGoInterno = ((p.etapa === 'rechazado_rumbo' || p.etapa === 'blacklisted') && idx >= FULL_ORDER.indexOf('entrevista_tecnica')) ? 'rechazar'
    : (idx > FULL_ORDER.indexOf(GATE_GO_INTERNO) ? 'aprobar' : null);

  const tipoCliente = p.veredictoCliente || (p.etapa === 'rechazado_cliente' ? 'rechazar' : (idx > FULL_ORDER.indexOf(GATE_CLIENTE) ? 'aprobar' : null));

  /* Mientras la postulación está en GO Interno, el checklist ya se muestra
     dentro de verdictFormHtml (ver checklistInlineHtml) -- acá no se repite,
     para no duplicarlo mientras sigue siendo la acción pendiente. No es un
     "paso" más de la línea de tiempo (no tiene un solo estado
     pendiente/hecho, son 3 checks independientes) -- por eso cuelga como
     rb-timeline-extra en vez de un rb-subtimeline-item con marker. */
  const checklistHistorialHtml = (checklistHabilitado && p.etapa !== GATE_GO_INTERNO) ? `
    <div class="rb-timeline-extra">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);margin-bottom:var(--sp-2)"><span class="rb-decision-name">Checklist de Envío</span><span class="rb-checklist-summary" style="background:${checklistCompleto ? 'rgba(60,203,127,.15)' : 'rgba(255,176,32,.15)'};color:${checklistCompleto ? 'var(--success)' : 'var(--warning)'}">${checklistCompleto ? icon('check',12) + ' Completo' : 'Incompleto'}</span></div>
      ${checkRow(checklist.referencias, 'Referencias verificadas')}
      ${checkRow(checklist.briefAprobado, 'Brief', documentos ? "openDoc('brief')" : null)}
      ${checkRow(checklist.cvFormatoRumbo, 'CV en formato Rumbo', documentos ? "openDoc('cv')" : null)}
      ${checklist.cvFormatoRumbo ? `<p class="rb-hint" style="margin:4px 0 0 26px">Se envió la solicitud de actualización al candidato — la completa desde su acceso a la plataforma.</p>` : ''}
      ${idx > FULL_ORDER.indexOf(GATE_GO_INTERNO) ? `<p class="rb-entrevistador" style="margin-top:var(--sp-2)">${icon('check',12)} Ya fue enviado a ${esc(p.cliente)}</p>` : ''}
    </div>` : '';

  /* Cada paso de un gate solo se muestra una vez que la postulación
     efectivamente llegó ahí -- listar por adelantado "Screening",
     "Entrevista Técnica", etc. con marker hueco para una postulación que
     todavía está en Identificado es puro ruido (nada de eso existe
     todavía). La línea de tiempo crece a medida que el proceso avanza, no
     muestra el esqueleto completo desde el día 1.

     Además de los 3 gates, las etapas intermedias que NO son gate
     (Agendamiento, Presentado a Cliente, Oferta/Contratado) también son
     parte del proceso -- se cuelgan del bloque del gate que las precede
     como pasos "puente" (pasoSimpleHtml), con su propia acción de avanzar
     (avanzarActionHtml) cuando la postulación está justo ahí. */
  const agendamientoAlcanzado = idx >= FULL_ORDER.indexOf('agenda_enviada');
  const agendamientoHecho = idx > FULL_ORDER.indexOf('agenda_enviada');
  /* El marker del nodo "Sourcing" (ver gateMarkerHtml más abajo) no puede
     basarse solo en tipoIdentificado -- desde que Sourcing pasó a incluir
     Agendamiento (ver historialHtml), aprobar en Identificado ya no es
     "Sourcing completo": falta que el candidato agende. Si se aprobó pero
     todavía no agendó, se fuerza tipoSourcing a null para que
     gateMarkerHtml caiga al dot de "actual" en vez de mostrar el check
     verde antes de tiempo; sourcingActual cubre tanto el gate en sí como
     la espera del agendamiento. Descartado/blacklist no dependen de esto
     -- ahí el proceso ya terminó, no hay agendamiento que esperar. */
  const tipoSourcing = (tipoIdentificado === 'aprobar' && !agendamientoHecho) ? null : tipoIdentificado;
  const sourcingActual = p.etapa === GATE_INTAKE || p.etapa === 'agenda_enviada';
  /* Una vez agendado, se muestra la hora que el candidato eligió (ver
     horarioAgendadoSimulado) -- mientras todavía está en Agendamiento
     esperando que elija, no hay horario que mostrar, solo el botón de
     avanzar de siempre. */
  const esAgendamientoScreening = p.etapa === 'agenda_enviada';
  const agendamientoExtra = agendamientoHecho
    ? `<div class="rb-entrevistador">${icon('clock',11)} Agendó para el ${esc(horarioAgendadoSimulado(p))}</div>`
    : (esAgendamientoScreening ? avanzarActionHtml : '');
  const agendamientoPaso = agendamientoAlcanzado
    ? pasoSimpleHtml('Agendamiento de Screening', agendamientoHecho, esAgendamientoScreening, fechaEtapaSimulada(p, 'agenda_enviada'), agendamientoExtra) : '';
  const screeningAlcanzado = idx >= FULL_ORDER.indexOf('screening');
  /* Agendamiento de entrevista técnica: mismo patrón que el paso
     "Agendamiento de Screening" de arriba, pero puente entre Screening
     y Entrevista Técnica (ver
     esEtapaAgendamiento/SIGUIENTE). */
  const agendamientoTecnicoAlcanzado = idx >= FULL_ORDER.indexOf('agenda_tecnica_enviada');
  const agendamientoTecnicoHecho = idx > FULL_ORDER.indexOf('agenda_tecnica_enviada');
  const esAgendamientoTecnico = p.etapa === 'agenda_tecnica_enviada';
  const agendamientoTecnicoExtra = agendamientoTecnicoHecho
    ? `<div class="rb-entrevistador">${icon('clock',11)} Agendó para el ${esc(horarioAgendadoSimulado(p, 1))}</div>`
    : (esAgendamientoTecnico ? avanzarActionHtml : '');
  const agendamientoTecnicoPaso = agendamientoTecnicoAlcanzado
    ? pasoSimpleHtml('Agendamiento de entrevista técnica', agendamientoTecnicoHecho, esAgendamientoTecnico, fechaEtapaSimulada(p, 'agenda_tecnica_enviada'), agendamientoTecnicoExtra) : '';
  const tecnicaAlcanzada = idx >= FULL_ORDER.indexOf('entrevista_tecnica');
  /* Transcript de la llamada de Screening, procesado por IA -- acceso de
     solo lectura desde el propio paso de Screening en el Historial (ver
     resolverTranscriptScreening/renderDocModal), no un documento aparte
     que haya que ir a buscar a otro lado. */
  const transcriptScreening = resolverTranscriptScreening(p, candidato);
  const verTranscriptHtml = transcriptScreening
    ? `<div style="margin-top:var(--sp-1)"><button class="rb-link sm" onclick="openDoc('transcript')">${icon('chat',11)} Ver transcript ${icon('arrowUpRight',11)}</button></div>` : '';
  /* Reporte técnico -- visible desde que se llega a Entrevista Técnica,
     ANTES de aprobarla (ver resolverReporteTecnico), para que esa
     aprobación esté sustentada en algo concreto y no sea "a ciegas". */
  const reporteTecnico = resolverReporteTecnico(p, candidato);
  const verReporteHtml = reporteTecnico
    ? `<div style="margin-top:var(--sp-1)"><button class="rb-link sm" onclick="openDoc('reporte')">${icon('barChart',11)} Ver reporte técnico ${icon('arrowUpRight',11)}</button></div>` : '';
  /* Hard skills del candidato como referencia para la Entrevista Técnica --
     reusa hardSkillsRatingHtml (ya usado en el detalle del candidato y en
     el Brief), no un render nuevo. Igual que el Reporte técnico, queda
     visible de forma permanente desde que se llega a esta etapa (no es
     una "chuleta" que se descarta al avanzar, sino parte del registro de
     lo evaluado) -- pero abierta por defecto solo mientras es esta etapa
     la actual (cuando sirve de chuleta en vivo); después queda colapsada,
     ya que el detalle completo y permanente vive en el perfil del
     candidato. */
  const hardSkillsAbierta = historialSeccionAbierta(p, 'hardskills', p.etapa === 'entrevista_tecnica');
  const hardSkillsTecnicaHtml = idx >= FULL_ORDER.indexOf('entrevista_tecnica') ? `
    <div class="rb-timeline-extra">
      <h3 class="rb-subsection-label" style="margin-top:0">Hard skills</h3>
      ${hardSkillsAbierta ? hardSkillsRatingHtml(candidato) : ''}
      ${toggleHistorialSeccionBtn(p, 'hardskills', hardSkillsAbierta)}
    </div>` : '';
  const goInternoSubpasos = [
    screeningAlcanzado ? etapaHistorialRowHtml('Screening', decisiones.screening, entrevistaPorTipo['Screening'], p.etapa === 'screening', fechaEtapaSimulada(p, 'screening'), verTranscriptHtml + guiaScreeningHtml + (p.etapa === 'screening' ? accionesScreeningTecnica : '')) : '',
    agendamientoTecnicoPaso,
    tecnicaAlcanzada ? etapaHistorialRowHtml('Entrevista Técnica', decisiones.tecnica, entrevistaPorTipo['Entrevista Técnica'], p.etapa === 'entrevista_tecnica', fechaEtapaSimulada(p, 'entrevista_tecnica'), hardSkillsTecnicaHtml + verReporteHtml + (p.etapa === 'entrevista_tecnica' ? accionesScreeningTecnica : '')) : '',
  ].filter(Boolean).join('');
  const goInternoBodyHtml = (goInternoSubpasos ? `<div class="rb-subtimeline">${goInternoSubpasos}</div>` : '') + checklistHistorialHtml
    + (p.etapa === GATE_GO_INTERNO ? verdictFormHtml : '');
  /* Mismo bug que ya corregimos para "Sourcing" (ver tipoSourcing/
     sourcingActual): el marker de "Vetting" no puede depender solo de
     `p.etapa === GATE_GO_INTERNO` -- ese nodo agrupa Screening/Agendamiento
     técnico/Entrevista Técnica como sub-pasos, así que está "en curso"
     desde que la postulación entra a cualquiera de ellos, no recién al
     llegar al gate en sí (mismo criterio que ya usaba correctamente
     `ofertaActual` para "Cierre" más abajo). */
  const goInternoActual = p.etapa === GATE_GO_INTERNO || p.etapa === 'screening' || p.etapa === 'agenda_tecnica_enviada' || p.etapa === 'entrevista_tecnica';

  const presentadoAlcanzado = idx >= FULL_ORDER.indexOf('presentado_cliente');
  const presentadoActual = p.etapa === 'presentado_cliente';
  const presentadoPaso = presentadoAlcanzado
    ? pasoSimpleHtml('Presentado a Cliente', idx > FULL_ORDER.indexOf('presentado_cliente'), presentadoActual, fechaEtapaSimulada(p, 'presentado_cliente'), presentadoActual ? avanzarActionHtml : '') : '';
  const clienteSubpasos = [
    presentadoPaso,
    entrevistaPorTipo['Fase Cliente'] ? entrevistaRowHtml(entrevistaPorTipo['Fase Cliente'], fechaEtapaSimulada(p, 'fase_cliente'), p.etapa === 'fase_cliente' ? avanzarActionHtml : '') : '',
  ].filter(Boolean).join('');
  const clienteSubtimelineHtml = clienteSubpasos ? `<div class="rb-subtimeline">${clienteSubpasos}</div>` : '';

  const clienteBodyHtml = clienteSubtimelineHtml + (p.sustentoCliente ? `<p class="rb-resumen" style="margin-top:var(--sp-3)">${esc(p.sustentoCliente)}</p>` : '')
    + (p.etapa === GATE_CLIENTE ? verdictFormHtml : '');
  /* Mismo criterio que goInternoActual: "Con Cliente" agrupa
     Presentado a Cliente y Fase Cliente como sub-pasos, así que está "en
     curso" desde que entra a cualquiera de los dos, no recién al llegar
     al gate. */
  const clienteActual = p.etapa === GATE_CLIENTE || p.etapa === 'presentado_cliente' || p.etapa === 'fase_cliente';

  /* "Cierre" (Oferta → Contratado) es un 4to nodo principal, al mismo
     nivel que los 3 gates -- no un detalle de soporte anidado dentro de
     Decisión Cliente. Llegar a Contratado es el hito final de todo el
     proceso, no un sub-paso más. Solo tiene un paso propio ("Oferta",
     con su acción de avanzar); una vez Contratado, el marker del nodo ya
     es el ✓ -- no hace falta un sub-paso "Contratado" repitiendo el
     mismo check. Sin estado "rechazado": no existe un camino de salida
     modelado desde Oferta (VEREDICTO no lo contempla). */
  const tipoCierre = idx >= FULL_ORDER.indexOf('contratado') ? 'aprobar' : null;
  const ofertaActual = p.etapa === 'oferta';
  const cierreBodyHtml = idx >= FULL_ORDER.indexOf('oferta')
    ? `<div class="rb-subtimeline">${pasoSimpleHtml('Oferta', idx > FULL_ORDER.indexOf('oferta'), ofertaActual, fechaEtapaSimulada(p, 'oferta'), ofertaActual ? avanzarActionHtml : '')}</div>` : '';

  const historialHtml = `
    <div class="rb-detail-section" style="margin-bottom:var(--sp-6)">
      <h3>Historial del proceso</h3>
      <div class="rb-timeline">
        <div class="rb-timeline-item">
          ${gateMarkerHtml(tipoSourcing, sourcingActual)}
          <div class="rb-timeline-name">Sourcing</div>
          ${fechaEtapaHtml(fechaEtapaSimulada(p, GATE_INTAKE), 'Identificado el')}
          ${p.sustentoIdentificado ? `<div class="rb-timeline-extra"><p class="rb-resumen">${esc(p.sustentoIdentificado)}</p></div>` : ''}
          ${matchmakingHtml}
          ${redFlagsHtml}
          ${p.etapa === GATE_INTAKE ? verdictFormHtml : ''}
          ${agendamientoPaso ? `<div class="rb-subtimeline">${agendamientoPaso}</div>` : ''}
        </div>
        <div class="rb-timeline-item">
          ${gateMarkerHtml(tipoGoInterno, goInternoActual)}
          <div class="rb-timeline-name">Vetting</div>
          ${tipoGoInterno ? fechaEtapaHtml(fechaEtapaSimulada(p, GATE_GO_INTERNO), tipoGoInterno === 'aprobar' ? 'Aprobado el' : 'Rechazado el') : ''}
          ${goInternoBodyHtml}
        </div>
        <div class="rb-timeline-item">
          ${gateMarkerHtml(tipoCliente, clienteActual)}
          <div class="rb-timeline-name">Con Cliente</div>
          ${tipoCliente ? fechaEtapaHtml(fechaEtapaSimulada(p, GATE_CLIENTE), tipoCliente === 'aprobar' ? 'Registrado el' : 'Rechazado el') : ''}
          ${clienteBodyHtml}
        </div>
        <div class="rb-timeline-item">
          ${gateMarkerHtml(tipoCierre, ofertaActual)}
          <div class="rb-timeline-name">Cierre</div>
          ${tipoCierre ? fechaEtapaHtml(fechaEtapaSimulada(p, 'contratado'), 'Contratado el') : ''}
          ${cierreBodyHtml}
        </div>
      </div>
    </div>`;

  /* Franja de datos clave del candidato, siempre visible sin importar la
     etapa/gate -- evita que el recruiter tenga que salir al perfil
     completo en Talent DB para ver esto mientras trabaja el pipeline.
     El link de CV es simulado (el modelo no tiene un archivo de CV real
     todavía, solo el "CV en formato Rumbo" gateado a partir de GO Interno
     -- ver resolverDocumentos/openDoc('cv')), armado con el DNI del
     candidato para que sea estable sin agregar un campo a los ~50 mocks. */
  const cvHref = `https://docs.rumbo.la/cv/${candidato.dni}.pdf`;
  const linkedinHref = `https://${candidato.linkedin}`;
  const dispColor = disponibilidadColor(diasDisponibilidad(candidato.disponibilidad));
  const quickFactsHtml = `
    <div class="rb-quickfacts">
      <a class="rb-quickfact" href="${esc(cvHref)}" target="_blank" rel="noopener">${icon('fileText',12)} Ver CV</a>
      <a class="rb-quickfact" href="${esc(linkedinHref)}" target="_blank" rel="noopener">${icon('link',12)} LinkedIn</a>
      <span class="rb-quickfact">${icon('trophy',12)} ${esc(candidato.seniority)}</span>
      <span class="rb-quickfact" style="color:${dispColor}">${icon('clock',12)} ${esc(candidato.disponibilidad)}</span>
      <span class="rb-quickfact">${icon('coin',12)} S/ ${candidato.expectativa.toLocaleString('es-PE')}/mes</span>
    </div>`;

  return `
    <div class="rb-back" onclick="closeDrawer()">${icon('chevronLeft',12)} Volver a Pipeline</div>
    <div class="rb-detail-header">
      <div class="avatar xl">${esc(initials(candidato.nombre))}</div>
      <div><h1 class="rb-detail-name" style="display:flex;align-items:center;gap:6px">
        <button class="rb-link" onclick="goToTalentDatabase(${candidato.id})">${esc(candidato.nombre)} ${icon('arrowUpRight',16)}</button>
        ${puedeRetirarse ? `<button class="rb-icon-btn" title="Se retira del proceso" onclick="abrirRetiroModal(${p.id})">${icon('logOut',14)}</button>` : ''}
        ${puedeBlacklistear ? `<button class="rb-icon-btn rb-icon-btn-danger" title="Poner en blacklist" onclick="abrirBlacklistModal(${p.id})">${icon('ban',14)}</button>` : ''}
      </h1>
      <p class="rb-detail-role"><button class="rb-link" onclick="goToVacante(${p.vacanteId})">${esc(p.vacante)}</button> · ${esc(p.cliente)} · Recruiter: ${esc(recruiterDePostulacion(p) || 'Sin asignar')}</p></div>
      <div class="rb-detail-header-actions">
        <span class="rb-badge" style="background:${ESTADO_COLOR[deriveEstado(p.etapa)]}22;color:${ESTADO_COLOR[deriveEstado(p.etapa)]}">${esc(ETAPA_LABELS[p.etapa] || deriveEstado(p.etapa))}</span>
        ${origenBadge(candidato.origen)}
